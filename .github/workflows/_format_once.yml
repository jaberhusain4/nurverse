name: One-time Dart Formatter

on:
  push:
    branches:
      - fix/format-prayer-live-updates

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - run: dart format lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "chore: format prayer files [skip ci]"
            git push origin HEAD:fix/format-prayer-live-updates
          fi
