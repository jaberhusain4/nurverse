name: Temporary Dart Formatter

on:
  push:
    branches:
      - fix/format-prayer-live-updates

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest branch
        run: |
          git fetch origin fix/format-prayer-live-updates
          git reset --hard origin/fix/format-prayer-live-updates
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Format changed files
        run: |
          dart format lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart
          if git diff --cached --quiet; then
            echo "Already formatted."
          else
            git commit -m "chore: format prayer live update files [skip ci]"
            git push origin HEAD:fix/format-prayer-live-updates
          fi
