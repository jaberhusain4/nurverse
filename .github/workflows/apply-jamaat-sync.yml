name: Apply Jamaat Sync Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/services/jamaat_service.dart')
          s = p.read_text()
          s = s.replace("  static const Map<String, String> _emptyValues = {", "  static const Map<String, String> _dhakaDefaults = {\n    'Fajr': '5:00 AM',\n    'Dhuhr': '1:30 PM',\n    'Asr': '5:15 PM',\n    'Maghrib': '6:57 PM',\n    'Isha': '8:45 PM',\n  };\n\n  static const Map<String, String> _emptyValues = {")
          s = s.replace("          _jamaat[prayer] = '--:--';", "          _jamaat[prayer] = _dhakaDefaults[prayer]!;")
          s = s.replace("  /// No calculated/default Jamaat time exists unless the user configured one.\n  static String defaultTime(String prayer) => '--:--';", "  /// Dhaka reference Jamaat time used when the user has not configured a local mosque time.\n  static String defaultTime(String prayer) => _dhakaDefaults[prayer] ?? '--:--';\n\n  static bool isDhakaDefault(String prayer) => get(prayer) == defaultTime(prayer);")
          s = s.replace("      _jamaat[prayer] = '--:--';\n      await prefs.remove('$_customPrefix$prayer');", "      _jamaat[prayer] = _dhakaDefaults[prayer]!;\n      await prefs.remove('$_customPrefix$prayer');")
          p.write_text(s)

          p = Path('lib/screens/prayer/jamaat_settings_screen.dart')
          s = p.read_text()
          s = s.replace("import '../../providers/settings_provider.dart';", "import '../../providers/settings_provider.dart';\nimport '../../services/jamaat_service.dart';")
          s = s.replace("  final TimeOfDay? initialTime;\n", "  final TimeOfDay? initialTime;\n  final bool is24Hour;\n")
          s = s.replace("    required this.initialTime,\n  });", "    required this.initialTime,\n    required this.is24Hour,\n  });")
          s = s.replace("          initialTime: _parseTime(context.read<SettingsProvider>().getJamaat(prayer)),\n", "          initialTime: _parseTime(context.read<SettingsProvider>().getJamaat(prayer)),\n          is24Hour: context.read<SettingsProvider>().is24Hour,\n")
          s = s.replace("    _hour = initial.hourOfPeriod == 0 ? 12 : initial.hourOfPeriod;", "    _hour = widget.is24Hour ? initial.hour : (initial.hourOfPeriod == 0 ? 12 : initial.hourOfPeriod);")
          s = s.replace("                    isEnglish ? 'Tap to set local Jamaat time' : 'ট্যাপ করে স্থানীয় জামাআতের সময় সেট করুন',", "                    isEnglish\n                        ? (JamaatService.isDhakaDefault(name) ? 'Dhaka default time • Tap to change' : 'Local mosque time • Tap to change')\n                        : (JamaatService.isDhakaDefault(name) ? 'ঢাকার ডিফল্ট সময় • ট্যাপ করে পরিবর্তন করুন' : 'আপনার এলাকার মসজিদের সময় • ট্যাপ করে পরিবর্তন করুন'),")
          p.write_text(s)

          p = Path('lib/widgets/home/prayer_timeline.dart')
          s = p.read_text()
          s = s.replace("import '../../localization/app_localizations.dart';", "import '../../localization/app_localizations.dart';\nimport '../../providers/settings_provider.dart';")
          s = s.replace("    final titleColor =", "    final settings = context.watch<SettingsProvider>();\n    String displayJamaat(String value) {\n      final m = RegExp(r'^(\\d{1,2}):(\\d{2})\\s*(AM|PM)$', caseSensitive: false).firstMatch(value.trim());\n      if (m == null) return value;\n      final hour = int.parse(m.group(1)!);\n      final minute = m.group(2)!;\n      final period = m.group(3)!.toUpperCase();\n      if (!settings.is24Hour) return '$hour:$minute $period';\n      var h = hour % 12;\n      if (period == 'PM') h += 12;\n      return '${h.toString().padLeft(2, '0')}:$minute';\n    }\n\n    final titleColor =")
          s = s.replace("                  jamaat: jamaat,", "                  jamaat: displayJamaat(jamaat),")
          p.write_text(s)

          p = Path('lib/screens/simple_home_screen_v10.dart')
          s = p.read_text()
          old = """                Expanded(child: Text(name, style: theme.textTheme.bodyLarge?.copyWith(fontSize: 15, fontWeight: current ? FontWeight.w800 : FontWeight.w600))),
                if (current) ...[
"""
          new = """                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(name, style: theme.textTheme.bodyLarge?.copyWith(fontSize: 15, fontWeight: current ? FontWeight.w800 : FontWeight.w600)),
                      if ((prayer['jamaat']?.toString() ?? '').trim().isNotEmpty && prayer['jamaat']?.toString() != '--:--')
                        Text(
                          '${languageCode == 'en' ? 'Jamaat:' : 'জামাআত:'} ${_formatJamaat(prayer['jamaat']?.toString() ?? '', context.watch<SettingsProvider>().is24Hour)}',
                          style: TextStyle(color: context.secondaryTextColor, fontSize: 9.5, fontWeight: FontWeight.w600),
                        ),
                    ],
                  ),
                ),
                if (current) ...[
"""
          if old not in s:
              raise SystemExit('V10 timeline target not found')
          s = s.replace(old, new)
          marker = "  IconData _prayerIcon(int index) => const [Icons.nightlight_round, Icons.wb_sunny_outlined, Icons.wb_twilight_rounded, Icons.wb_sunny_rounded, Icons.dark_mode_rounded][index];\n"
          helpers = """  String _formatJamaat(String value, bool is24Hour) {\n    final m = RegExp(r'^(\\d{1,2}):(\\d{2})\\s*(AM|PM)$', caseSensitive: false).firstMatch(value.trim());\n    if (m == null) return value;\n    final hour = int.parse(m.group(1)!);\n    final minute = m.group(2)!;\n    final period = m.group(3)!.toUpperCase();\n    if (!is24Hour) return '$hour:$minute $period';\n    var h = hour % 12;\n    if (period == 'PM') h += 12;\n    return '${h.toString().padLeft(2, '0')}:$minute';\n  }\n\n"""
          if marker in s:
              s = s.replace(marker, helpers + marker)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/jamaat_service.dart lib/screens/prayer/jamaat_settings_screen.dart lib/widgets/home/prayer_timeline.dart lib/screens/simple_home_screen_v10.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Sync Jamaat defaults and local mosque settings'
          git push
