name: Apply Settings Now

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch settings source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = fn(s)
              p.write_text(s, encoding='utf-8')

          def replace_required(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing expected block: {label}')
              return s.replace(old, new, 1)

          # Keep the existing prayer-settings normalization repair.
          def provider(s):
              s = re.sub(
                  r"  static const List<String> calculationMethods = \[.*?\n  \];\n\n  static const List<String> madhabs = \[.*?\];\n",
                  """  static const List<String> calculationMethods = [
    'Karachi',
    'Muslim World League',
    'Egyptian',
    'Umm Al Qura',
    'Dubai',
    'Qatar',
    'Kuwait',
    'Singapore',
    'North America',
    'Moonsighting Committee',
    'Tehran',
    'Turkey',
    'Other',
  ];

  static const List<String> madhabs = [
    'Hanafi',
    'Shafi',
    'Maliki',
    'Hanbali',
  ];
""",
                  s, count=1, flags=re.S)
              s = s.replace("  String get madhhab => _madhab;\n\n  String get madhab => _madhab;\n", "  String get madhhab => _madhab;\n", 1)
              s = re.sub(
                  r"  String _normalizeMadhab\(String value\) \{.*?\n  \}\n\n  // ==========================================================================\n  // HELPER",
                  """  String _normalizeMadhab(String value) {
    switch (value.trim().toLowerCase()) {
      case 'shafi':
      case 'shafii':
      case 'shafi’i':
      case \"shafi'i\":
        return 'Shafi';
      case 'maliki':
        return 'Maliki';
      case 'hanbali':
      case 'hambali':
        return 'Hanbali';
      case 'hanafi':
      default:
        return 'Hanafi';
    }
  }

  // ===========================================================================
  // HELPER""",
                  s, count=1, flags=re.S)
              return s
          edit('lib/providers/settings_provider.dart', provider)

          def config(s):
              s = replace_required(s, """class PrayerCalculationConfig {
  final CalculationMethod method;
  final Madhab madhab;

  const PrayerCalculationConfig({required this.method, required this.madhab});
""", """class PrayerCalculationConfig {
  final CalculationMethod method;
  final Madhab madhab;
  final String? madhhabName;

  const PrayerCalculationConfig({
    required this.method,
    required this.madhab,
    this.madhhabName,
  });
""", 'config fields')
              s = replace_required(s, """    return PrayerCalculationConfig(
      method: _parseCalculationMethod(calculationMethod),
      madhab: _parseMadhab(madhhab),
    );
""", """    final String normalizedMadhhab = _normalizeMadhhabName(madhhab);

    return PrayerCalculationConfig(
      method: _parseCalculationMethod(calculationMethod),
      madhab: _parseMadhab(normalizedMadhhab),
      madhhabName: normalizedMadhhab,
    );
""", 'config fromSettings')
              s = re.sub(
                  r"  static Madhab _parseMadhab\(String value\) \{.*?\n  \}\n\n  // ==========================================================================\n  // DISPLAY VALUES",
                  """  static String _normalizeMadhhabName(String value) {
    switch (value.trim().toLowerCase()) {
      case 'shafi':
      case 'shafii':
      case 'shafi’i':
      case \"shafi'i\":
        return 'Shafi';
      case 'maliki':
        return 'Maliki';
      case 'hanbali':
      case 'hambali':
        return 'Hanbali';
      case 'hanafi':
      default:
        return 'Hanafi';
    }
  }

  static Madhab _parseMadhab(String value) {
    return value == 'Hanafi' ? Madhab.hanafi : Madhab.shafi;
  }

  // ===========================================================================
  // DISPLAY VALUES""",
                  s, count=1, flags=re.S)
              s = replace_required(s, """  String get madhhabId {
    return madhab == Madhab.hanafi ? 'Hanafi' : 'Shafi';
  }
""", """  String get madhhabId {
    return madhhabName ??
        (madhab == Madhab.hanafi ? 'Hanafi' : 'Shafi');
  }
""", 'config madhhabId')
              return s
          edit('lib/services/prayer_calculation_config.dart', config)

          # Preserve the existing multilingual calculation labels and selectors.
          def screen(s):
              for old, new in {
                  "'Karachi': 'كراتشي'": "'Karachi': 'Karachi'",
                  "'Muslim World League': 'رابطة العالم الإسلامي'": "'Muslim World League': 'Muslim World League'",
                  "'Egyptian': 'المصري'": "'Egyptian': 'Egyptian'",
                  "'Umm Al Qura': 'أم القرى'": "'Umm Al Qura': 'Umm Al Qura'",
                  "'Dubai': 'دبي'": "'Dubai': 'Dubai'",
                  "'Qatar': 'قطر'": "'Qatar': 'Qatar'",
                  "'Kuwait': 'الكويت'": "'Kuwait': 'Kuwait'",
                  "'Singapore': 'سنغافورة'": "'Singapore': 'Singapore'",
                  "'North America': 'أمريكا الشمالية'": "'North America': 'North America'",
                  "'Moonsighting Committee': 'لجنة رؤية الهلال'": "'Moonsighting Committee': 'Moonsighting Committee'",
                  "'Hanafi': 'حنفي'": "'Hanafi': 'Hanafi'",
                  "'Shafi': 'شافعي'": "'Shafi': 'Shafi'",
              }.items():
                  s = s.replace(old, new)
              marker = "    'Moonsighting Committee': 'Moonsighting Committee',\n"
              if "    'Tehran': 'Tehran'," not in s and marker in s:
                  s = s.replace(marker, marker + "    'Tehran': 'Tehran',\n    'Turkey': 'Turkey',\n    'Other': 'Other',\n    'Maliki': 'Maliki',\n    'Hanbali': 'Hanbali',\n", 1)
              start = s.index('  Future<void> _showChoiceSheet(')
              end = s.index('  Future<void> _showTextSizeSheet(', start)
              fixed = '''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';
    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      showDragHandle: true,
      builder: (sheetContext) {
        final maxHeight = MediaQuery.sizeOf(sheetContext).height * 0.82;
        return SafeArea(
          child: ConstrainedBox(
            constraints: BoxConstraints(maxHeight: maxHeight),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Padding(
                  padding: const EdgeInsets.fromLTRB(18, 8, 18, 12),
                  child: Text(title, style: Theme.of(sheetContext).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.w900), textAlign: TextAlign.center),
                ),
                Flexible(
                  child: ListView.builder(
                    shrinkWrap: true,
                    itemCount: options.length,
                    itemBuilder: (context, index) {
                      final option = options[index];
                      final label = options.length == 3 && options.contains('bn') && options.contains('en') && options.contains('ar')
                          ? (isEnglish ? ({'bn': 'Bangla', 'en': 'English', 'ar': 'Arabic'}[option] ?? option)
                              : (isArabic ? ({'bn': 'البنغالية', 'en': 'الإنجليزية', 'ar': 'العربية'}[option] ?? option)
                                  : ({'bn': 'বাংলা', 'en': 'ইংরেজি', 'ar': 'আরবি'}[option] ?? option)))
                          : _choiceLabel(option, languageCode);
                      return ListTile(
                        title: Text(label),
                        trailing: option == selectedValue ? const Icon(Icons.check_circle_rounded, color: AppColors.seaBlue) : null,
                        onTap: () async {
                          await onSelected(option);
                          if (sheetContext.mounted) Navigator.pop(sheetContext);
                        },
                      );
                    },
                  ),
                ),
                const SizedBox(height: 8),
              ],
            ),
          ),
        );
      },
    );
  }

'''
              s = s[:start] + fixed + s[end:]
              return s
          edit('lib/screens/settings_hub_screen_v4.dart', screen)

          # Canonical Settings UI: every configurable option lives here.
          def unify(s):
              s = s.replace("import 'prayer/jamaat_settings_screen.dart';\n", '')
              s = s.replace("          _divider(), _switchTile(context, Icons.vibration_rounded, _t(languageCode, 'ভাইব্রেশন', 'Vibration'), _t(languageCode, 'সমর্থিত অ্যাকশনে হ্যাপটিক ফিডব্যাক চালু রাখুন', 'Allow supported haptic feedback'), settings.vibrationEnabled, settings.toggleVibration),\n", """          _divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'সময় ফরম্যাট', 'Time Format'), settings.is24Hour ? _t(languageCode, '২৪ ঘণ্টা', '24-hour') : _t(languageCode, '১২ ঘণ্টা', '12-hour'), () => _showTimeFormatSheet(context, settings)),
          _divider(), _switchTile(context, Icons.vibration_rounded, _t(languageCode, 'ভাইব্রেশন', 'Vibration'), _t(languageCode, 'সমর্থিত অ্যাকশনে হ্যাপটিক ফিডব্যাক চালু রাখুন', 'Allow supported haptic feedback'), settings.vibrationEnabled, settings.toggleVibration),
""", 1)
              s = s.replace("          _divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'জামাতের সময়', 'Jamaat Times'), _t(languageCode, 'নিজের এলাকার জামাতের সময় সেট করুন', 'Set local Jamaat times'), () { Navigator.of(context).push(MaterialPageRoute<void>(builder: (_) => const JamaatSettingsScreen())); }),\n", """          _divider(), _tile(context, Icons.location_on_outlined, _t(languageCode, 'লোকেশন', 'Location'), settings.autoLocation ? _t(languageCode, 'স্বয়ংক্রিয়', 'Automatic') : _t(languageCode, 'ম্যানুয়াল', 'Manual'), () => _showLocationSheet(context, settings)),
          _divider(), _tile(context, Icons.tune_rounded, _t(languageCode, 'সালাতের সময় সমন্বয়', 'Prayer Adjustments'), _prayerAdjustmentLabel(settings), () => _showPrayerAdjustmentsSheet(context, settings)),
          _divider(), _jamaatTile(context, settings, 'Fajr', settings.fajrJamaat),
          _divider(), _jamaatTile(context, settings, 'Dhuhr', settings.dhuhrJamaat),
          _divider(), _jamaatTile(context, settings, 'Asr', settings.asrJamaat),
          _divider(), _jamaatTile(context, settings, 'Maghrib', settings.maghribJamaat),
          _divider(), _jamaatTile(context, settings, 'Isha', settings.ishaJamaat),
""", 1)
              marker = "  Future<void> _showHijriAdjustmentSheet(BuildContext context, SettingsProvider settings) async {"
              insert = '''  String _prayerAdjustmentLabel(SettingsProvider settings) {
    final count = settings.prayerAdjustments.values.where((v) => v != 0).length;
    if (count == 0) return _t(settings.languageCode, 'কোনো সমন্বয় নেই', 'No adjustments');
    return _t(settings.languageCode, '$countটি ওয়াক্তে সমন্বয়', '$count prayer adjustments');
  }

  String _prayerLabel(String prayer, String languageCode) => _choiceLabel(prayer, languageCode);

  Widget _jamaatTile(BuildContext context, SettingsProvider settings, String prayer, String value) {
    final languageCode = settings.languageCode;
    return _tile(context, Icons.groups_outlined, _prayerLabel(prayer, languageCode), value, () => _showJamaatTimeSheet(context, settings, prayer, value));
  }

  Future<void> _showTimeFormatSheet(BuildContext context, SettingsProvider settings) async {
    await _showChoiceSheet(context, _t(settings.languageCode, 'সময় ফরম্যাট', 'Time Format'), const ['12', '24'], settings.setTimeFormat, selectedValue: settings.timeFormat);
  }

  Future<void> _showLocationSheet(BuildContext context, SettingsProvider settings) async {
    await _showChoiceSheet(context, _t(settings.languageCode, 'লোকেশন', 'Location'), const ['auto', 'manual'], (value) => settings.setLocationMode(value), selectedValue: settings.autoLocation ? 'auto' : 'manual');
  }

  Future<void> _showJamaatTimeSheet(BuildContext context, SettingsProvider settings, String prayer, String current) async {
    final controller = TextEditingController(text: current);
    final result = await showDialog<String>(
      context: context,
      builder: (dialogContext) => AlertDialog(
        title: Text('${_prayerLabel(prayer, settings.languageCode)} ${_t(settings.languageCode, 'জামাতের সময়', 'Jamaat Time')}'),
        content: TextField(controller: controller, keyboardType: TextInputType.datetime, decoration: InputDecoration(hintText: settings.is24Hour ? '17:00' : '5:00 PM')),
        actions: [
          TextButton(onPressed: () => Navigator.pop(dialogContext), child: Text(_t(settings.languageCode, 'বাতিল', 'Cancel'))),
          FilledButton(onPressed: () => Navigator.pop(dialogContext, controller.text.trim()), child: Text(_t(settings.languageCode, 'সংরক্ষণ', 'Save'))),
        ],
      ),
    );
    controller.dispose();
    if (result != null && result.isNotEmpty) await settings.setJamaatTime(prayer, result);
  }

  Future<void> _showPrayerAdjustmentsSheet(BuildContext context, SettingsProvider settings) async {
    final names = const ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    await showModalBottomSheet<void>(
      context: context,
      showDragHandle: true,
      isScrollControlled: true,
      builder: (sheetContext) => SafeArea(
        child: Consumer<SettingsProvider>(
          builder: (context, current, _) => Padding(
            padding: const EdgeInsets.fromLTRB(18, 8, 18, 18),
            child: Column(mainAxisSize: MainAxisSize.min, children: [
              Text(_t(current.languageCode, 'সালাতের সময় সমন্বয়', 'Prayer Adjustments'), style: Theme.of(context).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.w900)),
              for (final prayer in names) ListTile(
                title: Text(_prayerLabel(prayer, current.languageCode)),
                trailing: DropdownButton<int>(
                  value: current.prayerAdjustments[prayer] ?? 0,
                  items: [for (int i = -30; i <= 30; i++) DropdownMenuItem(value: i, child: Text(i == 0 ? '0 min' : '${i > 0 ? '+' : ''}$i min'))],
                  onChanged: (value) { if (value != null) current.setPrayerAdjustment(prayer, value); },
                ),
              ),
              Align(alignment: Alignment.centerRight, child: TextButton(onPressed: () => current.resetPrayerAdjustments(), child: Text(_t(current.languageCode, 'রিসেট', 'Reset')))),
            ]),
          ),
        ),
      ),
    );
  }

'''
              if marker not in s:
                  raise SystemExit('missing Hijri sheet marker')
              s = s.replace(marker, insert + marker, 1)
              return s
          edit('lib/screens/settings_hub_screen_v4.dart', unify)

          # Legacy Settings entry point becomes a compatibility wrapper only.
          Path('lib/screens/settings/settings_screen.dart').write_text("""import 'package:flutter/material.dart';\n\nimport '../settings_hub_screen_v4.dart';\n\n/// Compatibility entry point. NurVerse has one canonical Settings UI.\nclass SettingsScreen extends StatelessWidget {\n  const SettingsScreen({super.key});\n\n  @override\n  Widget build(BuildContext context) => const SettingsHubScreenV4();\n}\n""", encoding='utf-8')

          # Remove obsolete one-shot workflows after this successful source patch.
          for workflow in ('.github/workflows/finish-prayer-settings.yml', '.github/workflows/unify-settings-final.yml'):
              Path(workflow).unlink(missing_ok=True)
          PY

          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart lib/screens/settings/settings_screen.dart .github/workflows/finish-prayer-settings.yml .github/workflows/unify-settings-final.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'fix(settings): unify all settings into one screen'
          git push
