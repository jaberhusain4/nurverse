name: Apply Settings Now

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch active Settings choice sheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text(encoding='utf-8')

          start = s.index('  Future<void> _showChoiceSheet(')
          end = s.index('  Future<void> _showTextSizeSheet(', start)

          fixed = '''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';

    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      builder: (sheetContext) {
        final maxHeight = MediaQuery.sizeOf(sheetContext).height * 0.82;

        return SafeArea(
          child: ConstrainedBox(
            constraints: BoxConstraints(maxHeight: maxHeight),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Padding(
                  padding: const EdgeInsets.fromLTRB(18, 18, 18, 12),
                  child: Text(
                    title,
                    style: Theme.of(sheetContext)
                        .textTheme
                        .titleLarge
                        ?.copyWith(fontWeight: FontWeight.w900),
                  ),
                ),
                Flexible(
                  child: ListView.builder(
                    padding: EdgeInsets.zero,
                    itemCount: options.length,
                    itemBuilder: (context, index) {
                      final option = options[index];
                      final label = options.length == 3 &&
                              options.contains('bn') &&
                              options.contains('en') &&
                              options.contains('ar')
                          ? (isEnglish
                              ? ({
                                    'bn': 'Bangla',
                                    'en': 'English',
                                    'ar': 'Arabic',
                                  }[option] ?? option)
                              : (isArabic
                                  ? ({
                                        'bn': 'البنغالية',
                                        'en': 'الإنجليزية',
                                        'ar': 'العربية',
                                      }[option] ?? option)
                                  : ({
                                        'bn': 'বাংলা',
                                        'en': 'ইংরেজি',
                                        'ar': 'আরবি',
                                      }[option] ?? option)))
                          : _choiceLabel(option, languageCode);

                      return ListTile(
                        title: Text(label),
                        trailing: option == selectedValue
                            ? const Icon(
                                Icons.check_circle_rounded,
                                color: AppColors.seaBlue,
                              )
                            : null,
                        onTap: () async {
                          await onSelected(option);
                          if (sheetContext.mounted) {
                            Navigator.pop(sheetContext);
                          }
                        },
                      );
                    },
                  ),
                ),
                const SizedBox(height: 8),
              ],
            ),
          ),
        );
      },
    );
  }

'''

          s = s[:start] + fixed + s[end:]
          p.write_text(s, encoding='utf-8')

          print('Patched active SettingsHubScreenV4._showChoiceSheet')
          PY

      - name: Verify patch
        run: |
          grep -n -A75 "Future<void> _showChoiceSheet" lib/screens/settings_hub_screen_v4.dart
          test "$(grep -o "Future<void> _showChoiceSheet" lib/screens/settings_hub_screen_v4.dart | wc -l)" -eq 1
          test "$(grep -o "isScrollControlled: true" lib/screens/settings_hub_screen_v4.dart | wc -l)" -ge 1
          test "$(grep -o "ConstrainedBox" lib/screens/settings_hub_screen_v4.dart | wc -l)" -ge 1
          test "$(grep -o "ListView.builder" lib/screens/settings_hub_screen_v4.dart | wc -l)" -ge 1

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/settings_hub_screen_v4.dart
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'fix(settings): prevent calculation selector overflow'
          git push
