name: Apply Settings Now

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch prayer settings source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s = fn(s)
              p.write_text(s, encoding='utf-8')

          def replace_required(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing expected block: {label}')
              return s.replace(old, new, 1)

          # SettingsProvider lists and normalization.
          def provider(s):
              s = re.sub(
                  r"  static const List<String> calculationMethods = \[.*?\n  \];\n\n  static const List<String> madhabs = \[.*?\];\n",
                  """  static const List<String> calculationMethods = [
    'Karachi',
    'Muslim World League',
    'Egyptian',
    'Umm Al Qura',
    'Dubai',
    'Qatar',
    'Kuwait',
    'Singapore',
    'North America',
    'Moonsighting Committee',
    'Tehran',
    'Turkey',
    'Other',
  ];

  static const List<String> madhabs = [
    'Hanafi',
    'Shafi',
    'Maliki',
    'Hanbali',
  ];
""",
                  s,
                  count=1,
                  flags=re.S,
              )
              s = s.replace(
                  "  String get madhhab => _madhab;\n\n  String get madhab => _madhab;\n",
                  "  String get madhhab => _madhab;\n",
                  1,
              )
              s = re.sub(
                  r"  String _normalizeMadhab\(String value\) \{.*?\n  \}\n\n  // ==========================================================================\n  // HELPER",
                  """  String _normalizeMadhab(String value) {
    switch (value.trim().toLowerCase()) {
      case 'shafi':
      case 'shafii':
      case 'shafi’i':
      case \"shafi'i\":
        return 'Shafi';
      case 'maliki':
        return 'Maliki';
      case 'hanbali':
      case 'hambali':
        return 'Hanbali';
      case 'hanafi':
      default:
        return 'Hanafi';
    }
  }

  // ===========================================================================
  // HELPER""",
                  s,
                  count=1,
                  flags=re.S,
              )
              return s
          edit('lib/providers/settings_provider.dart', provider)

          # PrayerCalculationConfig keeps four-way persistence while mapping
          # non-Hanafi methods to adhan's available one-shadow Asr rule.
          def config(s):
              s = replace_required(
                  s,
                  """class PrayerCalculationConfig {
  final CalculationMethod method;
  final Madhab madhab;

  const PrayerCalculationConfig({required this.method, required this.madhab});
""",
                  """class PrayerCalculationConfig {
  final CalculationMethod method;
  final Madhab madhab;
  final String? madhhabName;

  const PrayerCalculationConfig({
    required this.method,
    required this.madhab,
    this.madhhabName,
  });
""",
                  'config fields',
              )
              s = replace_required(
                  s,
                  """    return PrayerCalculationConfig(
      method: _parseCalculationMethod(calculationMethod),
      madhab: _parseMadhab(madhhab),
    );
""",
                  """    final String normalizedMadhhab = _normalizeMadhhabName(madhhab);

    return PrayerCalculationConfig(
      method: _parseCalculationMethod(calculationMethod),
      madhab: _parseMadhab(normalizedMadhhab),
      madhhabName: normalizedMadhhab,
    );
""",
                  'config fromSettings',
              )
              s = re.sub(
                  r"  static Madhab _parseMadhab\(String value\) \{.*?\n  \}\n\n  // ==========================================================================\n  // DISPLAY VALUES",
                  """  static String _normalizeMadhhabName(String value) {
    switch (value.trim().toLowerCase()) {
      case 'shafi':
      case 'shafii':
      case 'shafi’i':
      case \"shafi'i\":
        return 'Shafi';
      case 'maliki':
        return 'Maliki';
      case 'hanbali':
      case 'hambali':
        return 'Hanbali';
      case 'hanafi':
      default:
        return 'Hanafi';
    }
  }

  static Madhab _parseMadhab(String value) {
    return value == 'Hanafi' ? Madhab.hanafi : Madhab.shafi;
  }

  // ===========================================================================
  // DISPLAY VALUES""",
                  s,
                  count=1,
                  flags=re.S,
              )
              s = replace_required(
                  s,
                  """  String get madhhabId {
    return madhab == Madhab.hanafi ? 'Hanafi' : 'Shafi';
  }
""",
                  """  String get madhhabId {
    return madhhabName ??
        (madhab == Madhab.hanafi ? 'Hanafi' : 'Shafi');
  }
""",
                  'config madhhabId',
              )
              return s
          edit('lib/services/prayer_calculation_config.dart', config)

          # Settings labels: proper names remain unchanged across app languages.
          def screen(s):
              for old, new in {
                  "'Karachi': 'كراتشي'": "'Karachi': 'Karachi'",
                  "'Muslim World League': 'رابطة العالم الإسلامي'": "'Muslim World League': 'Muslim World League'",
                  "'Egyptian': 'المصري'": "'Egyptian': 'Egyptian'",
                  "'Umm Al Qura': 'أم القرى'": "'Umm Al Qura': 'Umm Al Qura'",
                  "'Dubai': 'دبي'": "'Dubai': 'Dubai'",
                  "'Qatar': 'قطر'": "'Qatar': 'Qatar'",
                  "'Kuwait': 'الكويت'": "'Kuwait': 'Kuwait'",
                  "'Singapore': 'سنغافورة'": "'Singapore': 'Singapore'",
                  "'North America': 'أمريكا الشمالية'": "'North America': 'North America'",
                  "'Moonsighting Committee': 'لجنة رؤية الهلال'": "'Moonsighting Committee': 'Moonsighting Committee'",
                  "'Hanafi': 'حنفي'": "'Hanafi': 'Hanafi'",
                  "'Shafi': 'شافعي'": "'Shafi': 'Shafi'",
              }.items():
                  s = s.replace(old, new)
              marker = "    'Moonsighting Committee': 'Moonsighting Committee',\n"
              if "    'Tehran': 'Tehran'," not in s:
                  if marker not in s:
                      raise SystemExit('missing calculation label marker')
                  s = s.replace(
                      marker,
                      marker +
                      "    'Tehran': 'Tehran',\n"
                      "    'Turkey': 'Turkey',\n"
                      "    'Other': 'Other',\n"
                      "    'Maliki': 'Maliki',\n"
                      "    'Hanbali': 'Hanbali',\n",
                      1,
                  )

              start = s.index('  Future<void> _showChoiceSheet(')
              end = s.index('  Future<void> _showTextSizeSheet(', start)
              fixed = '''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';

    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      builder: (sheetContext) {
        final maxHeight = MediaQuery.sizeOf(sheetContext).height * 0.82;
        final contentHeight = 72.0 + (options.length * 56.0) + 8.0;
        final sheetHeight = contentHeight.clamp(0.0, maxHeight);

        return SafeArea(
          child: SizedBox(
            height: sheetHeight,
            child: Column(
              children: [
                Padding(
                  padding: const EdgeInsets.fromLTRB(18, 18, 18, 10),
                  child: Text(
                    title,
                    style: Theme.of(sheetContext)
                        .textTheme
                        .titleLarge
                        ?.copyWith(fontWeight: FontWeight.w900),
                  ),
                ),
                Expanded(
                  child: ListView.builder(
                    padding: EdgeInsets.zero,
                    itemCount: options.length,
                    itemBuilder: (context, index) {
                      final option = options[index];
                      final label = options.length == 3 &&
                              options.contains('bn') &&
                              options.contains('en') &&
                              options.contains('ar')
                          ? (isEnglish
                              ? ({
                                    'bn': 'Bangla',
                                    'en': 'English',
                                    'ar': 'Arabic',
                                  }[option] ?? option)
                              : (isArabic
                                  ? ({
                                        'bn': 'البنغالية',
                                        'en': 'الإنجليزية',
                                        'ar': 'العربية',
                                      }[option] ?? option)
                                  : ({
                                        'bn': 'বাংলা',
                                        'en': 'ইংরেজি',
                                        'ar': 'আরবি',
                                      }[option] ?? option)))
                          : _choiceLabel(option, languageCode);

                      return ListTile(
                        title: Text(label),
                        trailing: option == selectedValue
                            ? const Icon(
                                Icons.check_circle_rounded,
                                color: AppColors.seaBlue,
                              )
                            : null,
                        onTap: () async {
                          await onSelected(option);
                          if (sheetContext.mounted) {
                            Navigator.pop(sheetContext);
                          }
                        },
                      );
                    },
                  ),
                ),
              ],
            ),
          ),
        );
      },
    );
  }

'''
              s = s[:start] + fixed + s[end:]
              return s
          edit('lib/screens/settings_hub_screen_v4.dart', screen)
          PY

          # Keep this repair workflow self-contained; remove the one-shot copy if present.
          rm -f .github/workflows/finish-prayer-settings.yml
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart .github/workflows/finish-prayer-settings.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'fix(settings): support four madhhabs and compact selectors'
          git push
