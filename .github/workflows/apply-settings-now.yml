name: Apply Settings Now

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text()
          patches = [
            ("""                const ['Bangla', 'English'],
                settings.setQuranTranslation,
              ),""", """                const ['Bangla', 'English'],
                settings.setQuranTranslation,
                selectedValue: settings.quranTranslation,
              ),"""),
            ("""                const ['Default', 'Amiri', 'Scheherazade'],
                settings.setQuranArabicFont,
              ),""", """                const ['Default', 'Amiri', 'Scheherazade'],
                settings.setQuranArabicFont,
                selectedValue: settings.quranArabicFont,
              ),"""),
            ("""                const ['hijri', 'gregorian', 'both'],
                settings.setDateDisplayPreference,
              ),""", """                const ['hijri', 'gregorian', 'both'],
                settings.setDateDisplayPreference,
                selectedValue: settings.dateDisplayPreference,
              ),"""),
          ]
          for old, new in patches:
              s = s.replace(old, new, 1)
          anchor = """            _switchTile(
              context,
              Icons.notifications_active_outlined,
              _t(languageCode, 'আজান নোটিফিকেশন', 'Adhan Notifications'),
              _t(languageCode, 'সালাতের সময়ের নোটিফিকেশন চালু রাখুন',
                  'Enable prayer-time notifications'),
              settings.isAdhanNotificationEnabled,
              settings.toggleAdhanNotification,
            ),"""
          extra = anchor + """
            _divider(),
            _tile(
              context,
              Icons.music_note_outlined,
              _t(languageCode, 'নোটিফিকেশন সাউন্ড', 'Notification Sound'),
              settings.notificationSound,
              () => _showChoiceSheet(
                context,
                _t(languageCode, 'নোটিফিকেশন সাউন্ড', 'Notification Sound'),
                const ['Default', 'Silent'],
                settings.setNotificationSound,
                selectedValue: settings.notificationSound,
              ),
            ),
            _divider(),
            _tile(
              context,
              Icons.alarm_outlined,
              _t(languageCode, 'সালাত রিমাইন্ডার', 'Prayer Reminder'),
              settings.prayerReminderMinutes == 0
                  ? _t(languageCode, 'বন্ধ', 'Off')
                  : '${settings.prayerReminderMinutes} ${_t(languageCode, 'মিনিট আগে', 'min before')}',
              () => _showChoiceSheet(
                context,
                _t(languageCode, 'সালাত রিমাইন্ডার', 'Prayer Reminder'),
                const ['0', '5', '10', '15', '30', '60'],
                (value) => settings.setPrayerReminderMinutes(int.parse(value)),
                selectedValue: settings.prayerReminderMinutes.toString(),
              ),
            ),"""
          if 'Notification Sound' not in s and anchor in s:
              s = s.replace(anchor, extra, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/settings_hub_screen_v4.dart
          git commit -m 'feat(settings): complete missing preference controls'
          git rm .github/workflows/apply-settings-now.yml
          git commit -m 'chore: remove temporary settings workflow'
          git push
