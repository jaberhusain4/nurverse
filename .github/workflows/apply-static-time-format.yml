name: Apply static time formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-static-time-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update active time displays
        shell: python
        run: |
          from pathlib import Path
          import re

          # Active Home clock: static clock, no seconds; 12/24-hour setting controls format.
          p = Path('lib/screens/simple_home_screen_v10.dart')
          s = p.read_text(encoding='utf-8')
          old = """  String _clock() {\n    final hour = _now.hour % 12 == 0 ? 12 : _now.hour % 12;\n    return '${hour.toString().padLeft(2, '0')}:${_now.minute.toString().padLeft(2, '0')}:${_now.second.toString().padLeft(2, '0')}';\n  }\n"""
          new = """  String _clock(bool is24Hour) {\n    final minute = _now.minute.toString().padLeft(2, '0');\n    if (is24Hour) {\n      return '${_now.hour.toString().padLeft(2, '0')}:$minute';\n    }\n    final hour = _now.hour % 12 == 0 ? 12 : _now.hour % 12;\n    final period = _now.hour >= 12 ? 'PM' : 'AM';\n    return '$hour:$minute $period';\n  }\n"""
          if old not in s:
              raise SystemExit('simple_home_screen_v10 clock block not found')
          s = s.replace(old, new, 1)
          s = s.replace('_clock()', '_clock(settings.is24Hour)')
          p.write_text(s, encoding='utf-8')

          # Active detailed prohibited/makruh card: static ranges never show seconds;
          # active countdown always remains HH:MM:SS.
          p = Path('lib/widgets/prayer/prayer_special_times_detail_card.dart')
          s = p.read_text(encoding='utf-8')
          old = """  String _time(DateTime value, bool showSeconds) {\n    final hour = value.hour == 0 ? 12 : value.hour > 12 ? value.hour - 12 : value.hour;\n    final minute = value.minute.toString().padLeft(2, '0');\n    final second = value.second.toString().padLeft(2, '0');\n    final base = '$hour:$minute';\n    return showSeconds\n        ? '$base:$second ${value.hour >= 12 ? 'PM' : 'AM'}'\n        : '$base ${value.hour >= 12 ? 'PM' : 'AM'}';\n  }\n\n  bool _active(DateTime start, DateTime end, DateTime now) =>\n"""
          new = """  String _time(DateTime value, bool is24Hour) {\n    final minute = value.minute.toString().padLeft(2, '0');\n    if (is24Hour) {\n      return '${value.hour.toString().padLeft(2, '0')}:$minute';\n    }\n    final hour = value.hour == 0 ? 12 : value.hour > 12 ? value.hour - 12 : value.hour;\n    final period = value.hour >= 12 ? 'PM' : 'AM';\n    return '$hour:$minute $period';\n  }\n\n  bool _active(DateTime start, DateTime end, DateTime now) =>\n"""
          if old not in s:
              raise SystemExit('special card time block not found')
          s = s.replace(old, new, 1)
          old = """  String _remaining(DateTime end, DateTime now, bool showSeconds) {\n    final seconds = end.difference(now).inSeconds.clamp(0, 86400);\n    final h = seconds ~/ 3600;\n    final m = (seconds % 3600) ~/ 60;\n    final s = seconds % 60;\n    if (!showSeconds) {\n      return '${h.toString().padLeft(2, '0')}:${m.toString().padLeft(2, '0')}';\n    }\n    return '${h.toString().padLeft(2, '0')}:${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}';\n  }\n"""
          new = """  String _remaining(DateTime end, DateTime now) {\n    final seconds = end.difference(now).inSeconds.clamp(0, 86400);\n    final h = seconds ~/ 3600;\n    final m = (seconds % 3600) ~/ 60;\n    final s = seconds % 60;\n    return '${h.toString().padLeft(2, '0')}:${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}';\n  }\n"""
          if old not in s:
              raise SystemExit('special card remaining block not found')
          s = s.replace(old, new, 1)
          s = s.replace('final showSeconds = context.watch<SettingsProvider>().showSeconds;', 'final is24Hour = context.watch<SettingsProvider>().is24Hour;')
          s = s.replace('prohibited, now, warning, text, secondary, showSeconds)', 'prohibited, now, warning, text, secondary, is24Hour)')
          s = s.replace('makruh, now, primary, text, secondary, showSeconds)', 'makruh, now, primary, text, secondary, is24Hour)')
          s = s.replace('    bool showSeconds,\n  ) {', '    bool is24Hour,\n  ) {', 1)
          s = s.replace('_time(item.start, showSeconds)', '_time(item.start, is24Hour)')
          s = s.replace('_time(item.end, showSeconds)', '_time(item.end, is24Hour)')
          s = s.replace('_remaining(item.end, now, showSeconds)', '_remaining(item.end, now)')
          p.write_text(s, encoding='utf-8')

          print('Static time formatting updated.')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/simple_home_screen_v10.dart lib/widgets/prayer/prayer_special_times_detail_card.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Apply 12/24-hour format to static times'
          git push
