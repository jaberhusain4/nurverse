name: Apply time format setting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-time-format-setting.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 12/24-hour setting
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/providers/settings_provider.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  static const String _showSecondsKey = 'show_seconds';\n", "  static const String _showSecondsKey = 'show_seconds';\n  static const String _timeFormatKey = 'time_format';\n")
          s = s.replace("  bool _showSeconds = false;\n", "  bool _showSeconds = false;\n  String _timeFormat = '12';\n")
          s = s.replace("  bool get showSeconds => _showSeconds;\n", "  bool get showSeconds => _showSeconds;\n\n  String get timeFormat => _timeFormat;\n  bool get is24Hour => _timeFormat == '24';\n")
          s = s.replace("      _showSeconds = prefs.getBool(_showSecondsKey) ?? false;\n", "      _showSeconds = prefs.getBool(_showSecondsKey) ?? false;\n      _timeFormat = prefs.getString(_timeFormatKey) == '24' ? '24' : '12';\n")
          marker = "  Future<void> toggleShowSeconds(bool value) async {\n"
          insert = "  Future<void> setTimeFormat(String value) async {\n    final String normalized = value == '24' ? '24' : '12';\n\n    if (_timeFormat == normalized) {\n      return;\n    }\n\n    _timeFormat = normalized;\n    notifyListeners();\n\n    try {\n      final SharedPreferences prefs = await SharedPreferences.getInstance();\n      await prefs.setString(_timeFormatKey, normalized);\n    } catch (_) {}\n  }\n\n"
          if marker not in s:
              raise SystemExit('provider insertion marker not found')
          if 'Future<void> setTimeFormat' not in s:
              s = s.replace(marker, insert + marker, 1)
          s = s.replace("    _showSeconds = false;\n    _vibrationEnabled = true;\n", "    _showSeconds = false;\n    _timeFormat = '12';\n    _vibrationEnabled = true;\n")
          s = s.replace("        _showSecondsKey,\n        _vibrationKey,\n", "        _showSecondsKey,\n        _timeFormatKey,\n        _vibrationKey,\n")
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/settings_hub_screen.dart')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"_switchTile\(\s*context,\s*Icons\.timer_outlined,.*?settings\.toggleShowSeconds,\s*\),", re.S)
          replacement = "_tile(\n  context,\n  Icons.access_time_rounded,\n  isEnglish ? 'Time format' : 'সময়ের ফরম্যাট',\n  settings.is24Hour\n      ? (isEnglish ? '24-hour' : '২৪ ঘণ্টা')\n      : (isEnglish ? '12-hour' : '১২ ঘণ্টা'),\n  () => _choiceSheet(\n    context,\n    isEnglish ? 'Time format' : 'সময়ের ফরম্যাট',\n    const ['12', '24'],\n    settings.setTimeFormat,\n  ),\n),"
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('settings hub time tile not found')
          p.write_text(s2, encoding='utf-8')

          print('Applied time format setting to provider and active settings hub.')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/settings_provider.dart lib/screens/settings_hub_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Add 12/24-hour time format setting'
          git push
