name: Apply pending 12-24 hour time format
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[time-format-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply time format system
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Settings UI: expose the already-persisted 12/24-hour preference.
          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text(encoding='utf-8')
          if "'Time Format'" not in s:
              s = s.replace(
                  "'Show seconds': 'إظهار الثواني',",
                  "'Show seconds': 'إظهار الثواني','Time Format': 'تنسيق الوقت','12-hour': '12 ساعة','24-hour': '24 ساعة',"
              )
          marker = "_divider(), _switchTile(context, Icons.timer_outlined, _t(languageCode, 'সেকেন্ড দেখান', 'Show seconds'), _t(languageCode, 'যেখানে সমর্থিত সেখানে সেকেন্ড দেখাবে', 'Show seconds where supported'), settings.showSeconds, settings.toggleShowSeconds),"
          addition = marker + "\n          _divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'সময় ফরম্যাট', 'Time Format'), settings.is24Hour ? _t(languageCode, '২৪ ঘণ্টা', '24-hour') : _t(languageCode, '১২ ঘণ্টা', '12-hour'), () => _showChoiceSheet(context, _t(languageCode, 'সময় ফরম্যাট', 'Time Format'), const ['12', '24'], settings.setTimeFormat, selectedValue: settings.timeFormat)),"
          if marker in s and "_t(languageCode, 'সময় ফরম্যাট', 'Time Format')" not in s:
              s = s.replace(marker, addition, 1)
          p.write_text(s, encoding='utf-8')

          # Home clock + Home time strings: honor the selected 12/24-hour format.
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = """  void _updateClock() {
    final now = DateTime.now();
    final period = now.hour >= 12 ? 'PM' : 'AM';
    final hour = now.hour % 12 == 0 ? 12 : now.hour % 12;
    final value = '${hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')} $period';

    if (_currentTime == value) return;
    setState(() => _currentTime = value);
  }"""
          new = """  void _updateClock() {
    final now = DateTime.now();
    final settings = context.read<SettingsProvider>();
    final value = settings.is24Hour
        ? '${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')}'
        : '${(now.hour % 12 == 0 ? 12 : now.hour % 12).toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')} ${now.hour >= 12 ? 'PM' : 'AM'}';

    if (_currentTime == value) return;
    setState(() => _currentTime = value);
  }"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """  String _displayTime(String value, bool showSeconds) {
    final raw = value.trim();
    if (showSeconds) return raw;
    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(raw);
    return match?.group(1) ?? raw;
  }"""
          new = """  String _displayTime(String value, bool showSeconds) {
    final raw = value.trim();
    if (raw.isEmpty) return raw;

    final match = RegExp(r'^(\\d{1,2}):(\\d{2})(?::(\\d{2}))?\\s*(AM|PM)?$', caseSensitive: false).firstMatch(raw);
    if (match == null) return raw;

    var hour = int.tryParse(match.group(1)!) ?? 0;
    final minute = int.tryParse(match.group(2)!) ?? 0;
    final second = int.tryParse(match.group(3) ?? '0') ?? 0;
    final period = match.group(4)?.toUpperCase();
    if (period != null) {
      if (period == 'PM' && hour < 12) hour += 12;
      if (period == 'AM' && hour == 12) hour = 0;
    }

    final settings = context.read<SettingsProvider>();
    if (settings.is24Hour) {
      final base = '${hour.toString().padLeft(2, '0')}:${minute.toString().padLeft(2, '0')}';
      return showSeconds ? '$base:${second.toString().padLeft(2, '0')}' : base;
    }

    final displayHour = hour % 12 == 0 ? 12 : hour % 12;
    final base = '${displayHour.toString().padLeft(2, '0')}:${minute.toString().padLeft(2, '0')}';
    return showSeconds ? '$base:${second.toString().padLeft(2, '0')} ${hour >= 12 ? 'PM' : 'AM'}' : '$base ${hour >= 12 ? 'PM' : 'AM'}';
  }"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_hub_screen_v4.dart lib/screens/home_screen.dart
          git rm .github/workflows/apply-time-format.yml
          git commit -m "Implement 12/24-hour time format [time-format-applied]"
          git push
