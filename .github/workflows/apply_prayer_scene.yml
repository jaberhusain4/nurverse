name: Apply prayer scene
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply prayer scene') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update prayer card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/localized_prayer_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = """        Stack(children: [\n          Center(child: Column(children: [\n            _iconBox(primary, Icons.mosque_rounded, size: 42),\n            const SizedBox(height: 6),\n            Text(l10n.currentPrayerLabel, maxLines: 1, style: TextStyle(color: secondary, fontSize: 11.5, fontWeight: FontWeight.w600)),\n            const SizedBox(height: 2),\n            Text(l10n.prayerName(c.currentPrayer), maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w700, height: 1.05)),\n          ])),\n          if (friday) Positioned(top: 2, right: 0, child: _badge(primary, l10n.fridayLabel)),\n        ]),"""
          new = """        Stack(children: [\n          Positioned(left: 0, top: 0, child: _prayerScene(primary, flip: false)),\n          Positioned(right: 0, top: 0, child: _prayerScene(primary, flip: true)),\n          Center(child: Padding(\n            padding: const EdgeInsets.symmetric(horizontal: 62),\n            child: Column(children: [\n              Text(l10n.currentPrayerLabel, maxLines: 1, textAlign: TextAlign.center, style: TextStyle(color: secondary, fontSize: 11.5, fontWeight: FontWeight.w600)),\n              const SizedBox(height: 3),\n              Text(l10n.prayerName(c.currentPrayer), maxLines: 1, overflow: TextOverflow.ellipsis, textAlign: TextAlign.center, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w700, height: 1.05)),\n            ]),\n          )),\n          if (friday) Positioned(top: 2, right: 0, child: _badge(primary, l10n.fridayLabel)),\n        ]),"""
          if old not in s:
              raise SystemExit('target prayer card block not found')
          s = s.replace(old, new, 1)
          marker = "  Widget _summaryCard(BuildContext context, PrayerController c) {"
          scene = """  Widget _prayerScene(Color primary, {required bool flip}) {\n    final soft = primary.withValues(alpha: .72);\n    final faint = primary.withValues(alpha: .38);\n    final moon = primary.withValues(alpha: .82);\n    final items = SizedBox(width: 58, height: 48, child: Stack(children: [\n      Positioned(left: flip ? 27 : 1, right: flip ? 1 : 27, bottom: 2, child: Icon(Icons.park_rounded, color: soft, size: 25)),\n      Positioned(left: flip ? 10 : 24, right: flip ? 24 : 10, bottom: 2, child: Icon(Icons.mosque_rounded, color: primary.withValues(alpha: .64), size: 27)),\n      Positioned(left: flip ? 5 : 38, right: flip ? 38 : 5, top: 0, child: Icon(Icons.nightlight_round, color: moon, size: 17)),\n      Positioned(left: flip ? 16 : 35, right: flip ? 35 : 16, top: 13, child: Icon(Icons.star_rounded, color: faint, size: 7)),\n      Positioned(left: flip ? 39 : 12, right: flip ? 12 : 39, top: 22, child: Icon(Icons.star_rounded, color: faint, size: 5)),\n    ]));\n    return Transform(alignment: Alignment.center, transform: Matrix4.identity()..scale(flip ? -1.0 : 1.0, 1.0), child: items);\n  }\n\n"""
          if marker not in s:
              raise SystemExit('summary card marker not found')
          s = s.replace(marker, scene + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/localized_prayer_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Apply prayer scene'
          git push
      - name: Remove temporary workflows
        if: success()
        run: |
          git rm -f .github/workflows/apply_prayer_scene.yml .github/workflows/one_time_prayer_scene.yml .github/workflows/typography_normalization.yml 2>/dev/null || true
          git commit -m 'Remove temporary prayer scene workflows' || true
          git push || true
