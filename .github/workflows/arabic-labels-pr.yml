name: Arabic language labels PR patch
on:
  pull_request:
    branches: [fix/prayer-completion-tracker]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch language labels
        run: python .github/label_fix.py
      - name: Commit patch to feature branch
        run: |
          git config user.name "nurverse-label-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then exit 0; fi
          git add lib/screens/settings_hub_screen_v4.dart
          git commit -m "fix: localize Arabic language selector labels"
          git push origin HEAD:fix/arabic-language-labels
