name: NurVerse Arabic Localization v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arabic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/arabic-localization

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Patch Arabic localization core
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/localization/app_localizations.dart')
          s = p.read_text(encoding='utf-8')

          if "import 'arabic_strings.dart';" not in s:
              s = s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\n\nimport 'arabic_strings.dart';\n")
          s = s.replace("static const supportedLocales = [Locale('bn'), Locale('en')];", "static const supportedLocales = [Locale('bn'), Locale('en'), Locale('ar')];")
          s = s.replace("bool get isBangla => locale.languageCode == 'bn';", "bool get isBangla => locale.languageCode == 'bn';\n  bool get isArabic => locale.languageCode == 'ar';")
          s = s.replace("String _text(String bn, String en) => isBangla ? bn : en;", "String _text(String bn, String en) => isArabic ? (kArabicStrings[en] ?? en) : (isBangla ? bn : en);")
          s = s.replace("['bn', 'en'].contains(locale.languageCode)", "['bn', 'en', 'ar'].contains(locale.languageCode)")
          p.write_text(s, encoding='utf-8')

          # Arabic strings map is intentionally based on the existing English UI surface.
          ar = {
            'Home':'الرئيسية','Prayer':'الصلاة','Quran':'القرآن','Hadith':'الحديث','Tools':'الأدوات','More':'المزيد',
            'Refresh':'تحديث','Refresh prayer times':'تحديث أوقات الصلاة','Try Again':'حاول مرة أخرى','Cancel':'إلغاء','Save':'حفظ','Close':'إغلاق','Done':'تم','Search':'بحث','Settings':'الإعدادات',
            'Current Prayer':'الصلاة الحالية','Next Prayer':'الصلاة التالية','Prayer Time':'وقت الصلاة','Today':'اليوم','Sunrise':'الشروق','Sunset':'الغروب','Current Location':'الموقع الحالي','Today’s Prayer':'صلوات اليوم','Complete prayer schedule':'جدول الصلاة الكامل','Prayer Times':'أوقات الصلاة','Previous Prayer':'الصلاة السابقة','Current':'الحالي','Next':'التالي','Completed':'تمت','No prayer window':'لا يوجد وقت للصلاة','Start':'البداية','End':'النهاية','Jama’ah':'الجماعة','Friday':'الجمعة','Important Times Today':'أهم أوقات اليوم','Solar Noon':'الزوال','Makruh Time':'وقت الكراهة','Prohibited Time':'الوقت المنهي عنه','Nafl & Other Prayers':'النوافل والصلوات الأخرى','Important times for optional worship':'أهم أوقات العبادات الاختيارية','Ishraq':'الإشراق','Duha':'الضحى','Awwabin':'الأوابين','Tahajjud':'التهجد','Prayer Tracker':'متابعة الصلوات','Mark the prayers you have performed':'حدد الصلوات التي أديتها','Could not load prayer information':'تعذر تحميل معلومات الصلاة','Prayer times may vary depending on location, date, and calculation method.':'قد تختلف أوقات الصلاة حسب الموقع والتاريخ وطريقة الحساب.','Fajr':'الفجر','Dhuhr':'الظهر','Asr':'العصر','Maghrib':'المغرب','Isha':'العشاء','Jumu’ah':'الجمعة',
            'Qibla':'القبلة','Tasbih':'التسبيح','Asma ul Husna':'أسماء الله الحسنى','Ruqyah':'الرقية','Zakat Calculator':'حاسبة الزكاة','Islamic Calendar':'التقويم الإسلامي','Nearby Mosque':'مسجد قريب','Islamic Books':'الكتب الإسلامية','Ayah of the Day':'آية اليوم','Hadith of the Day':'حديث اليوم','Dua of the Day':'دعاء اليوم','Continue Reading':'متابعة القراءة','Last Read':'آخر قراءة','See All':'عرض الكل','Language':'اللغة','Theme':'المظهر','Light':'فاتح','Dark':'داكن','AMOLED':'أموليد','System':'النظام','Bangla':'البنغالية','English':'الإنجليزية','Arabic':'العربية','Location unavailable':'الموقع غير متاح','No data available':'لا توجد بيانات','Something went wrong':'حدث خطأ ما','Loading...':'جارٍ التحميل...',
            'Islamic Tools':'الأدوات الإسلامية','Worship & Practice':'العبادة والممارسة','Essential tools for daily worship':'أدوات أساسية للعبادة اليومية','Dua':'الدعاء','Dua and supplication':'الدعاء والمناجاة','Dhikr counting and practice':'عد الذكر والممارسة','Quran and authentic duas':'القرآن والأدعية الصحيحة','99 Names of Allah':'أسماء الله الحسنى الـ99','Quran & Hadith':'القرآن والحديث','Reading, audio and saved knowledge':'القراءة والصوت والمعرفة المحفوظة','Audio Quran':'القرآن الصوتي','Listen to Quran recitation':'استمع إلى تلاوة القرآن','Saved Hadith':'الأحاديث المحفوظة','Your favorite hadith':'أحاديثك المفضلة','Islamic knowledge library':'مكتبة المعرفة الإسلامية','Time & Direction':'الوقت والاتجاه','Islamic time, date and Qibla':'الوقت والتاريخ والقبلة الإسلامية','Find the direction of the Kaaba':'حدد اتجاه الكعبة','Calendar':'التقويم','Hijri and Islamic dates':'التواريخ الهجرية والإسلامية','Islamic Calculations':'الحسابات الإسلامية','Essential calculations for financial worship':'حسابات أساسية للعبادات المالية','Calculate your Zakat':'احسب زكاتك','Your Islamic Tools':'أدواتك الإسلامية','Worship, knowledge and daily needs—all in one place.':'العبادة والمعرفة والاحتياجات اليومية — كلها في مكان واحد.','Al-Quran':'القرآن الكريم','Hifzi reading, understanding and recitation — three distinct experiences.':'قراءة الحفظ والفهم والتلاوة — ثلاث تجارب مختلفة.','Hafezi Quran':'قرآن الحفظ','15-line offline Hifzi Quran':'قرآن حفظ من 15 سطرًا دون اتصال','15 lines • Offline':'15 سطرًا • دون اتصال','Onudhabon Quran':'قرآن التدبر','Arabic verses, Bangla translation and Tafsir':'آيات عربية وترجمة بنغالية وتفسير','Translation • Tafsir':'الترجمة • التفسير','Listen and cache recitation offline':'استمع إلى التلاوة واحفظها دون اتصال','Offline cache':'ذاكرة التخزين المؤقت دون اتصال',
          }
          a = Path('lib/localization/arabic_strings.dart')
          lines = ['const Map<String, String> kArabicStrings = <String, String>{']
          for k,v in ar.items():
              lines.append(f"  {k!r}: {v!r},".replace("'", "'"))
          lines.append('};\n')
          a.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Patch language provider persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['lib/providers/settings_provider.dart','lib/controllers/language_controller.dart']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace("bool get isEnglish => _languageCode == 'en';", "bool get isEnglish => _languageCode == 'en';\n  bool get isArabic => _languageCode == 'ar';") if 'settings_provider' in fn else s.replace("bool get isEnglish => _locale.languageCode == 'en';", "bool get isEnglish => _locale.languageCode == 'en';\n\n  bool get isArabic => _locale.languageCode == 'ar';")
              if 'settings_provider' in fn:
                  s=s.replace("if (savedLanguage == 'en') {\n        _languageCode = 'en';\n      } else {", "if (savedLanguage == 'en') {\n        _languageCode = 'en';\n      } else if (savedLanguage == 'ar') {\n        _languageCode = 'ar';\n      } else {")
                  s=s.replace("if (normalizedCode != 'bn' && normalizedCode != 'en') {", "if (normalizedCode != 'bn' && normalizedCode != 'en' && normalizedCode != 'ar') {")
              else:
                  s=s.replace("if (savedLanguage == 'en') {\n        _locale = const Locale('en');\n      } else {", "if (savedLanguage == 'en') {\n        _locale = const Locale('en');\n      } else if (savedLanguage == 'ar') {\n        _locale = const Locale('ar');\n      } else {")
                  s=s.replace("if (normalizedCode != 'bn' && normalizedCode != 'en') {", "if (normalizedCode != 'bn' && normalizedCode != 'en' && normalizedCode != 'ar') {")
              p.write_text(s, encoding='utf-8')
          PY

      - name: Patch Material RTL + date locale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("await initializeDateFormatting('bn');", "await initializeDateFormatting('bn');\n  await initializeDateFormatting('ar');")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          flutter pub get
          dart format lib/localization/app_localizations.dart lib/localization/arabic_strings.dart lib/providers/settings_provider.dart lib/controllers/language_controller.dart lib/main.dart
          flutter analyze

      - name: Commit Arabic core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/localization/app_localizations.dart lib/localization/arabic_strings.dart lib/providers/settings_provider.dart lib/controllers/language_controller.dart lib/main.dart
          git diff --cached --quiet || git commit -m "feat: add Arabic localization core"
          git push origin HEAD:feature/arabic-localization
