name: Arabic v2 patch

on:
  workflow_dispatch:
  pull_request:
    branches: [fix/prayer-completion-tracker]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Arabic localization patch
        run: python .github/arabic_patch.py

      - name: Commit patch
        run: |
          git config user.name "nurverse-arabic-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add lib .github/arabic_patch.py
            git commit -m "feat: add Arabic app-wide language support"
            git push origin HEAD:feature/arabic-v2
          fi
