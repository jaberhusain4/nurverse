name: Format PR29

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          dart format             lib/controllers/prayer_controller.dart             lib/services/awal_waqt_service.dart             lib/services/location_service.dart             test/awal_waqt_service_test.dart
      - run: |
          if git diff --quiet --             lib/controllers/prayer_controller.dart             lib/services/awal_waqt_service.dart             lib/services/location_service.dart             test/awal_waqt_service_test.dart; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/controllers/prayer_controller.dart             lib/services/awal_waqt_service.dart             lib/services/location_service.dart             test/awal_waqt_service_test.dart
          git commit -m "style: format prayer correctness changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
