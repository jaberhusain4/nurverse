name: Calculation method diagnostic

on:
  push:
    branches: [diag/calculation-methods]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/calculation_methods_diagnostic.dart
