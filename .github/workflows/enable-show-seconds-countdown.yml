name: One-time Show Seconds countdown repair

on:
  push:
    paths:
      - '.github/workflows/enable-show-seconds-countdown.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1
      - name: Patch countdown display
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/localized_prayer_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = "                    c.timeRemainingForNextPrayer,"
          new = "                    settings.showSeconds ? c.timeRemainingForNextPrayer : _withoutSeconds(c.timeRemainingForNextPrayer),"
          if old not in text:
              raise SystemExit('Expected countdown line not found.')
          text = text.replace(old, new, 1)
          marker = "  Widget _importantTimes(BuildContext context, PrayerController c) {"
          helper = "  String _withoutSeconds(String value) {\n    final match = RegExp(r'^(\\d{2}):(\\d{2})').firstMatch(value.trim());\n    return match == null ? value : '${match.group(1)}:${match.group(2)}';\n  }\n\n"
          if 'String _withoutSeconds(String value)' not in text:
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/localized_prayer_screen.dart
          git commit -m 'fix(settings): hide prayer countdown seconds when disabled'
          git push origin HEAD:fix/prayer-completion-tracker
          git rm .github/workflows/enable-show-seconds-countdown.yml
          git commit -m 'chore: remove one-time countdown seconds workflow'
          git push origin HEAD:fix/prayer-completion-tracker
