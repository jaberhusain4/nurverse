name: Extract Dart formatting

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format changed files
        run: |
          dart format lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart

      - name: Print exact formatter diff
        run: |
          git diff --no-ext-diff --unified=3 -- lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart
