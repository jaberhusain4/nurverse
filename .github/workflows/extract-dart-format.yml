name: Extract Dart formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Format changed files
        run: |
          dart format lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart

      - name: Commit formatted files
        run: |
          if git diff --quiet --             lib/controllers/prayer_controller.dart             lib/screens/home_screen.dart             lib/screens/prayer_screen.dart; then
            echo "Already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/controllers/prayer_controller.dart             lib/screens/home_screen.dart             lib/screens/prayer_screen.dart
          git commit -m "style: apply dartfmt to prayer live-update files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
