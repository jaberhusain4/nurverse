name: Final Dart format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply dartfmt
        run: dart format lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart

      - name: Commit format changes
        run: |
          if git diff --quiet -- lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/prayer_controller.dart lib/screens/home_screen.dart lib/screens/prayer_screen.dart
          git commit -m "style: finalize dartfmt after dependency resolution"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
