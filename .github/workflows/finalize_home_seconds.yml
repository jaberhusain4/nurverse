name: Finalize Home Seconds Preference

on:
  push:
    branches: [fix/prayer-completion-tracker]

jobs:
  finalize:
    if: github.actor == 'jaberhusain4'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1
      - name: Normalize remaining Home time display
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/simple_home_screen_v11.dart')
          s = p.read_text(encoding='utf-8')
          old = "prohibited: controller.prohibitedTimeText.toString(),"
          new = "prohibited: settings.showSeconds ? controller.prohibitedTimeText.toString() : _withoutSeconds(controller.prohibitedTimeText.toString()),"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/simple_home_screen_v11.dart
          git diff --cached --quiet || git commit -m 'fix(home): apply seconds preference to prohibited time'
          git push
          git rm .github/workflows/finalize_home_seconds.yml
          git commit -m 'chore: remove temporary Home seconds workflow'
          git push
