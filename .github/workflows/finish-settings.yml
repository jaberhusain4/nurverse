name: Finish Settings

on:
  push:
    branches: [main]

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply settings finishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text()

          patches = [
            ("""                const ['Bangla', 'English'],
                settings.setQuranTranslation,
              ),""", """                const ['Bangla', 'English'],
                settings.setQuranTranslation,
                selectedValue: settings.quranTranslation,
              ),"""),
            ("""                const ['Default', 'Amiri', 'Scheherazade'],
                settings.setQuranArabicFont,
              ),""", """                const ['Default', 'Amiri', 'Scheherazade'],
                settings.setQuranArabicFont,
                selectedValue: settings.quranArabicFont,
              ),"""),
            ("""                const ['hijri', 'gregorian', 'both'],
                settings.setDateDisplayPreference,
              ),""", """                const ['hijri', 'gregorian', 'both'],
                settings.setDateDisplayPreference,
                selectedValue: settings.dateDisplayPreference,
              ),"""),
          ]
          for old, new in patches:
              if old in s:
                  s = s.replace(old, new, 1)

          anchor = """            _switchTile(
              context,
              Icons.notifications_active_outlined,
              _t(languageCode, 'আজান নোটিফিকেশন', 'Adhan Notifications'),
              _t(languageCode, 'সালাতের সময়ের নোটিফিকেশন চালু রাখুন',
                  'Enable prayer-time notifications'),
              settings.isAdhanNotificationEnabled,
              settings.toggleAdhanNotification,
            ),"""
          extra = anchor + """
            _divider(),
            _tile(
              context,
              Icons.music_note_outlined,
              _t(languageCode, 'নোটিফিকেশন সাউন্ড', 'Notification Sound'),
              settings.notificationSound,
              () => _showChoiceSheet(
                context,
                _t(languageCode, 'নোটিফিকেশন সাউন্ড', 'Notification Sound'),
                const ['Default', 'Silent'],
                settings.setNotificationSound,
                selectedValue: settings.notificationSound,
              ),
            ),
            _divider(),
            _tile(
              context,
              Icons.alarm_outlined,
              _t(languageCode, 'সালাত রিমাইন্ডার', 'Prayer Reminder'),
              settings.prayerReminderMinutes == 0
                  ? _t(languageCode, 'বন্ধ', 'Off')
                  : '${settings.prayerReminderMinutes} ${_t(languageCode, 'মিনিট আগে', 'min before')}',
              () => _showChoiceSheet(
                context,
                _t(languageCode, 'সালাত রিমাইন্ডার', 'Prayer Reminder'),
                const ['0', '5', '10', '15', '30', '60'],
                (value) => settings.setPrayerReminderMinutes(int.parse(value)),
                selectedValue: settings.prayerReminderMinutes.toString(),
              ),
            ),"""
          if 'Notification Sound' not in s and anchor in s:
              s = s.replace(anchor, extra, 1)

          time_format_anchor = """            _switchTile(
              context,
              Icons.timer_outlined,
              _t(languageCode, 'সেকেন্ড দেখান', 'Show seconds'),
              _t(languageCode, 'যেখানে সমর্থিত সেখানে সেকেন্ড দেখাবে', 'Show seconds where supported'),
              settings.showSeconds,
              settings.toggleShowSeconds,
            ),"""
          time_format_extra = time_format_anchor + """
            _divider(),
            _tile(
              context,
              Icons.access_time_rounded,
              _t(languageCode, 'সময় ফরম্যাট', 'Time Format', 'تنسيق الوقت'),
              settings.is24Hour
                  ? _t(languageCode, '২৪ ঘণ্টা', '24-hour', '24 ساعة')
                  : _t(languageCode, '১২ ঘণ্টা', '12-hour', '12 ساعة'),
              () => _showChoiceSheet(
                context,
                _t(languageCode, 'সময় ফরম্যাট', 'Time Format', 'تنسيق الوقت'),
                const ['12', '24'],
                settings.setTimeFormat,
                selectedValue: settings.timeFormat,
              ),
            ),"""
          if 'Time Format' not in s and time_format_anchor in s:
              s = s.replace(time_format_anchor, time_format_extra, 1)

          start = s.index('  Future<void> _showChoiceSheet(')
          end = s.index('  Future<void> _showTextSizeSheet(', start)
          fixed = r'''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';
    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      builder: (sheetContext) {
        final maxHeight = MediaQuery.sizeOf(sheetContext).height * .82;
        return SafeArea(
          child: ConstrainedBox(
            constraints: BoxConstraints(maxHeight: maxHeight),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Padding(
                  padding: const EdgeInsets.fromLTRB(18, 18, 18, 12),
                  child: Text(
                    title,
                    style: Theme.of(sheetContext)
                        .textTheme
                        .titleLarge
                        ?.copyWith(fontWeight: FontWeight.w900),
                  ),
                ),
                Flexible(
                  child: ListView.builder(
                    shrinkWrap: true,
                    padding: EdgeInsets.zero,
                    itemCount: options.length,
                    itemBuilder: (context, index) {
                      final option = options[index];
                      final label = options.length == 3 &&
                              options.contains('bn') &&
                              options.contains('en') &&
                              options.contains('ar')
                          ? (isEnglish
                              ? ({
                                    'bn': 'Bangla',
                                    'en': 'English',
                                    'ar': 'Arabic'
                                  }[option] ?? option)
                              : (isArabic
                                  ? ({
                                        'bn': 'البنغالية',
                                        'en': 'الإنجليزية',
                                        'ar': 'العربية'
                                      }[option] ?? option)
                                  : ({
                                        'bn': 'বাংলা',
                                        'en': 'ইংরেজি',
                                        'ar': 'আরবি'
                                      }[option] ?? option)))
                          : _choiceLabel(option, languageCode);
                      return ListTile(
                        title: Text(label),
                        trailing: option == selectedValue
                            ? const Icon(Icons.check_circle_rounded,
                                color: AppColors.seaBlue)
                            : null,
                        onTap: () async {
                          await onSelected(option);
                          if (sheetContext.mounted) Navigator.pop(sheetContext);
                        },
                      );
                    },
                  ),
                ),
                const SizedBox(height: 8),
              ],
            ),
          ),
        );
      },
    );
  }

'''
          s = s[:start] + fixed + s[end:]
          p.write_text(s)
          PY
          dart format lib/screens/settings_hub_screen_v4.dart
          flutter pub get
          flutter analyze lib/screens/settings_hub_screen_v4.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/settings_hub_screen_v4.dart
          git commit -m 'fix(settings): add time format setting'
          git rm .github/workflows/finish-settings.yml
          git rm .github/workflows/finish-settings-apply.yml || true
          git commit -m 'chore: remove temporary settings workflows'
          git push
