name: Finish 12/24 Hour Time Format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch time format
        shell: python
        run: |
          from pathlib import Path

          settings = Path('lib/screens/settings_hub_screen_v4.dart')
          text = settings.read_text(encoding='utf-8')
          old = "          _divider(), _switchTile(context, Icons.timer_outlined, _t(languageCode, 'সেকেন্ড দেখান', 'Show seconds'), _t(languageCode, 'যেখানে সমর্থিত সেখানে সেকেন্ড দেখাবে', 'Show seconds where supported'), settings.showSeconds, settings.toggleShowSeconds),"
          new = "          _divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'সময় বিন্যাস', 'Time Format', 'تنسيق الوقت'), _timeFormatLabel(settings.timeFormat, languageCode), () => _showChoiceSheet(context, _t(languageCode, 'সময় বিন্যাস', 'Time Format', 'تنسيق الوقت'), const ['12', '24'], settings.setTimeFormat, selectedValue: settings.timeFormat)),\n          _divider(), _switchTile(context, Icons.timer_outlined, _t(languageCode, 'সেকেন্ড দেখান', 'Show seconds'), _t(languageCode, 'যেখানে সমর্থিত সেখানে সেকেন্ড দেখাবে', 'Show seconds where supported'), settings.showSeconds, settings.toggleShowSeconds),"
          if old not in text:
              raise SystemExit('Settings insertion point not found')
          text = text.replace(old, new, 1)
          marker = "  String _notificationSoundLabel(String sound, String languageCode) {"
          helper = "  String _timeFormatLabel(String value, String languageCode) { if (value == '24') return _t(languageCode, '২৪ ঘণ্টা', '24-hour', '24 ساعة'); return _t(languageCode, '১২ ঘণ্টা', '12-hour', '12 ساعة'); }\n"
          if marker not in text:
              raise SystemExit('Settings helper marker not found')
          text = text.replace(marker, helper + marker, 1)
          settings.write_text(text, encoding='utf-8')

          home = Path('lib/screens/home_screen.dart')
          text = home.read_text(encoding='utf-8')
          old_clock = "  void _updateClock() {\n    final now = DateTime.now();\n    final period = now.hour >= 12 ? 'PM' : 'AM';\n    final hour = now.hour % 12 == 0 ? 12 : now.hour % 12;\n    final value = '${hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')} $period';\n\n    if (_currentTime == value) return;\n    setState(() => _currentTime = value);\n  }"
          new_clock = "  void _updateClock() {\n    final now = DateTime.now();\n    final settings = context.read<SettingsProvider>();\n    final showSeconds = settings.showSeconds;\n    final is24Hour = settings.is24Hour;\n    final period = now.hour >= 12 ? 'PM' : 'AM';\n    final hour = is24Hour ? now.hour : (now.hour % 12 == 0 ? 12 : now.hour % 12);\n    final base = '${hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}';\n    final value = showSeconds\n        ? '$base:${now.second.toString().padLeft(2, '0')}${is24Hour ? '' : ' $period'}'\n        : '$base${is24Hour ? '' : ' $period'}';\n\n    if (_currentTime == value) return;\n    setState(() => _currentTime = value);\n  }"
          if old_clock not in text:
              raise SystemExit('Home clock block not found')
          text = text.replace(old_clock, new_clock, 1)
          old_display = "  String _displayTime(String value, bool showSeconds) {\n    final raw = value.trim();\n    if (showSeconds) return raw;\n    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(raw);\n    return match?.group(1) ?? raw;\n  }"
          new_display = "  String _displayTime(String value, bool showSeconds, bool is24Hour) {\n    final raw = value.trim();\n    final match = RegExp(r'^(\\d{1,2}):(\\d{2})(?::(\\d{2}))?\\s*(AM|PM)?$', caseSensitive: false).firstMatch(raw);\n    if (match == null) return raw;\n    var hour = int.parse(match.group(1)!);\n    final minute = match.group(2)!;\n    final second = match.group(3);\n    final period = match.group(4)?.toUpperCase();\n    if (period != null) {\n      if (period == 'AM') { hour = hour == 12 ? 0 : hour; }\n      else { hour = hour == 12 ? 12 : hour + 12; }\n    }\n    final displayHour = is24Hour ? hour : (hour % 12 == 0 ? 12 : hour % 12);\n    final base = '${displayHour.toString().padLeft(2, '0')}:$minute';\n    if (showSeconds && second != null) {\n      return is24Hour ? '$base:$second' : '$base:$second ${hour >= 12 ? 'PM' : 'AM'}';\n    }\n    return is24Hour ? base : '$base ${hour >= 12 ? 'PM' : 'AM'}';\n  }"
          if old_display not in text:
              raise SystemExit('Home display-time block not found')
          text = text.replace(old_display, new_display, 1)
          old_list = "  List<Map<String, dynamic>> _displayPrayerTimes(\n    List<Map<String, dynamic>> prayers,\n    bool showSeconds,\n  ) {"
          new_list = "  List<Map<String, dynamic>> _displayPrayerTimes(\n    List<Map<String, dynamic>> prayers,\n    bool showSeconds,\n    bool is24Hour,\n  ) {"
          if old_list not in text:
              raise SystemExit('Home prayer-list signature not found')
          text = text.replace(old_list, new_list, 1)
          text = text.replace("          copy[key] = _displayTime(value.toString(), showSeconds);", "          copy[key] = _displayTime(value.toString(), showSeconds, is24Hour);", 1)
          home.write_text(text, encoding='utf-8')

          # Update every call site of _displayPrayerTimes with the provider setting.
          text = home.read_text(encoding='utf-8')
          text = text.replace("_displayPrayerTimes(controller.prayers, settings.showSeconds)", "_displayPrayerTimes(controller.prayers, settings.showSeconds, settings.is24Hour)")
          home.write_text(text, encoding='utf-8')
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_hub_screen_v4.dart lib/screens/home_screen.dart .github/workflows/finish-time-format.yml
          git rm .github/workflows/finish-time-format.yml
          git commit -m "Complete 12/24-hour time format system [skip ci]"
          git push