name: Fix Awal Waqt

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Awal Waqt calculation
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/widgets/common/current_prayer_premium_card.dart')
          text = path.read_text(encoding='utf-8')

          start_marker = '  String _awalText(BuildContext context, String actualEndTime, bool is24Hour) {'
          build_marker = '\n  @override\n  Widget build(BuildContext context) {'
          start = text.index(start_marker)
          end = text.index(build_marker, start)

          new_function = '''  String _awalText(BuildContext context, String actualEndTime, bool is24Hour) {
    final now = DateTime.now();
    final start = _parseTime(currentPrayerTime, now);
    final end = _parseTime(actualEndTime, now);
    if (start == null || end == null) {
      return _l10n(context).localeText(values: {
        'bn': 'আওয়াল ওয়াক্তের তথ্য প্রস্তুত হচ্ছে',
        'en': 'Awal Waqt information is being prepared',
        'ar': 'جارٍ تجهيز وقت الأول',
      });
    }

    // Awal Waqt is exactly the first one-third of the complete prayer-time
    // window. It must not cover the full prayer window.
    var endTime = end;
    if (!endTime.isAfter(start)) endTime = endTime.add(const Duration(days: 1));
    final totalDuration = endTime.difference(start);
    final awalEnd = start.add(Duration(milliseconds: totalDuration.inMilliseconds ~/ 3));
    final active = !now.isBefore(start) && now.isBefore(awalEnd);

    final label = _l10n(context).localeText(values: {
      'bn': active ? 'আওয়াল ওয়াক্ত চলছে' : 'আওয়াল ওয়াক্ত শেষ',
      'en': active ? 'Awal Waqt active' : 'Awal Waqt ended',
      'ar': active ? 'وقت الأول مستمر' : 'انتهى وقت الأول',
    });
    return '$label • ${_clock(start, is24Hour)} → ${_clock(awalEnd, is24Hour)}';
  }
'''

          text = text[:start] + new_function + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/common/current_prayer_premium_card.dart .github/workflows/fix-awal-waqt.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: calculate Awal Waqt as first third of prayer window'
          git push
