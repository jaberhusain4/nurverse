name: Settings repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Repair canonical Settings
        run: python3 tools/fix_settings_canonical.py
      - name: Format and verify
        run: |
          dart format lib/screens/canonical_settings_screen.dart
          flutter pub get
          flutter analyze lib/screens/canonical_settings_screen.dart
      - name: Commit repaired Settings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/canonical_settings_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'fix(settings): restore unified settings behavior and localization'
            git push origin HEAD:main
          fi
