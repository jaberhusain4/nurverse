name: Repair Home hardcoded localization

on:
  push:
    branches: [fix/home-hardcoded-localization]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-hardcoded-localization
          fetch-depth: 0

      - name: Patch active Home screens without changing layout
        shell: python
        run: |
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Anchor not found in {path}: {old[:80]}')
                  s = s.replace(old, new, 1)
              if s == original:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(s, encoding='utf-8')

          patch('lib/screens/simple_home_screen_nova.dart', [
              ("import '../theme/app_theme.dart';", "import '../theme/app_theme.dart';\nimport '../localization/app_localizations.dart';"),
              ("  String _tr(String bn, String en, String lang) => lang == 'en' ? en : bn;", "  String _tr(String bn, String en, String lang) {\n    if (lang == 'en') return en;\n    if (lang == 'ar') {\n      const ar = <String, String>{\n        'লোকেশন': 'الموقع',\n        'Location': 'الموقع',\n        'লোকেশন পাওয়া যায়নি': 'الموقع غير متاح',\n        'Location unavailable': 'الموقع غير متاح',\n        'বর্তমান লোকেশন আপডেট করুন': 'تحديث الموقع الحالي',\n        'Update current location': 'تحديث الموقع الحالي',\n        'ঢাকা': 'دكا',\n        'Dhaka': 'دكا',\n        'আপনার কুরআন': 'القرآن الخاص بك',\n        'Your Quran': 'القرآن الخاص بك',\n      };\n      return ar[bn] ?? ar[en] ?? en;\n    }\n    return bn;\n  }"),
              ("    const en = <String, String>{\n      'fajr': 'Fajr',\n      'dhuhr': 'Dhuhr',\n      'jumuah': 'Jumuah',\n      'asr': 'Asr',\n      'maghrib': 'Maghrib',\n      'isha': 'Isha',\n    };\n    return (lang == 'en' ? en : bn)[key] ?? value;", "    const en = <String, String>{\n      'fajr': 'Fajr',\n      'dhuhr': 'Dhuhr',\n      'jumuah': 'Jumu’ah',\n      'asr': 'Asr',\n      'maghrib': 'Maghrib',\n      'isha': 'Isha',\n      'ishraq': 'Ishraq',\n      'duha': 'Duha',\n      'awwabin': 'Awwabin',\n      'tahajjud': 'Tahajjud',\n    };\n    const ar = <String, String>{\n      'fajr': 'الفجر',\n      'dhuhr': 'الظهر',\n      'jumuah': 'الجمعة',\n      'asr': 'العصر',\n      'maghrib': 'المغرب',\n      'magrib': 'المغرب',\n      'isha': 'العشاء',\n      'ishraq': 'الإشراق',\n      'duha': 'الضحى',\n      'awwabin': 'الأوابين',\n      'tahajjud': 'التهجد',\n    };\n    if (lang == 'ar') return ar[key] ?? value;\n    return (lang == 'en' ? en : bn)[key] ?? value;"),
              ("                      language == 'en' ? 'PRAYER NOW' : 'সালাত চলছে',", "                      language == 'en' ? 'PRAYER NOW' : language == 'ar' ? 'الصلاة الآن' : 'সালাত চলছে',"),
              ("                        ? (language == 'en' ? 'Next Prayer' : 'পরবর্তী সালাত')", "                        ? (language == 'en' ? 'Next Prayer' : language == 'ar' ? 'الصلاة التالية' : 'পরবর্তী সালাত')"),
              ("                    language == 'en' ? 'time remaining' : 'সময় বাকি',", "                    language == 'en' ? 'time remaining' : language == 'ar' ? 'الوقت المتبقي' : 'সময় বাকি',"),
              ("                          title: language == 'en' ? 'Current' : 'বর্তমান',", "                          title: language == 'en' ? 'Current' : language == 'ar' ? 'الحالي' : 'বর্তমান',"),
              ("                            title: language == 'en' ? 'Next' : 'পরবর্তী',", "                            title: language == 'en' ? 'Next' : language == 'ar' ? 'التالي' : 'পরবর্তী',"),
              ("    if (language == 'en') return name;", "    if (language == 'en') return name;\n    if (language == 'ar') {\n      const ar = <String, String>{'Fajr': 'الفجر', 'Dhuhr': 'الظهر', 'Asr': 'العصر', 'Maghrib': 'المغرب', 'Isha': 'العشاء'};\n      return ar[name] ?? name;\n    }"),
              ("                  label: language == 'en' ? 'Sunrise' : 'সূর্যোদয়',", "                  label: language == 'en' ? 'Sunrise' : language == 'ar' ? 'الشروق' : 'সূর্যোদয়',"),
              ("                  label: language == 'en' ? 'Sunset' : 'সূর্যাস্ত',", "                  label: language == 'en' ? 'Sunset' : language == 'ar' ? 'الغروب' : 'সূর্যাস্ত',"),
              ("    if (language == 'en') return name;", "    if (language == 'en') return name;\n    if (language == 'ar') {\n      const ar = <String, String>{\n        'Fajr': 'الفجر', 'Dhuhr': 'الظهر', 'Asr': 'العصر',\n        'Maghrib': 'المغرب', 'Isha': 'العشاء',\n      };\n      return ar[name] ?? name;\n    }"),
          ])

          # Informative Home uses AppLocalizations for most labels; normalize the few
          # remaining hard-coded 2-way language branches.
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("languageCode == 'en' ? en : bn", "languageCode == 'en' ? en : languageCode == 'ar' ? ar : bn")
          if s2 != s:
              p.write_text(s2, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "nurverse-home-localization-bot"
          git config user.email "actions@github.com"
          rm -f .github/workflows/fix-home-localization.yml
          git add lib/screens/simple_home_screen_nova.dart lib/screens/home_screen.dart .github/workflows/fix-home-localization.yml
          git commit -m "fix: localize active home screen text"
          git push origin fix/home-hardcoded-localization
