name: Fix Home Screen Time Format

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Home Screen time-format fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          old_clock = """  void _updateClock() {
    final now = DateTime.now();
    final period = now.hour >= 12 ? 'PM' : 'AM';
    final hour = now.hour % 12 == 0 ? 12 : now.hour % 12;
    final value = '${hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')} $period';

    if (_currentTime == value) return;
    setState(() => _currentTime = value);
  }
"""
          new_clock = """  void _updateClock() {
    final now = DateTime.now();
    final settings = context.read<SettingsProvider>();
    final hour24 = now.hour;
    final minute = now.minute.toString().padLeft(2, '0');
    final second = now.second.toString().padLeft(2, '0');
    final value = settings.is24Hour
        ? '${hour24.toString().padLeft(2, '0')}:$minute:$second'
        : '${(hour24 % 12 == 0 ? 12 : hour24 % 12).toString().padLeft(2, '0')}:$minute:$second ${hour24 >= 12 ? 'PM' : 'AM'}';

    if (_currentTime == value) return;
    setState(() => _currentTime = value);
  }
"""
          if old_clock not in s:
              raise SystemExit('clock block not found')
          s = s.replace(old_clock, new_clock, 1)
          old_display = """  String _displayTime(String value, bool showSeconds) {
    final raw = value.trim();
    if (showSeconds) return raw;
    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(raw);
    return match?.group(1) ?? raw;
  }

  List<Map<String, dynamic>> _displayPrayerTimes(
    List<Map<String, dynamic>> prayers,
    bool showSeconds,
  ) {
"""
          new_display = """  String _displayTime(String value, bool showSeconds, bool is24Hour) {
    final raw = value.trim();
    final match = RegExp(r'^(\\d{1,2}):(\\d{2})(?::(\\d{2}))?\\s*([AaPp][Mm])?$').firstMatch(raw);
    if (match == null) return raw;

    var hour = int.parse(match.group(1)!);
    final minute = match.group(2)!;
    final second = match.group(3);
    final period = match.group(4)?.toUpperCase();

    if (period != null) {
      if (hour == 12) hour = 0;
      if (period == 'PM') hour += 12;
    }

    if (is24Hour) {
      final result = '${hour.toString().padLeft(2, '0')}:$minute';
      return showSeconds && second != null ? '$result:$second' : result;
    }

    final displayHour = hour % 12 == 0 ? 12 : hour % 12;
    return showSeconds && second != null
        ? '${displayHour.toString().padLeft(2, '0')}:$minute:$second ${hour >= 12 ? 'PM' : 'AM'}'
        : '${displayHour.toString().padLeft(2, '0')}:$minute ${hour >= 12 ? 'PM' : 'AM'}';
  }

  List<Map<String, dynamic>> _displayPrayerTimes(
    List<Map<String, dynamic>> prayers,
    bool showSeconds,
    bool is24Hour,
  ) {
"""
          if old_display not in s:
              raise SystemExit('display block not found')
          s = s.replace(old_display, new_display, 1)
          s = s.replace('_displayTime(value.toString(), showSeconds)', '_displayTime(value.toString(), showSeconds, is24Hour)')
          s = s.replace('_displayPrayerTimes(controller.prayers, settings.showSeconds)', '_displayPrayerTimes(controller.prayers, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(_currentTime, settings.showSeconds)', '_displayTime(_currentTime, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(controller.previousPrayerTime, settings.showSeconds)', '_displayTime(controller.previousPrayerTime, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(controller.currentPrayerTime, settings.showSeconds)', '_displayTime(controller.currentPrayerTime, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(controller.nextPrayerTime, settings.showSeconds)', '_displayTime(controller.nextPrayerTime, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(controller.timeRemainingForNextPrayer, settings.showSeconds)', '_displayTime(controller.timeRemainingForNextPrayer, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(currentJamaat, settings.showSeconds)', '_displayTime(currentJamaat, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(sunTimes?.sunriseString ?? controller.sunriseTime, settings.showSeconds)', '_displayTime(sunTimes?.sunriseString ?? controller.sunriseTime, settings.showSeconds, settings.is24Hour)')
          s = s.replace('_displayTime(sunTimes?.sunsetString ?? controller.sunsetTime, settings.showSeconds)', '_displayTime(sunTimes?.sunsetString ?? controller.sunsetTime, settings.showSeconds, settings.is24Hour)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify Home Screen
        run: |
          grep -q "String _displayTime(String value, bool showSeconds, bool is24Hour)" lib/screens/home_screen.dart
          grep -q "_displayPrayerTimes(controller.prayers, settings.showSeconds, settings.is24Hour)" lib/screens/home_screen.dart
          grep -q "settings.is24Hour" lib/screens/home_screen.dart
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/home_screen.dart
          if ! git diff --cached --quiet; then git commit -m 'fix(home): apply 12/24 hour time format'; git push origin HEAD:main; else echo 'Home Screen already fixed'; fi
