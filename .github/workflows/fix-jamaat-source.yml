name: Jamaat source repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize SettingsProvider Jamaat API
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("lib/providers/settings_provider.dart"); s=p.read_text(encoding="utf-8"); old="""  String get fajrJamaat => _fajrJamaat;\n  String get dhuhrJamaat => _dhuhrJamaat;\n  String get asrJamaat => _asrJamaat;\n  String get maghribJamaat => _maghribJamaat;\n  String get ishaJamaat => _ishaJamaat;\n\n  String getJamaat(String prayer) {\n    switch (prayer.trim()) {\n      case \"Fajr\": return _fajrJamaat;\n      case \"Dhuhr\": return _dhuhrJamaat;\n      case \"Asr\": return _asrJamaat;\n      case \"Maghrib\": return _maghribJamaat;\n      case \"Isha\": return _ishaJamaat;\n      default: return \"--:--\";\n    }\n  }\n\n  Map<String, String> get jamaatTimes => {\n    \"Fajr\": _fajrJamaat, \"Dhuhr\": _dhuhrJamaat, \"Asr\": _asrJamaat,\n    \"Maghrib\": _maghribJamaat, \"Isha\": _ishaJamaat,\n  };\n"""; new="""  // JamaatService is the single source of truth. These provider getters\n  // remain as a compatibility API for existing screens/widgets.\n  String get fajrJamaat => JamaatService.get(\"Fajr\");\n  String get dhuhrJamaat => JamaatService.get(\"Dhuhr\");\n  String get asrJamaat => JamaatService.get(\"Asr\");\n  String get maghribJamaat => JamaatService.get(\"Maghrib\");\n  String get ishaJamaat => JamaatService.get(\"Isha\");\n\n  String getJamaat(String prayer) => JamaatService.get(prayer.trim());\n\n  Map<String, String> get jamaatTimes => JamaatService.all;\n"""; assert old in s, "Expected Jamaat provider block was not found"; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          dart format lib/providers/settings_provider.dart
          flutter pub get
          flutter analyze --no-fatal-infos lib/providers/settings_provider.dart lib/screens/prayer/jamaat_settings_screen.dart lib/services/jamaat_service.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/settings_provider.dart
          if ! git diff --cached --quiet; then git commit -m 'fix(jamaat): use shared service as single source of truth'; git push origin HEAD:main; fi
