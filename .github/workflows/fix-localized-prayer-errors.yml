name: Fix localized prayer compile errors

on:
  pull_request:
    branches: [fix/prayer-completion-tracker]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/localized-prayer-errors
          fetch-depth: 0

      - name: Apply targeted compatibility fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/screens/localized_prayer_screen.dart')
          s = p.read_text(encoding='utf-8')
          if "import '../localization/app_localizations_x.dart';" not in s:
              s = s.replace("import '../localization/app_localizations.dart';\n", "import '../localization/app_localizations.dart';\nimport '../localization/app_localizations_x.dart';\n", 1)
          old = """      {'key': 'ishraq', 'name': l10n.tr('ইশরাক', 'Ishraq')},\n      {'key': 'duha', 'name': l10n.tr('চাশত / দুহা', 'Duha')},\n      {'key': 'awwabin', 'name': l10n.tr('আউওয়াবীন', 'Awwabin')},\n      {'key': 'tahajjud', 'name': l10n.tr('তাহাজ্জুদ', 'Tahajjud')},"""
          new = """      {'key': 'ishraq', 'name': l10n.tr('ইশরাক', 'Ishraq')},\n      {'key': 'duha', 'name': l10n.tr('চাশত / দুহা', 'Duha')},\n      {'key': 'awwabin', 'name': l10n.tr('আউওয়াবীন', 'Awwabin')},\n      {'key': 'tahajjud', 'name': l10n.tr('তাহাজ্জুদ', 'Tahajjud')},"""
          if old not in s:
              raise SystemExit('Nafl entries anchor not found')
          start = """      children: entries.map((e) {\n        final value = c.specialPrayerTimes[e['key']]?.toString() ?? '--:--';"""
          repl = """      children: entries.map((e) {\n        final value = switch (e['key']) {\n          'ishraq' => c.ishraqTime,\n          'duha' => c.duhaTime,\n          'awwabin' => c.awwabinTime,\n          'tahajjud' => c.tahajjudTime,\n          _ => '--:--',\n        };"""
          if start not in s:
              raise SystemExit('specialPrayerTimes usage not found')
          s = s.replace(start, repl, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          git add lib/screens/localized_prayer_screen.dart
          git commit -m "fix: repair localized prayer screen compatibility"
          git push origin fix/localized-prayer-errors
