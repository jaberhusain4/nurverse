name: Fix Onudhabon Ayah Card Syntax

on:
  push:
    paths:
      - '.github/workflows/fix-onudhabon-ayah-syntax.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1

      - name: Repair Onudhabon ayah-card nesting
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/quran/onudhabon_quran_reader.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('  Widget _ayahCard(BuildContext context, QuranSurah surah, QuranVerse verse) {')
          end = text.index('  Widget _chip(BuildContext context, String value, String label) {', start)
          replacement = '''  Widget _ayahCard(BuildContext context, QuranSurah surah, QuranVerse verse) {
    final primary = Theme.of(context).colorScheme.primary;
    final translation = _translations[verse.number];
    final tafsir = _tafsirs[verse.number];

    return Container(
      margin: const EdgeInsets.only(bottom: 12),
      padding: const EdgeInsets.fromLTRB(14, 13, 14, 13),
      decoration: BoxDecoration(
        color: context.cardColor,
        borderRadius: BorderRadius.circular(20),
      ),
      child: Column(
        children: [
          Row(
            children: [
              CircleAvatar(
                radius: 15,
                backgroundColor: primary.withValues(alpha: .10),
                child: Text(
                  _bn(verse.number),
                  style: TextStyle(
                    color: primary,
                    fontSize: 11,
                    fontWeight: FontWeight.w800,
                  ),
                ),
              ),
              const Spacer(),
              Text(
                '${_bn(surah.number)}:${_bn(verse.number)}',
                style: TextStyle(
                  fontSize: 10.5,
                  color: context.secondaryTextColor,
                ),
              ),
            ],
          ),
          const SizedBox(height: 10),
          if (_showAyah)
            Container(
              width: double.infinity,
              alignment: Alignment.centerRight,
              child: Directionality(
                textDirection: TextDirection.rtl,
                child: Text.rich(
                  TextSpan(
                    children: [
                      TextSpan(
                        text: verse.arabic,
                        style: TextStyle(
                          fontSize: _arabicSize,
                          height: _arabicSize >= 25 ? 1.72 : 1.60,
                          fontWeight: FontWeight.w500,
                        ),
                      ),
                      TextSpan(
                        text: '  ۝${_ar(verse.number)}',
                        style: TextStyle(
                          color: primary,
                          fontSize: _arabicSize * .72,
                          fontWeight: FontWeight.w800,
                        ),
                      ),
                    ],
                  ),
                  textAlign: TextAlign.right,
                ),
              ),
            ),
          if (_showTranslation && translation != null && translation.trim().isNotEmpty) ...[
            const SizedBox(height: 12),
            Container(
              width: double.infinity,
              padding: const EdgeInsets.all(12),
              decoration: BoxDecoration(
                color: primary.withValues(alpha: .045),
                borderRadius: BorderRadius.circular(15),
              ),
              child: Text(
                translation,
                textAlign: TextAlign.left,
                style: TextStyle(
                  fontSize: _translationSize,
                  height: _translationSize >= 18 ? 1.55 : 1.48,
                ),
              ),
            ),
          ],
          if (_showTafsir && tafsir != null && tafsir.trim().isNotEmpty) ...[
            const SizedBox(height: 10),
            Container(
              width: double.infinity,
              padding: const EdgeInsets.all(12),
              decoration: BoxDecoration(
                color: primary.withValues(alpha: .035),
                borderRadius: BorderRadius.circular(14),
              ),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(
                    _tafsirTitle,
                    style: TextStyle(
                      fontSize: 11.5,
                      fontWeight: FontWeight.w800,
                      color: primary,
                    ),
                  ),
                  const SizedBox(height: 6),
                  Text(
                    tafsir,
                    style: const TextStyle(
                      fontSize: 13.5,
                      height: 1.55,
                    ),
                  ),
                ],
              ),
            ),
          ],
        ],
      ),
    );
  }

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/quran/onudhabon_quran_reader.dart
          git commit -m "fix(quran): repair Onudhabon ayah card syntax"
          git push origin HEAD:fix/prayer-completion-tracker

# trigger repair workflow
