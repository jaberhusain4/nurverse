name: Fix Onudhabon final syntax

on:
  push:
    paths:
      - '.github/workflows/fix-onudhabon-final-syntax.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1

      - name: Fix remaining missing parenthesis
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/quran/onudhabon_quran_reader.dart')
          text = path.read_text(encoding='utf-8')
          old = "shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)))),\n      ]),\n    );\n  }"
          new = "shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))))),\n      ]),\n    );\n  }"
          if old not in text:
              raise SystemExit('Expected final Onudhabon syntax pattern was not found; refusing to modify file.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/quran/onudhabon_quran_reader.dart
          git commit -m "fix(quran): close final Onudhabon header widget"
          git push origin HEAD:fix/prayer-completion-tracker

# trigger repair workflow
