name: Fix Prayer Method and Madhhab UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch settings and selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          provider = Path('lib/providers/settings_provider.dart')
          s = provider.read_text()
          old = "  static const List<String> madhabs = ['Hanafi', 'Shafi'];"
          new = """  static const List<String> madhabs = [
            'Hanafi',
            'Shafi',
            'Maliki',
            'Hanbali',
          ];"""
          if old not in s:
              raise SystemExit('Expected madhab list was not found in settings_provider.dart')
          s = s.replace(old, new, 1)

          pattern = r"  String _normalizeMadhab\(String value\) \{.*?\n  \}"
          replacement = """  String _normalizeMadhab(String value) {
            switch (value.trim().toLowerCase()) {
              case 'shafi':
              case 'shafii':
              case 'shafi’i':
              case \"shafi'i\":
                return 'Shafi';
              case 'maliki':
                return 'Maliki';
              case 'hanbali':
                return 'Hanbali';
              case 'hanafi':
                return 'Hanafi';
              default:
                return 'Hanafi';
            }
          }"""
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected _normalizeMadhab function was not found')
          provider.write_text(s2)

          config = Path('lib/services/prayer_calculation_config.dart')
          c = config.read_text()
          pattern = r"  static Madhab _parseMadhab\(String value\) \{.*?\n  \}"
          replacement = """  static Madhab _parseMadhab(String value) {
            final String normalized = value.trim().toLowerCase();

            switch (normalized) {
              case 'hanafi':
                return Madhab.hanafi;
              case 'shafi':
              case 'shafii':
              case 'shafi’i':
              case \"shafi'i\":
              case 'maliki':
              case 'hanbali':
              case 'standard':
                // Adhan exposes the one-shadow Asr rule as Madhab.shafi;
                // Maliki and Hanbali use the same practical Asr rule here.
                return Madhab.shafi;
              default:
                return Madhab.hanafi;
            }
          }"""
          c2, count = re.subn(pattern, replacement, c, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected _parseMadhab function was not found')
          config.write_text(c2)

          screen = Path('lib/screens/settings_hub_screen_v4.dart')
          s = screen.read_text()

          labels_old = """      'Hanafi': 'হানাফি',
      'Shafi': 'শাফেয়ী',"""
          labels_new = """      'Hanafi': 'হানাফি',
      'Shafi': 'শাফেয়ী',
      'Maliki': 'মালিকি',
      'Hanbali': 'হাম্বলি',"""
          if labels_old not in s:
              raise SystemExit('Expected Bangla madhhab labels were not found')
          s = s.replace(labels_old, labels_new, 1)

          ar_old = """    'Hanafi': 'حنفي',
    'Shafi': 'شافعي',"""
          ar_new = """    'Hanafi': 'حنفي',
    'Shafi': 'شافعي',
    'Maliki': 'مالكي',
    'Hanbali': 'حنبلي',"""
          if ar_old not in s:
              raise SystemExit('Expected Arabic madhhab labels were not found')
          s = s.replace(ar_old, ar_new, 1)

          start = s.index('  Future<void> _showChoiceSheet(')
          end = s.index('  Future<void> _showTextSizeSheet(', start)
          fixed = r'''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';
    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      showDragHandle: true,
      builder: (sheetContext) => SafeArea(
        child: ConstrainedBox(
          constraints: BoxConstraints(
            maxHeight: MediaQuery.sizeOf(sheetContext).height * .78,
          ),
          child: Column(
            children: [
              Padding(
                padding: const EdgeInsets.fromLTRB(18, 8, 18, 12),
                child: Text(
                  title,
                  style: Theme.of(sheetContext)
                      .textTheme
                      .titleLarge
                      ?.copyWith(fontWeight: FontWeight.w900),
                ),
              ),
              Expanded(
                child: ListView.builder(
                  physics: const BouncingScrollPhysics(),
                  itemCount: options.length,
                  itemBuilder: (_, index) {
                    final option = options[index];
                    final label = options.length == 3 &&
                            options.contains('bn') &&
                            options.contains('en') &&
                            options.contains('ar')
                        ? (isEnglish
                            ? ({
                                  'bn': 'Bangla',
                                  'en': 'English',
                                  'ar': 'Arabic',
                                }[option] ?? option)
                            : (isArabic
                                ? ({
                                      'bn': 'البنغالية',
                                      'en': 'الإنجليزية',
                                      'ar': 'العربية',
                                    }[option] ?? option)
                                : ({
                                      'bn': 'বাংলা',
                                      'en': 'ইংরেজি',
                                      'ar': 'আরবি',
                                    }[option] ?? option)))
                        : _choiceLabel(option, languageCode);

                    return ListTile(
                      title: Text(label),
                      trailing: option == selectedValue
                          ? const Icon(
                              Icons.check_circle_rounded,
                              color: AppColors.seaBlue,
                            )
                          : null,
                      onTap: () async {
                        await onSelected(option);
                        if (sheetContext.mounted) {
                          Navigator.pop(sheetContext);
                        }
                      },
                    );
                  },
                ),
              ),
              const SizedBox(height: 8),
            ],
          ),
        ),
      ),
    );
  }

'''
          s = s[:start] + fixed + s[end:]
          screen.write_text(s)
          PY

      - name: Validate changed Dart files
        run: |
          grep -n -A7 "static const List<String> madhabs" lib/providers/settings_provider.dart
          grep -n -A14 "String _normalizeMadhab" lib/providers/settings_provider.dart
          grep -n -A20 "static Madhab _parseMadhab" lib/services/prayer_calculation_config.dart
          grep -n -A8 "'Maliki'" lib/screens/settings_hub_screen_v4.dart
          grep -n -A65 "Future<void> _showChoiceSheet" lib/screens/settings_hub_screen_v4.dart | head -70

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: restore four madhhabs and scrollable prayer method selector"
          git push origin main
