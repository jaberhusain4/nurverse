name: Fix Prayer Settings UI

on:
  push:
    paths:
      - '.github/workflows/fix-prayer-settings-ui-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch settings provider and config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/providers/settings_provider.dart')
          s = p.read_text()
          old = "static const List<String> madhabs = ['Hanafi', 'Shafi'];"
          new = "static const List<String> madhabs = ['Hanafi', 'Shafi', 'Maliki', 'Hanbali'];"
          if old not in s:
              raise SystemExit('madhab list target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/services/prayer_calculation_config.dart')
          s = p.read_text()
          old = """      case 'shafi':\n      case 'shafii':\n      case 'shafi’i':\n      case \"shafi'i\":\n      case 'maliki':\n      case 'hanbali':\n      case 'standard':\n      case 'shafi_maliki_hanbali':\n        return Madhab.shafi;"""
          new = """      case 'shafi':\n      case 'shafii':\n      case 'shafi’i':\n      case \"shafi'i\":\n        return Madhab.shafi;\n\n      case 'maliki':\n        return Madhab.maliki;\n\n      case 'hanbali':\n        return Madhab.hanbali;\n\n      case 'standard':\n      case 'shafi_maliki_hanbali':\n        return Madhab.shafi;"""
          if old not in s:
              raise SystemExit('madhab parser target not found')
          s = s.replace(old, new, 1)
          old = """  String get madhhabId {\n    return madhab == Madhab.hanafi ? 'Hanafi' : 'Shafi';\n  }"""
          new = """  String get madhhabId {\n    switch (madhab) {\n      case Madhab.hanafi:\n        return 'Hanafi';\n      case Madhab.shafi:\n        return 'Shafi';\n      case Madhab.maliki:\n        return 'Maliki';\n      case Madhab.hanbali:\n        return 'Hanbali';\n    }\n  }"""
          if old not in s:
              raise SystemExit('madhab id target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text()
          start = s.index('  Future<void> _showChoiceSheet(')
          end = s.index('  Future<void> _showTextSizeSheet(', start)
          fixed = '''  Future<void> _showChoiceSheet(BuildContext context, String title,\n      List<String> options, Future<void> Function(String) onSelected,\n      {String? selectedValue}) async {\n    final languageCode = Localizations.localeOf(context).languageCode;\n    final isEnglish = languageCode == 'en';\n    final isArabic = languageCode == 'ar';\n    await showModalBottomSheet<void>(\n      context: context,\n      isScrollControlled: true,\n      showDragHandle: true,\n      builder: (sheetContext) {\n        final maxHeight = MediaQuery.sizeOf(sheetContext).height * .72;\n        return SafeArea(\n          child: ConstrainedBox(\n            constraints: BoxConstraints(maxHeight: maxHeight),\n            child: Column(\n              mainAxisSize: MainAxisSize.min,\n              children: [\n                Padding(\n                  padding: const EdgeInsets.fromLTRB(18, 8, 18, 12),\n                  child: Text(\n                    title,\n                    style: Theme.of(sheetContext).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.w900),\n                    textAlign: TextAlign.center,\n                  ),\n                ),\n                Flexible(\n                  child: ListView.builder(\n                    shrinkWrap: true,\n                    itemCount: options.length,\n                    itemBuilder: (context, index) {\n                      final option = options[index];\n                      final label = options.length == 3 && options.contains('bn') && options.contains('en') && options.contains('ar')\n                          ? (isEnglish\n                              ? ({'bn': 'Bangla', 'en': 'English', 'ar': 'Arabic'}[option] ?? option)\n                              : (isArabic\n                                  ? ({'bn': 'البنغالية', 'en': 'الإنجليزية', 'ar': 'العربية'}[option] ?? option)\n                                  : ({'bn': 'বাংলা', 'en': 'ইংরেজি', 'ar': 'আরবি'}[option] ?? option)))\n                          : _choiceLabel(option, languageCode);\n                      return ListTile(\n                        title: Text(label),\n                        trailing: option == selectedValue\n                            ? const Icon(Icons.check_circle_rounded, color: AppColors.seaBlue)\n                            : null,\n                        onTap: () async {\n                          await onSelected(option);\n                          if (sheetContext.mounted) Navigator.pop(sheetContext);\n                        },\n                      );\n                    },\n                  ),\n                ),\n                const SizedBox(height: 8),\n              ],\n            ),\n          ),\n        );\n      },\n    );\n  }\n\n'''
          s = s[:start] + fixed + s[end:]
          old_labels = """      'Moonsighting Committee': 'চাঁদ দেখা কমিটি',\n      'Hanafi': 'হানাফি',\n      'Shafi': 'শাফেয়ী',"""
          new_labels = """      'Moonsighting Committee': 'চাঁদ দেখা কমিটি',\n      'Hanafi': 'হানাফি',\n      'Shafi': 'শাফেয়ী',\n      'Maliki': 'মালিকি',\n      'Hanbali': 'হাম্বলি',"""
          if old_labels not in s:
              raise SystemExit('Bangla labels target not found')
          s = s.replace(old_labels, new_labels, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: restore all prayer methods and madhhabs without overflow'
          git push origin main
