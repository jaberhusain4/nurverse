name: Fix prayer tracker naming lint

on:
  push:
    paths:
      - '.github/workflows/fix-prayer-tracker-lint.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1

      - name: Fix lowerCamelCase prayer tracker method
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/localized_prayer_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = '_PrayerTrackerCard()'
          new = '_prayerTrackerCard()'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 occurrences, found {count}; refusing to modify file.')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/localized_prayer_screen.dart
          git commit -m 'style(prayer): use lowerCamelCase tracker method'
          git push origin HEAD:fix/prayer-completion-tracker
          git rm .github/workflows/fix-prayer-tracker-lint.yml
          git commit -m 'chore: remove prayer tracker lint workflow'
          git push origin HEAD:fix/prayer-completion-tracker
