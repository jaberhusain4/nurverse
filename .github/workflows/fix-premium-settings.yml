name: Fix Premium Account And Time Format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch canonical settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/canonical_settings_screen.dart')
          s = path.read_text(encoding='utf-8')

          if "import '../services/auth_service.dart';" not in s:
              s = s.replace(
                  "import '../providers/text_scale_provider.dart';\n",
                  "import '../providers/text_scale_provider.dart';\nimport '../services/auth_service.dart';\n",
                  1,
              )

          if '_premiumAccountButton(context)' not in s:
              pattern = re.compile(
                  r"              const SizedBox\(width: 10\),\n"
                  r"              Material\(\n"
                  r"                color: Colors\.transparent,\n"
                  r"                child: InkWell\(\n"
                  r".*?"
                  r"                \),\n"
                  r"              \),\n",
                  re.DOTALL,
              )
              replacement = """              const SizedBox(width: 10),
              _premiumAccountButton(context),
"""
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Premium account control block not found')

          if '_premiumAccountButton(BuildContext context)' not in s:
              marker = "  Widget _premiumChip(IconData icon, String title) => Container(\n"
              if marker not in s:
                  raise SystemExit('Premium chip marker not found')
              helper = r'''  Widget _premiumAccountButton(BuildContext context) {
    final theme = Theme.of(context);
    return StreamBuilder<User?>(
      stream: AuthService.instance.authStateChanges,
      initialData: AuthService.instance.currentUser,
      builder: (context, snapshot) {
        final user = snapshot.data;
        final photoUrl = user?.photoURL?.trim();
        final hasPhoto = user != null && photoUrl != null && photoUrl.isNotEmpty;
        return Material(
          color: Colors.transparent,
          child: InkWell(
            onTap: () => _handleProfileTap(context, user),
            borderRadius: BorderRadius.circular(14),
            child: Container(
              width: 42,
              height: 42,
              decoration: BoxDecoration(
                color: AppColors.seaBlue.withValues(alpha: .10),
                borderRadius: BorderRadius.circular(14),
                border: Border.all(color: AppColors.seaBlue.withValues(alpha: .12)),
              ),
              child: hasPhoto
                  ? ClipRRect(
                      borderRadius: BorderRadius.circular(13),
                      child: Image.network(
                        photoUrl!,
                        width: 42,
                        height: 42,
                        fit: BoxFit.cover,
                        filterQuality: FilterQuality.high,
                        errorBuilder: (_, __, ___) => Icon(
                          Icons.person_rounded,
                          color: theme.colorScheme.primary,
                          size: 22,
                        ),
                      ),
                    )
                  : Icon(
                      user != null ? Icons.person_rounded : Icons.login_rounded,
                      color: theme.colorScheme.primary,
                      size: 22,
                    ),
            ),
          ),
        );
      },
    );
  }

  Future<void> _handleProfileTap(BuildContext context, User? user) async {
    if (user == null) {
      await Navigator.of(context).push(
        MaterialPageRoute<void>(builder: (_) => const GoogleLoginScreen()),
      );
      return;
    }
    await _openAccount(context, user);
  }

  Future<void> _openAccount(BuildContext context, User user) async {
    final theme = Theme.of(context);
    final photoUrl = user.photoURL?.trim();
    await showModalBottomSheet<void>(
      context: context,
      showDragHandle: true,
      builder: (sheetContext) {
        final languageCode = context.read<SettingsProvider>().languageCode;
        return SafeArea(
          child: Padding(
            padding: const EdgeInsets.fromLTRB(20, 8, 20, 24),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                CircleAvatar(
                  radius: 36,
                  backgroundColor: theme.colorScheme.primary.withValues(alpha: .10),
                  backgroundImage: photoUrl != null && photoUrl.isNotEmpty
                      ? NetworkImage(photoUrl)
                      : null,
                  child: photoUrl == null || photoUrl.isEmpty
                      ? Icon(
                          Icons.account_circle_rounded,
                          size: 48,
                          color: theme.colorScheme.primary,
                        )
                      : null,
                ),
                const SizedBox(height: 12),
                Text(
                  user.displayName?.trim().isNotEmpty == true
                      ? user.displayName!
                      : 'NurVerse User',
                  style: theme.textTheme.titleLarge?.copyWith(
                    fontWeight: FontWeight.w800,
                  ),
                  textAlign: TextAlign.center,
                ),
                if (user.email?.isNotEmpty == true) ...[
                  const SizedBox(height: 4),
                  Text(
                    user.email!,
                    style: theme.textTheme.bodyMedium?.copyWith(
                      color: theme.textTheme.bodyMedium?.color?.withValues(alpha: .70),
                    ),
                    textAlign: TextAlign.center,
                  ),
                ],
                const SizedBox(height: 20),
                SizedBox(
                  width: double.infinity,
                  child: OutlinedButton.icon(
                    onPressed: () async {
                      Navigator.of(sheetContext).pop();
                      await AuthService.instance.signOut();
                    },
                    icon: const Icon(Icons.logout_rounded),
                    label: Text(languageCode == 'en' ? 'Logout' : 'লগআউট'),
                  ),
                ),
              ],
            ),
          ),
        );
      },
    );
  }

'''
              s = s.replace(marker, helper + marker, 1)

          old = """      showSelectedIcon: false,
    ),
  );

  Widget _choice("""
          new = """      showSelectedIcon: false,
      style: ButtonStyle(
        foregroundColor: WidgetStateProperty.resolveWith((states) {
          return states.contains(WidgetState.selected)
              ? Colors.white
              : AppColors.seaBlue;
        }),
        backgroundColor: WidgetStateProperty.resolveWith((states) {
          return states.contains(WidgetState.selected)
              ? AppColors.seaBlue
              : Colors.transparent;
        }),
        side: WidgetStateProperty.all(
          BorderSide(color: AppColors.seaBlue.withValues(alpha: .30)),
        ),
      ),
    ),
  );

  Widget _choice("""
          if old not in s:
              raise SystemExit('Time format segmented control marker not found')
          s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- lib/screens/canonical_settings_screen.dart

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/canonical_settings_screen.dart
          if git diff --cached --quiet; then
            echo "Canonical settings already fixed."
            exit 0
          fi
          git commit -m "fix(settings): restore premium account control and SeaBlue time format"
          git push origin HEAD:main
