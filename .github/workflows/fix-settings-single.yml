name: Fix Settings single screen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair canonical Settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          p = Path('lib/screens/canonical_settings_screen.dart')
          s = p.read_text(encoding='utf-8')

          # Reuse the exact premium/login hero from the pre-merge Settings screen.
          old = subprocess.check_output(
              ['git', 'show', 'a9217d7:lib/screens/settings_hub_screen_v4.dart'],
              text=True,
              encoding='utf-8',
          )
          premium_names = [
              '_buildPremiumHero',
              '_premiumChip',
              '_premiumAccountButton',
              '_handleProfileTap',
              '_openAccount',
              '_showPremiumStatus',
          ]
          extracted = {}
          for name in premium_names:
              pattern = r'(?ms)^  (?:Widget|Future<void>) ' + re.escape(name) + r'\b.*?(?=^  (?:Widget|Future<void>) |^}$)'
              match = re.search(pattern, old)
              if not match:
                  raise SystemExit(f'missing premium helper: {name}')
              extracted[name] = match.group(0).replace('_t(', 't(')

          s = s.replace("import 'package:flutter/material.dart';", "import 'package:firebase_auth/firebase_auth.dart';\nimport 'package:flutter/material.dart';", 1)
          if "import '../services/auth_service.dart';" not in s:
              s = s.replace("import '../theme/app_theme.dart';", "import '../theme/app_theme.dart';\nimport '../services/auth_service.dart';\nimport 'auth/google_login_screen.dart';", 1)

          # Replace the reduced premium card with the original account/login hero.
          s = re.sub(r'(?ms)^  Widget _premiumCard\(.*?(?=^  Widget )', '', s, count=1)
          s = s.replace('_premiumCard(context, premium, lang)', '_buildPremiumHero(context, s, premium)', 1)
          marker = "  Widget _section(BuildContext context, String title, IconData icon, List<Widget> children) =>"
          if "  Widget _buildPremiumHero(" not in s:
              s = s.replace(marker, '\n'.join(extracted[n] for n in premium_names) + '\n\n' + marker, 1)

          # Remove Prayer Adjustments from the UI completely.
          s = re.sub(r"(?ms)\s*_tile\(\s*context,\s*Icons\.tune_rounded,\s*t\(lang, 'সালাতের সময় সমন্বয়', 'Prayer Adjustments'\),.*?\n\s*\),", '', s, count=1)

          # Ensure one working localized 12/24-hour selector exists.
          if "t(lang, 'সময় ফরম্যাট', 'Time Format')" not in s:
              anchor = "              _switchTile(\n                context,\n                Icons.timer_outlined,"
              tile = """              _tile(
                context,
                Icons.access_time_rounded,
                t(lang, 'সময় ফরম্যাট', 'Time Format'),
                s.is24Hour
                    ? t(lang, '২৪ ঘণ্টা', '24-hour')
                    : t(lang, '১২ ঘণ্টা', '12-hour'),
                () async {
                  await _showChoiceSheet(
                    context,
                    t(lang, 'সময় ফরম্যাট', 'Time Format'),
                    const ['12', '24'],
                    s.setTimeFormat,
                    selectedValue: s.timeFormat,
                  );
                },
              ),
              _divider(),
"""
              if anchor not in s:
                  raise SystemExit('Show Seconds anchor not found')
              s = s.replace(anchor, tile + anchor, 1)

          # Keep Jamaat on this single Settings screen instead of opening another Settings screen.
          jamaat = re.compile(r"(?ms)\s*_tile\(\s*context,\s*Icons\.groups_rounded,\s*t\(lang, 'জামাতের সময়', 'Jamaat Times'\).*?\n\s*\),")
          if jamaat.search(s):
              replacement = """              _jamaatTile(context, s, 'Fajr', t(lang, 'ফজর', 'Fajr'), s.fajrJamaat),
              _divider(),
              _jamaatTile(context, s, 'Dhuhr', t(lang, 'যোহর / জুমু\\'আ', 'Dhuhr / Jumu\\'ah'), s.dhuhrJamaat),
              _divider(),
              _jamaatTile(context, s, 'Asr', t(lang, 'আসর', 'Asr'), s.asrJamaat),
              _divider(),
              _jamaatTile(context, s, 'Maghrib', t(lang, 'মাগরিব', 'Maghrib'), s.maghribJamaat),
              _divider(),
              _jamaatTile(context, s, 'Isha', t(lang, 'ইশা', 'Isha'), s.ishaJamaat),"""
              s = jamaat.sub(replacement, s, count=1)
          s = s.replace("import 'prayer/jamaat_settings_screen.dart';\n", '', 1)

          # Add localized Jamaat editor helpers.
          if "  Widget _jamaatTile(" not in s:
              helper = r'''  Widget _jamaatTile(BuildContext context, SettingsProvider settings, String prayer, String title, String value) {
    return _tile(
      context,
      Icons.groups_outlined,
      title,
      value,
      () => _showJamaatTimeDialog(context, settings, prayer, title),
    );
  }

  Future<void> _showJamaatTimeDialog(BuildContext context, SettingsProvider settings, String prayer, String title) async {
    final controller = TextEditingController(text: settings.getJamaat(prayer));
    String? error;
    await showDialog<void>(
      context: context,
      builder: (dialogContext) => StatefulBuilder(
        builder: (dialogContext, setDialogState) => AlertDialog(
          title: Text('$title ${t(settings.languageCode, 'জামাতের সময়', 'Jamaat Time')}'),
          content: TextField(
            controller: controller,
            keyboardType: TextInputType.datetime,
            decoration: InputDecoration(
              labelText: t(settings.languageCode, 'সময়', 'Time'),
              hintText: settings.is24Hour ? '17:00' : '5:00 PM',
              errorText: error,
            ),
          ),
          actions: [
            TextButton(
              onPressed: () => Navigator.of(dialogContext).pop(),
              child: Text(t(settings.languageCode, 'বাতিল', 'Cancel')),
            ),
            FilledButton(
              onPressed: () async {
                final ok = await settings.setJamaatTime(prayer, controller.text);
                if (ok) {
                  if (dialogContext.mounted) Navigator.of(dialogContext).pop();
                } else {
                  setDialogState(() => error = t(settings.languageCode, 'সঠিক সময় দিন', 'Enter a valid time'));
                }
              },
              child: Text(t(settings.languageCode, 'সংরক্ষণ', 'Save')),
            ),
          ],
        ),
      ),
    );
    controller.dispose();
  }

'''
              s = s.replace(marker, helper + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

          dart format lib/screens/canonical_settings_screen.dart
          flutter pub get
          flutter analyze lib/screens/canonical_settings_screen.dart
          git diff --check

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/canonical_settings_screen.dart
          git diff --cached --quiet && { echo 'No Settings changes produced'; exit 1; }
          git commit -m 'Fix single canonical Settings screen'
          git rm .github/workflows/fix-settings-single.yml
          git commit -m 'Remove one-time Settings repair workflow'
          git push origin HEAD:main
