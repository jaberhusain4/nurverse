name: Fix time format consistency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch settings time format
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          util = Path('lib/utils/time_format_utils.dart')
          util.parent.mkdir(parents=True, exist_ok=True)
          util.write_text(r'''class TimeFormatUtils {
            const TimeFormatUtils._();

            static String formatStatic(String value, bool is24Hour) {
              final text = value.trim();
              if (text.isEmpty || text == '--:--') return text;
              final match = RegExp(r'^(\\d{1,2}):(\\d{2})(?::\\d{2})?\\s*(AM|PM)?$', caseSensitive: false).firstMatch(text);
              if (match == null) return text;
              var hour = int.tryParse(match.group(1)!) ?? -1;
              final minute = int.tryParse(match.group(2)!) ?? -1;
              if (hour < 0 || minute < 0 || minute > 59) return text;
              final period = match.group(3)?.toUpperCase();
              if (period != null) {
                if (hour < 1 || hour > 12) return text;
                if (period == 'PM' && hour != 12) hour += 12;
                if (period == 'AM' && hour == 12) hour = 0;
              } else if (hour > 23) {
                return text;
              }
              if (is24Hour) return '${hour.toString().padLeft(2, '0')}:${minute.toString().padLeft(2, '0')}';
              final h12 = hour % 12 == 0 ? 12 : hour % 12;
              final ampm = hour < 12 ? 'AM' : 'PM';
              return '$h12:${minute.toString().padLeft(2, '0')} $ampm';
            }
          }
          ''', encoding='utf-8')

          p = Path('lib/screens/settings/settings_screen.dart')
          s = p.read_text(encoding='utf-8')
          if "../../utils/time_format_utils.dart" not in s:
              s = s.replace("import '../../theme/app_theme.dart';", "import '../../theme/app_theme.dart';\nimport '../../utils/time_format_utils.dart';")

          old = """    final theme = Theme.of(context);\n    final primary = theme.colorScheme.primary;\n\n    return Material(\n      color: Colors.transparent,\n      child: InkWell(\n        onTap: () => _showJamaatTimeDialog("""
          new = """    final theme = Theme.of(context);\n    final primary = theme.colorScheme.primary;\n    final settings = context.watch<SettingsProvider>();\n    final displayValue = TimeFormatUtils.formatStatic(value, settings.is24Hour);\n\n    return Material(\n      color: Colors.transparent,\n      child: InkWell(\n        onTap: () => _showJamaatTimeDialog("""
          if old not in s:
              raise SystemExit('settings helper anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace("                  value,\n                  textAlign: TextAlign.center,", "                  displayValue,\n                  textAlign: TextAlign.center,", 1)

          marker = """              _buildSettingTile(\n                context,\n                icon: Icons.timer_outlined,\n                title: 'ঘড়িতে সেকেন্ড দেখান',"""
          insert = """              _buildSettingTile(\n                context,\n                icon: Icons.access_time_rounded,\n                title: 'সময় ফরম্যাট',\n                subtitle: settings.is24Hour ? '24 ঘণ্টা' : '12 ঘণ্টা',\n                onTap: () => _showTimeFormatDialog(context),\n              ),\n              _buildDivider(context),\n              _buildSettingTile(\n                context,\n                icon: Icons.timer_outlined,\n                title: 'ঘড়িতে সেকেন্ড দেখান',"""
          if marker not in s:
              raise SystemExit('date/time anchor not found')
          s = s.replace(marker, insert, 1)

          method_marker = """  Widget _buildSectionLabel(BuildContext context, String title, IconData icon) {"""
          method = r'''  Future<void> _showTimeFormatDialog(BuildContext context) async {
            final settings = context.read<SettingsProvider>();
            await showDialog<void>(
              context: context,
              builder: (dialogContext) {
                return AlertDialog(
                  title: const Text('সময় ফরম্যাট'),
                  content: RadioGroup<String>(
                    groupValue: settings.timeFormat,
                    onChanged: (value) {
                      if (value == null) return;
                      settings.setTimeFormat(value);
                      Navigator.of(dialogContext).pop();
                    },
                    child: const Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        RadioListTile<String>(value: '12', title: Text('12 ঘণ্টা (5:30 PM)')),
                        RadioListTile<String>(value: '24', title: Text('24 ঘণ্টা (17:30)')),
                      ],
                    ),
                  ),
                );
              },
            );
          }

'''
          if method_marker not in s:
              raise SystemExit('section label anchor not found')
          s = s.replace(method_marker, method + method_marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/utils/time_format_utils.dart lib/screens/settings/settings_screen.dart .github/workflows/fix-time-format.yml
          git commit -m "Fix Settings time format consistency"
          git push

# Trigger the temporary patch workflow.
