name: Fix Ruqyah Waqf Font

on:
  push:
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[waqf-font-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundled Arabic marker font
        run: |
          mkdir -p assets/fonts
          curl -L "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf" -o assets/fonts/NotoNaskhArabic-Regular.ttf

      - name: Register font and fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pub = Path('pubspec.yaml')
          s = pub.read_text(encoding='utf-8')
          anchor = "    - family: IndoPakQuran\n      fonts:\n        - asset: assets/fonts/IndoPakQuran.ttf\n"
          addition = anchor + "    - family: NotoNaskhArabic\n      fonts:\n        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf\n"
          if "family: NotoNaskhArabic" not in s:
              if anchor not in s:
                  raise SystemExit('pubspec font anchor not found')
              s = s.replace(anchor, addition, 1)
              pub.write_text(s, encoding='utf-8')

          theme = Path('lib/theme/app_theme.dart')
          t = theme.read_text(encoding='utf-8')
          old = "fontFamilyFallback: const [\n        'Noto Naskh Arabic',\n        'Noto Sans Arabic',\n        'serif',\n      ],"
          new = "fontFamilyFallback: const [\n        'NotoNaskhArabic',\n        'Noto Naskh Arabic',\n        'Noto Sans Arabic',\n        'serif',\n      ],"
          if old not in t:
              raise SystemExit('theme fallback block not found')
          t = t.replace(old, new, 1)
          theme.write_text(t, encoding='utf-8')
          PY

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/theme/app_theme.dart assets/fonts/NotoNaskhArabic-Regular.ttf
          git commit -m "fix: bundle Arabic waqf glyph font [waqf-font-fix]"
          git push
          rm -f .github/workflows/fix_ruqyah_waqf_font.yml
          git add .github/workflows/fix_ruqyah_waqf_font.yml
          git commit -m "chore: remove waqf font fix workflow [waqf-font-fix]"
          git push
