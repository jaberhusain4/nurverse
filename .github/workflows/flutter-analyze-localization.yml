name: Flutter analyze localization

on:
  pull_request:
    branches: [fix/prayer-completion-tracker]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        run: |
          flutter --version
          flutter pub get
          flutter analyze --no-fatal-warnings
