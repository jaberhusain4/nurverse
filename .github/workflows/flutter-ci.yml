name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.dart')"
          if [ -n "$files" ]; then
            dart format --output=none --set-exit-if-changed $files
          else
            echo "No Dart files changed in this commit; skipping format check."
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build universal debug APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nurverse-debug-universal-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build universal release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nurverse-release-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
