name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.dart')"
          if [ -n "$files" ]; then
            dart format --output=none --set-exit-if-changed $files
          else
            echo "No Dart files changed in this commit; skipping format check."
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --debug
