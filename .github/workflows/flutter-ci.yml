name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --debug

  apply-final-time-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/controllers/prayer_controller.dart')
          s = p.read_text(encoding='utf-8')
          old = "  String _formatTime(DateTime value) => DateFormat('hh:mm').format(value);"
          if old in s:
              s = s.replace(old, "  String _formatTime(DateTime value) => DateFormat('h:mm a').format(value);", 1)
          elif "String _formatTime(DateTime value) => DateFormat('h:mm a').format(value);" not in s:
              raise SystemExit('controller static formatter not found')
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/prayer_screen_v2.dart')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(
              r"settings\.showSeconds\s*\?\s*c\.timeRemainingForNextPrayer\s*:\s*_withoutSeconds\(c\.timeRemainingForNextPrayer\)",
              'c.timeRemainingForNextPrayer', s, count=1)
          if n != 1 and 'c.timeRemainingForNextPrayer,' not in s:
              raise SystemExit('prayer countdown expression not found')

          s, n = re.subn(
              r"  String _displayTime\(SettingsProvider settings, String value\) \{.*?\n  \}\n\n  String _withoutSeconds\(String value\) \{.*?\n  \}\n",
              r'''  String _displayTime(SettingsProvider settings, String value) {
    final trimmed = value.trim();
    if (trimmed.isEmpty || trimmed == '--:--') return trimmed;
    final match = RegExp(r'^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$').firstMatch(trimmed);
    if (match == null) return trimmed;

    var hour = int.parse(match.group(1)!);
    final minute = match.group(2)!;
    final period = match.group(3)?.toUpperCase();
    if (period != null && settings.is24Hour) {
      hour = period == 'AM' ? (hour == 12 ? 0 : hour) : (hour == 12 ? 12 : hour + 12);
      return '${hour.toString().padLeft(2, '0')}:$minute';
    }
    if (settings.is24Hour) return '${hour.toString().padLeft(2, '0')}:$minute';
    if (period != null) return '$hour:$minute $period';
    final displayHour = hour % 12 == 0 ? 12 : hour % 12;
    final displayPeriod = hour >= 12 ? 'PM' : 'AM';
    return '$displayHour:$minute $displayPeriod';
  }

''', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('prayer static formatter function not found')
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/simple_home_screen_v10.dart')
          s = p.read_text(encoding='utf-8')
          if "import 'package:intl/intl.dart';" not in s:
              anchor = "import 'package:hijri/hijri_calendar.dart';\n"
              if anchor not in s:
                  raise SystemExit('home intl import anchor not found')
              s = s.replace(anchor, anchor + "import 'package:intl/intl.dart';\n", 1)

          anchor = '  String _clock(bool is24Hour) {'
          if anchor not in s:
              raise SystemExit('home clock anchor not found')
          helper = r'''  String _staticTime(String value, bool is24Hour) {
    final trimmed = value.trim();
    if (trimmed.isEmpty || trimmed == '--:--') return trimmed;
    final match = RegExp(r'^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$').firstMatch(trimmed);
    if (match == null) return trimmed;
    final period = match.group(3)?.toUpperCase();
    if (period != null) {
      final parsed = DateFormat('h:mm a', 'en').parse(trimmed);
      return is24Hour ? DateFormat('HH:mm').format(parsed) : DateFormat('h:mm a').format(parsed);
    }
    final hour = int.parse(match.group(1)!);
    final minute = match.group(2)!;
    if (is24Hour) return '${hour.toString().padLeft(2, '0')}:$minute';
    final displayHour = hour % 12 == 0 ? 12 : hour % 12;
    final displayPeriod = hour >= 12 ? 'PM' : 'AM';
    return '$displayHour:$minute $displayPeriod';
  }

'''
          s = s.replace(anchor, helper + anchor, 1)

          replacements = [
              ('nextPrayerTime: controller.nextPrayerTime,', 'nextPrayerTime: _staticTime(controller.nextPrayerTime, settings.is24Hour),'),
              ('sunrise: controller.sunriseTime,', 'sunrise: _staticTime(controller.sunriseTime, settings.is24Hour),'),
              ('sunset: controller.sunsetTime,', 'sunset: _staticTime(controller.sunsetTime, settings.is24Hour),'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'home replacement not found: {old}')
              s = s.replace(old, new, 1)

          old = '_V10PrayerTimeline(prayers: prayers, languageCode: languageCode),'
          new = """_V10PrayerTimeline(
                prayers: prayers.map((prayer) => {
                  ...prayer,
                  'start': _staticTime(prayer['start']?.toString() ?? '—', settings.is24Hour),
                  'end': _staticTime(prayer['end']?.toString() ?? '—', settings.is24Hour),
                }).toList(),
                languageCode: languageCode,
              ),"""
          if old not in s:
              raise SystemExit('home prayer timeline call not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/controllers/prayer_controller.dart lib/screens/prayer_screen_v2.dart lib/screens/simple_home_screen_v10.dart
          git commit -m 'Apply 12/24-hour static time formatting' || exit 0
          git push origin main
