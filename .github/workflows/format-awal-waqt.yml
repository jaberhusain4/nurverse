name: Format Awal Waqt fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Format changed file
        run: dart format lib/widgets/common/current_prayer_premium_card.dart
      - name: Commit formatted source and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/common/current_prayer_premium_card.dart .github/workflows/format-awal-waqt.yml
          git diff --cached --quiet && exit 0
          git commit -m 'style: format Awal Waqt card'
          git push
