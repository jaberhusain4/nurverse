name: Temporary Dart Format Diagnostic
on:
  push:
    branches:
      - fix/future-prohibited-makruh-labels
permissions:
  contents: read
jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - name: Install dependencies and print formatter diff
        run: |
          flutter pub get
          dart format lib/controllers/prayer_controller.dart
          git diff -- lib/controllers/prayer_controller.dart
