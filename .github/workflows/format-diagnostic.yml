name: Temporary Dart Format Diagnostic
on:
  workflow_dispatch:
jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - run: flutter pub get
      - name: Show formatter diff
        run: |
          dart format lib/controllers/prayer_controller.dart
          git diff -- lib/controllers/prayer_controller.dart
