name: Format prayer-time changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/controllers/prayer_controller.dart lib/services/location_service.dart
      - run: |
          if git diff --quiet -- lib/controllers/prayer_controller.dart lib/services/location_service.dart; then
            echo "Already formatted with Dart 3.44.8."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/prayer_controller.dart lib/services/location_service.dart
          git commit -m "style: format prayer-time changes with project Dart"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
