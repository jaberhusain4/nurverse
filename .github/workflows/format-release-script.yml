name: Format release verification script

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: dart format tool/check_localization_hardcodes.dart
      - run: |
          if git diff --quiet -- tool/check_localization_hardcodes.dart; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/check_localization_hardcodes.dart
          git commit -m "style: format localization guard"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
