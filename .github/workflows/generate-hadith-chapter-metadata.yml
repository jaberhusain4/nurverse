name: Generate Hadith chapter metadata

on:
  push:
    branches:
      - fix/prayer-completion-tracker

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate canonical metadata and wire HadithService
        env:
          SOURCE_BASE: https://raw.githubusercontent.com/HsnSaboor/hadith-api-toon/main/editions
        run: python tool/generate_hadith_chapter_metadata.py

      - name: Format and verify
        run: |
          git diff --check
          dart format lib/services/generated_hadith_chapter_metadata.dart lib/services/hadith_service.dart

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/generated_hadith_chapter_metadata.dart lib/services/hadith_service.dart
          git diff --cached --quiet || git commit -m "fix(hadith): use canonical multilingual chapter titles"
          git push
