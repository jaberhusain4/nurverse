name: Generate Hadith chapter metadata

on:
  push:
    branches:
      - fix/prayer-completion-tracker

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate canonical multilingual chapter metadata
        env:
          SOURCE_BASE: https://raw.githubusercontent.com/HsnSaboor/hadith-api-toon/main/editions
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          books = [
              'bukhari',
              'muslim',
              'abudawud',
              'tirmidhi',
              'nasai',
              'ibnmajah',
              'malik',
          ]

          base = os.environ['SOURCE_BASE']
          out = {}

          def parse_info(book):
              url = f'{base}/{book}/info.toon'
              with urllib.request.urlopen(url, timeout=60) as response:
                  text = response.read().decode('utf-8')

              match = re.search(
                  r'sections\[(\d+)\]\{([^}]+)\}:\s*\n(.*)',
                  text,
                  re.DOTALL,
              )
              if not match:
                  raise RuntimeError(f'No sections table found for {book}')

              columns = [x.strip() for x in match.group(2).split(',')]
              rows = []
              for line in match.group(3).splitlines():
                  if not line.strip().startswith('"'):
                      if rows:
                          break
                      continue
                  parsed = next(csv.reader([line]))
                  if len(parsed) < len(columns):
                      parsed += [''] * (len(columns) - len(parsed))
                  rows.append(dict(zip(columns, parsed)))

              catalog = {}
              for row in rows:
                  sid = row.get('id', '').strip()
                  if not sid.isdigit():
                      continue
                  ar = row.get('name_ar', '').strip()
                  bn = row.get('name_bn', '').strip()
                  en = row.get('name_en', '').strip()
                  if not ar or not bn or not en:
                      raise RuntimeError(
                          f'Missing multilingual title: {book} section {sid}: '
                          f'ar={bool(ar)} bn={bool(bn)} en={bool(en)}'
                      )
                  catalog[sid] = {
                      'ar': ar,
                      'bn': bn,
                      'en': en,
                  }

              if not catalog:
                  raise RuntimeError(f'No chapter titles extracted for {book}')
              return catalog

          for book in books:
              out[book] = parse_info(book)

          dart = '''// GENERATED FILE. DO NOT EDIT BY HAND.\n// Source: HsnSaboor/hadith-api-toon multilingual section metadata.\n\nclass GeneratedHadithChapterMetadata {\n  const GeneratedHadithChapterMetadata._();\n\n  static const Map<String, Map<int, GeneratedHadithChapterTitle>> books = {\n'''
          for book in books:
              dart += f"    '{book}': {{\n"
              for sid, title in out[book].items():
                  dart += (
                      f"      {int(sid)}: GeneratedHadithChapterTitle("
                      f"ar: {json.dumps(title['ar'], ensure_ascii=False)}, "
                      f"bn: {json.dumps(title['bn'], ensure_ascii=False)}, "
                      f"en: {json.dumps(title['en'], ensure_ascii=False)}),\n"
                  )
              dart += "    },\n"
          dart += '''  };\n}\n\nclass GeneratedHadithChapterTitle {\n  final String ar;\n  final String bn;\n  final String en;\n\n  const GeneratedHadithChapterTitle({\n    required this.ar,\n    required this.bn,\n    required this.en,\n  });\n}\n'''

          Path('lib/services/generated_hadith_chapter_metadata.dart').write_text(dart, encoding='utf-8')
          print('Generated canonical metadata:', {k: len(v) for k, v in out.items()})
          PY

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/generated_hadith_chapter_metadata.dart
          git diff --cached --quiet || git commit -m "build(hadith): generate canonical multilingual chapter metadata"
          git push
