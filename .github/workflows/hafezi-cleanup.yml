name: Hafezi cleanup
on:
  pull_request:
    branches: [fix/prayer-completion-tracker]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Clean Hafezi localization patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/screens/quran/hafezi_quran_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "import '../../localization/app_localizations.dart';\nimport '../../localization/app_localizations.dart';\n",
              "import '../../localization/app_localizations.dart';\n",
              1,
          )
          s = s.replace(
              "    final l10n = AppLocalizations.of(context);\n    final l10n = AppLocalizations.of(context);\n",
              "    final l10n = AppLocalizations.of(context);\n",
              1,
          )
          marker = "    final secondary = theme.colorScheme.onSurface.withValues(alpha: .62);\n"
          if marker in s and "    final l10n = AppLocalizations.of(context);\n" not in s[s.find(marker):s.find(marker)+160]:
              s = s.replace(marker, marker + "    final l10n = AppLocalizations.of(context);\n", 1)
          s = s.replace("decoration: const InputDecoration(", "decoration: InputDecoration(")
          s = s.replace("            tabs: const [", "            tabs: [")
          old1 = """                        Text(
                          l10n.isArabic ? 'الجزء ${juz.juz}' : l10n.tr(l10n.isArabic ? 'الجزء ${juz.juz}' : l10n.tr('পারা ${juz.juz}', 'Juz ${juz.juz}'), 'Juz ${juz.juz}'),
                          style: const TextStyle(fontWeight: FontWeight.w800),
                        ),"""
          new1 = """                        Text(
                          l10n.isArabic ? 'الجزء ${juz.juz}' : l10n.tr('পারা ${juz.juz}', 'Juz ${juz.juz}'),
                          style: const TextStyle(fontWeight: FontWeight.w800),
                        ),"""
          s = s.replace(old1, new1, 1)
          old2 = """                        Text(
                          l10n.isArabic ? '${juz.pageCount} صفحة' : l10n.tr(l10n.isArabic ? '${juz.pageCount} صفحة' : l10n.tr('${juz.pageCount} পৃষ্ঠা', '${juz.pageCount} pages'), '${juz.pageCount} pages'),
                          style: TextStyle(
                            color: primaryColor,
                            fontSize: 11,
                            fontWeight: FontWeight.w700,
                          ),
                        ),"""
          new2 = """                        Text(
                          l10n.isArabic ? '${juz.pageCount} صفحة' : l10n.tr('${juz.pageCount} পৃষ্ঠা', '${juz.pageCount} pages'),
                          style: TextStyle(
                            color: primaryColor,
                            fontSize: 11,
                            fontWeight: FontWeight.w700,
                          ),
                        ),"""
          s = s.replace(old2, new2, 1)
          s = s.replace("title: Text(\n                surah.englishName,", "title: Text(\n                l10n.isArabic ? surah.arabicName : surah.englishName,", 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit cleanup to PR head
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          git add lib/screens/quran/hafezi_quran_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: clean Hafezi localization patch"
          git push origin HEAD:${{ github.head_ref }}
