name: one-shot Arabic Settings localization
on:
  push:
    branches: [fix/prayer-completion-tracker]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Arabic Settings localization
        run: python .github/settings_arabic_fix.py
      - name: Commit and clean temporary fixer
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          git add lib/screens/settings_hub_screen_v4.dart
          git diff --cached --exit-code && echo "No Settings changes produced" && exit 0
          git rm .github/settings_arabic_fix.py .github/workflows/label_fix.yml
          git add lib/screens/settings_hub_screen_v4.dart
          git commit -m "fix: fully localize Arabic Settings UI"
          git push
