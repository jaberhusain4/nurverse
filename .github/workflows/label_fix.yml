name: trusted Arabic Settings cleanup
on:
  push:
    branches: [fix/prayer-completion-tracker]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cleanup Settings localization
        run: python .github/settings_arabic_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          git add lib/screens/settings_hub_screen_v4.dart
          git rm .github/settings_arabic_cleanup.py .github/workflows/label_fix.yml
          git commit -m "fix: finalize Arabic Settings localization"
          git push
