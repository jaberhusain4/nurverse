name: NurVerse localization audit

on:
  pull_request:
    branches: [fix/prayer-completion-tracker]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan Dart UI strings
        shell: python
        run: |
          import json, re
          from pathlib import Path

          root = Path('lib')
          hits = []
          for path in root.rglob('*.dart'):
              text = path.read_text(encoding='utf-8')
              if '/localization/' in str(path).replace('\\', '/'):
                  continue
              patterns = [
                  r"Text\(\s*'([^'\\n]{2,})'",
                  r'Text\(\s*"([^"\\n]{2,})"',
                  r"(?:isEnglish|isBangla)\s*\?\s*'([^']*)'\s*:\s*'([^']*)'",
                  r"languageCode\s*==\s*'en'\s*\?\s*'([^']*)'\s*:\s*'([^']*)'",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text):
                      value = match.group(0)
                      if any(x in value for x in ['Icons.', 'Duration(', 'Color(', 'TextStyle(']):
                          continue
                      hits.append({'file': str(path), 'match': value[:240]})

          report = root / 'localization_audit.json'
          report.write_text(json.dumps(hits, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Found {len(hits)} candidate UI string occurrences')
          for item in hits[:100]:
              print(item['file'], '::', item['match'])

      - name: Commit audit report to feature branch
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then exit 0; fi
          git add lib/localization_audit.json
          git commit -m "chore: add localization audit report"
          git push origin HEAD:fix/app-wide-localization
