name: Localization Guard

on:
  pull_request:
  push:
    branches:
      - fix/prayer-completion-tracker

jobs:
  localization-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart tool/check_localization_hardcodes.dart

  prayer-screen-layout-repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1

      - name: Patch current and adjacent prayer layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/localized_prayer_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_header = '''          Row(
            children: [
              _iconBox(primary, Icons.mosque_rounded, size: 42),
              const SizedBox(width: 10),
              Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      _label(context, 'বর্তমান ওয়াক্ত', 'Current prayer'),
                      style: TextStyle(
                        color: secondary,
                        fontSize: 11.5,
                        fontWeight: FontWeight.w600,
                      ),
                    ),
                    const SizedBox(height: 2),
                    Text(
                      l10n.prayerName(c.currentPrayer),
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(
                        fontSize: 20,
                        fontWeight: FontWeight.w800,
                      ),
                    ),
                  ],
                ),
              ),
              if (friday) _badge(primary, l10n.fridayLabel),
            ],
          ),'''
          new_header = '''          Row(
            crossAxisAlignment: CrossAxisAlignment.center,
            children: [
              _iconBox(primary, Icons.mosque_rounded, size: 42),
              const SizedBox(width: 10),
              Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      _label(context, 'বর্তমান ওয়াক্ত', 'Current prayer'),
                      style: TextStyle(
                        color: secondary,
                        fontSize: 11.5,
                        fontWeight: FontWeight.w600,
                      ),
                    ),
                    const SizedBox(height: 2),
                    Text(
                      l10n.prayerName(c.currentPrayer),
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(
                        fontSize: 20,
                        fontWeight: FontWeight.w800,
                      ),
                    ),
                  ],
                ),
              ),
              if (friday) ...[
                const SizedBox(width: 8),
                _badge(primary, l10n.fridayLabel),
              ],
              const SizedBox(width: 12),
              Column(
                crossAxisAlignment: CrossAxisAlignment.end,
                children: [
                  Text(
                    _label(context, 'সময় বাকি', 'Time left'),
                    style: TextStyle(
                      color: secondary,
                      fontSize: 11,
                      fontWeight: FontWeight.w600,
                    ),
                  ),
                  const SizedBox(height: 2),
                  Text(
                    settings.showSeconds
                        ? c.timeRemainingForNextPrayer
                        : _withoutSeconds(c.timeRemainingForNextPrayer),
                    textAlign: TextAlign.end,
                    style: TextStyle(
                      color: primary,
                      fontSize: 18,
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                ],
              ),
            ],
          ),'''
          if old_header not in text:
              raise SystemExit('Current prayer header block not found.')
          text = text.replace(old_header, new_header, 1)

          old_countdown = '''          Container(
            padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 9),
            decoration: BoxDecoration(
              color: primary.withValues(alpha: .06),
              borderRadius: BorderRadius.circular(13),
            ),
            child: Row(
              children: [
                Expanded(
                  flex: 4,
                  child: Row(
                    children: [
                      Icon(Icons.schedule_rounded, size: 18, color: primary),
                      const SizedBox(width: 7),
                      Expanded(
                        child: Text(
                          '${_label(context, 'পরবর্তী', 'Next')}: ${l10n.prayerName(c.nextPrayerName)}',
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: const TextStyle(
                            fontSize: 12.5,
                            fontWeight: FontWeight.w600,
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
                Expanded(
                  flex: 3,
                  child: Text(
                    settings.showSeconds ? c.timeRemainingForNextPrayer : _withoutSeconds(c.timeRemainingForNextPrayer),
                    textAlign: TextAlign.center,
                    style: TextStyle(
                      color: secondary,
                      fontSize: 11.5,
                      fontWeight: FontWeight.w700,
                    ),
                  ),
                ),
                Expanded(
                  flex: 3,
                  child: Text(
                    c.nextPrayerTime,
                    textAlign: TextAlign.end,
                    style: TextStyle(
                      color: primary,
                      fontSize: 13.5,
                      fontWeight: FontWeight.w800,
                    ),
                  ),
                ),
              ],
            ),
          ),'''
          if old_countdown not in text:
              raise SystemExit('Old countdown block not found.')
          text = text.replace(old_countdown, '''          const SizedBox(height: 12),
          _previousNextPrayerRow(context, c),''', 1)

          marker = '''  String _withoutSeconds(String value) {
    final match = RegExp(r'^(\\d{2}):(\\d{2})').firstMatch(value.trim());
    return match == null ? value : '${match.group(1)}:${match.group(2)}';
  }
'''
          helper = '''  Widget _previousNextPrayerRow(BuildContext context, PrayerController c) {
    final l10n = AppLocalizations.of(context);
    final primary = Theme.of(context).colorScheme.primary;
    final secondary = context.secondaryTextColor;
    final previousName = c.previousPrayer.trim().isEmpty
        ? '—'
        : l10n.prayerName(c.previousPrayer);
    final nextName = c.nextPrayerName.trim().isEmpty
        ? '—'
        : l10n.prayerName(c.nextPrayerName);

    return Row(
      children: [
        Expanded(
          child: _adjacentPrayerCard(
            context,
            icon: Icons.history_rounded,
            title: _label(context, 'পূর্ববর্তী', 'Previous'),
            name: previousName,
            time: c.previousPrayerTime.trim().isEmpty ? '--:--' : c.previousPrayerTime,
            primary: primary,
            secondary: secondary,
          ),
        ),
        const SizedBox(width: 10),
        Expanded(
          child: _adjacentPrayerCard(
            context,
            icon: Icons.schedule_rounded,
            title: _label(context, 'পরবর্তী', 'Next'),
            name: nextName,
            time: c.nextPrayerTime,
            primary: primary,
            secondary: secondary,
          ),
        ),
      ],
    );
  }

  Widget _adjacentPrayerCard(
    BuildContext context, {
    required IconData icon,
    required String title,
    required String name,
    required String time,
    required Color primary,
    required Color secondary,
  }) {
    return Container(
      padding: const EdgeInsets.fromLTRB(11, 10, 11, 10),
      decoration: BoxDecoration(
        color: primary.withValues(alpha: .045),
        borderRadius: BorderRadius.circular(14),
        border: Border.all(color: primary.withValues(alpha: .10)),
      ),
      child: Row(
        children: [
          Icon(icon, color: primary, size: 18),
          const SizedBox(width: 7),
          Expanded(
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text(
                  title,
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: TextStyle(
                    color: secondary,
                    fontSize: 10.5,
                    fontWeight: FontWeight.w600,
                  ),
                ),
                const SizedBox(height: 2),
                Text(
                  name,
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: const TextStyle(
                    fontSize: 13,
                    fontWeight: FontWeight.w800,
                  ),
                ),
              ],
            ),
          ),
          const SizedBox(width: 6),
          Text(
            time,
            textAlign: TextAlign.end,
            style: TextStyle(
              color: primary,
              fontSize: 12.5,
              fontWeight: FontWeight.w800,
            ),
          ),
        ],
      ),
    );
  }

  String _withoutSeconds(String value) {
    final match = RegExp(r'^(\\d{2}):(\\d{2})').firstMatch(value.trim());
    return match == null ? value : '${match.group(1)}:${match.group(2)}';
  }
'''
          if marker not in text:
              raise SystemExit('withoutSeconds marker not found.')
          text = text.replace(marker, helper, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit prayer screen repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/localized_prayer_screen.dart
          git commit -m 'feat(prayer): improve current and adjacent prayer layout'
          git push origin HEAD:fix/prayer-completion-tracker
          if [ -f .github/workflows/upgrade-prayer-screen-layout.yml ]; then
            git rm .github/workflows/upgrade-prayer-screen-layout.yml
            git commit -m 'chore: remove one-time prayer layout workflow'
            git push origin HEAD:fix/prayer-completion-tracker
          fi
