name: Localization Guard

on:
  pull_request:
  push:
    branches:
      - fix/prayer-completion-tracker

jobs:
  localization-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart tool/check_localization_hardcodes.dart

  prayer-screen-layout-repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1
      - name: Patch current and adjacent prayer layout
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/localized_prayer_screen.dart')
          text = path.read_text(encoding='utf-8')
          old_header = '''          Row(\n            children: [\n              _iconBox(primary, Icons.mosque_rounded, size: 42),\n              const SizedBox(width: 10),\n              Expanded(\n                child: Column(\n                  crossAxisAlignment: CrossAxisAlignment.start,\n                  children: [\n                    Text(\n                      _label(context, 'বর্তমান ওয়াক্ত', 'Current prayer'),\n                      style: TextStyle(\n                        color: secondary,\n                        fontSize: 11.5,\n                        fontWeight: FontWeight.w600,\n                      ),\n                    ),\n                    const SizedBox(height: 2),\n                    Text(\n                      l10n.prayerName(c.currentPrayer),\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: const TextStyle(\n                        fontSize: 20,\n                        fontWeight: FontWeight.w800,\n                      ),\n                    ),\n                  ],\n                ),\n              ),\n              if (friday) _badge(primary, l10n.fridayLabel),\n            ],\n          ),'''
          new_header = '''          Row(\n            crossAxisAlignment: CrossAxisAlignment.center,\n            children: [\n              _iconBox(primary, Icons.mosque_rounded, size: 42),\n              const SizedBox(width: 10),\n              Expanded(\n                child: Column(\n                  crossAxisAlignment: CrossAxisAlignment.start,\n                  children: [\n                    Text(\n                      _label(context, 'বর্তমান ওয়াক্ত', 'Current prayer'),\n                      style: TextStyle(\n                        color: secondary,\n                        fontSize: 11.5,\n                        fontWeight: FontWeight.w600,\n                      ),\n                    ),\n                    const SizedBox(height: 2),\n                    Text(\n                      l10n.prayerName(c.currentPrayer),\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: const TextStyle(\n                        fontSize: 20,\n                        fontWeight: FontWeight.w800,\n                      ),\n                    ),\n                  ],\n                ),\n              ),\n              if (friday) ...[\n                const SizedBox(width: 8),\n                _badge(primary, l10n.fridayLabel),\n              ],\n              const SizedBox(width: 12),\n              Column(\n                crossAxisAlignment: CrossAxisAlignment.end,\n                children: [\n                  Text(\n                    _label(context, 'সময় বাকি', 'Time left'),\n                    style: TextStyle(\n                      color: secondary,\n                      fontSize: 11,\n                      fontWeight: FontWeight.w600,\n                    ),\n                  ),\n                  const SizedBox(height: 2),\n                  Text(\n                    settings.showSeconds\n                        ? c.timeRemainingForNextPrayer\n                        : _withoutSeconds(c.timeRemainingForNextPrayer),\n                    textAlign: TextAlign.end,\n                    style: TextStyle(\n                      color: primary,\n                      fontSize: 18,\n                      fontWeight: FontWeight.w900,\n                    ),\n                  ),\n                ],\n              ),\n            ],\n          ),'''
          if old_header not in text:
              raise SystemExit('Current prayer header block not found.')
          text = text.replace(old_header, new_header, 1)
          old_countdown = '''          Container(\n            padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 9),\n            decoration: BoxDecoration(\n              color: primary.withValues(alpha: .06),\n              borderRadius: BorderRadius.circular(13),\n            ),\n            child: Row(\n              children: [\n                Expanded(\n                  flex: 4,\n                  child: Row(\n                    children: [\n                      Icon(Icons.schedule_rounded, size: 18, color: primary),\n                      const SizedBox(width: 7),\n                      Expanded(\n                        child: Text(\n                          '${_label(context, 'পরবর্তী', 'Next')}: ${l10n.prayerName(c.nextPrayerName)}',\n                          maxLines: 1,\n                          overflow: TextOverflow.ellipsis,\n                          style: const TextStyle(\n                            fontSize: 12.5,\n                            fontWeight: FontWeight.w600,\n                          ),\n                        ),\n                      ),\n                    ],\n                  ),\n                ),\n                Expanded(\n                  flex: 3,\n                  child: Text(\n                    settings.showSeconds ? c.timeRemainingForNextPrayer : _withoutSeconds(c.timeRemainingForNextPrayer),\n                    textAlign: TextAlign.center,\n                    style: TextStyle(\n                      color: secondary,\n                      fontSize: 11.5,\n                      fontWeight: FontWeight.w700,\n                    ),\n                  ),\n                ),\n                Expanded(\n                  flex: 3,\n                  child: Text(\n                    c.nextPrayerTime,\n                    textAlign: TextAlign.end,\n                    style: TextStyle(\n                      color: primary,\n                      fontSize: 13.5,\n                      fontWeight: FontWeight.w800,\n                    ),\n                  ),\n                ),\n              ],\n            ),\n          ),'''
          if old_countdown not in text:
              raise SystemExit('Old countdown block not found.')
          text = text.replace(old_countdown, '''          const SizedBox(height: 12),\n          _previousNextPrayerRow(context, c),''', 1)
          marker = '''  String _withoutSeconds(String value) {\n    final match = RegExp(r'^(\\d{2}):(\\d{2})').firstMatch(value.trim());\n    return match == null ? value : '${match.group(1)}:${match.group(2)}';\n  }\n'''
          helper = '''  Widget _previousNextPrayerRow(BuildContext context, PrayerController c) {\n    final l10n = AppLocalizations.of(context);\n    final primary = Theme.of(context).colorScheme.primary;\n    final secondary = context.secondaryTextColor;\n    final previousName = c.previousPrayer.trim().isEmpty ? '—' : l10n.prayerName(c.previousPrayer);\n    final nextName = c.nextPrayerName.trim().isEmpty ? '—' : l10n.prayerName(c.nextPrayerName);\n    return Row(\n      children: [\n        Expanded(child: _adjacentPrayerCard(context, icon: Icons.history_rounded, title: _label(context, 'পূর্ববর্তী', 'Previous'), name: previousName, time: c.previousPrayerTime.trim().isEmpty ? '--:--' : c.previousPrayerTime, primary: primary, secondary: secondary)),\n        const SizedBox(width: 10),\n        Expanded(child: _adjacentPrayerCard(context, icon: Icons.schedule_rounded, title: _label(context, 'পরবর্তী', 'Next'), name: nextName, time: c.nextPrayerTime, primary: primary, secondary: secondary)),\n      ],\n    );\n  }\n\n  Widget _adjacentPrayerCard(BuildContext context, {required IconData icon, required String title, required String name, required String time, required Color primary, required Color secondary}) {\n    return Container(\n      padding: const EdgeInsets.fromLTRB(11, 10, 11, 10),\n      decoration: BoxDecoration(color: primary.withValues(alpha: .045), borderRadius: BorderRadius.circular(14), border: Border.all(color: primary.withValues(alpha: .10))),\n      child: Row(children: [\n        Icon(icon, color: primary, size: 18),\n        const SizedBox(width: 7),\n        Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n          Text(title, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(color: secondary, fontSize: 10.5, fontWeight: FontWeight.w600)),\n          const SizedBox(height: 2),\n          Text(name, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 13, fontWeight: FontWeight.w800)),\n        ])),\n        const SizedBox(width: 6),\n        Text(time, textAlign: TextAlign.end, style: TextStyle(color: primary, fontSize: 12.5, fontWeight: FontWeight.w800)),\n      ]),\n    );\n  }\n\n  String _withoutSeconds(String value) {\n    final match = RegExp(r'^(\\d{2}):(\\d{2})').firstMatch(value.trim());\n    return match == null ? value : '${match.group(1)}:${match.group(2)}';\n  }\n'''
          if marker not in text:
              raise SystemExit('withoutSeconds marker not found.')
          text = text.replace(marker, helper, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/localized_prayer_screen.dart
          git commit -m 'feat(prayer): improve current and adjacent prayer layout' || true
          git push origin HEAD:fix/prayer-completion-tracker
          if [ -f .github/workflows/upgrade-prayer-screen-layout.yml ]; then
            git rm .github/workflows/upgrade-prayer-screen-layout.yml
            git commit -m 'chore: remove one-time prayer layout workflow'
            git push origin HEAD:fix/prayer-completion-tracker
          fi

# trigger