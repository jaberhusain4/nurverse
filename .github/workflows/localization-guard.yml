name: Localization Guard

on:
  pull_request:
  push:
    branches:
      - fix/prayer-completion-tracker

jobs:
  localization-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart tool/check_localization_hardcodes.dart

      - name: Apply Prayer Screen UI update
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/screens/prayer_screen_v2.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import '../providers/settings_provider.dart';\n"
          if import_line not in text:
              marker = "import '../localization/app_localizations.dart';\n"
              if marker not in text:
                  raise SystemExit('Could not find localization import marker')
              text = text.replace(marker, marker + import_line, 1)

          helper = '''\n  String _countdownText(BuildContext context, PrayerController c) {\n    final raw = c.timeRemainingForNextPrayer.trim();\n    if (raw.isEmpty) return '--:--';\n    final parts = raw.split(':');\n    final settings = context.watch<SettingsProvider>();\n    if (settings.showSeconds || parts.length < 3) return raw;\n    return '${parts[0].padLeft(2, '0')}:${parts[1].padLeft(2, '0')}';\n  }\n'''
          if 'String _countdownText(BuildContext context, PrayerController c)' not in text:
              marker = "  @override\n  Widget build(BuildContext context) {"
              if marker not in text:
                  raise SystemExit('Could not find build marker')
              text = text.replace(marker, helper + "\n" + marker, 1)

          start = text.find('  Widget _currentCard(BuildContext context, PrayerController c, bool friday) {')
          end = text.find('  Widget _importantTimes(BuildContext context, PrayerController c) {', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate _currentCard boundaries')

          new_card = '''  Widget _currentCard(BuildContext context, PrayerController c, bool friday) {\n    final primary = Theme.of(context).colorScheme.primary;\n    final secondary = context.secondaryTextColor;\n    final settings = context.watch<SettingsProvider>();\n    final countdown = _countdownText(context, c);\n\n    Widget prayerSideCard(String title, String name, String time, IconData icon) {\n      final safeName = name.trim().isEmpty ? _label(context, 'নেই', 'None') : _prayerLabel(context, name);\n      final safeTime = time.trim().isEmpty ? '--:--' : time;\n      return Expanded(\n        child: Container(\n          padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 10),\n          decoration: BoxDecoration(\n            color: primary.withValues(alpha: .055),\n            borderRadius: BorderRadius.circular(15),\n            border: Border.all(color: primary.withValues(alpha: .06)),\n          ),\n          child: Row(\n            children: [\n              Icon(icon, size: 20, color: primary),\n              const SizedBox(width: 8),\n              Expanded(\n                child: Column(\n                  crossAxisAlignment: CrossAxisAlignment.start,\n                  children: [\n                    Text(\n                      title,\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: TextStyle(color: secondary, fontSize: 10.5, fontWeight: FontWeight.w600),\n                    ),\n                    const SizedBox(height: 2),\n                    Text(\n                      safeName,\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: const TextStyle(fontSize: 13.5, fontWeight: FontWeight.w800),\n                    ),\n                    const SizedBox(height: 2),\n                    Text(\n                      safeTime,\n                      style: TextStyle(color: primary, fontSize: 12, fontWeight: FontWeight.w800),\n                    ),\n                  ],\n                ),\n              ),\n            ],\n          ),\n        ),\n      );\n    }\n\n    return _card(\n      context,\n      radius: 21,\n      padding: const EdgeInsets.fromLTRB(15, 14, 15, 13),\n      child: Column(\n        children: [\n          Row(\n            crossAxisAlignment: CrossAxisAlignment.center,\n            children: [\n              Expanded(\n                child: Row(\n                  children: [\n                    _iconBox(primary, Icons.mosque_rounded, size: 42),\n                    const SizedBox(width: 10),\n                    Expanded(\n                      child: Column(\n                        crossAxisAlignment: CrossAxisAlignment.start,\n                        children: [\n                          Text(\n                            _label(context, 'বর্তমান ওয়াক্ত', 'Current prayer'),\n                            style: TextStyle(color: secondary, fontSize: 11.5, fontWeight: FontWeight.w600),\n                          ),\n                          const SizedBox(height: 2),\n                          Text(\n                            _prayerLabel(context, c.currentPrayer),\n                            maxLines: 1,\n                            overflow: TextOverflow.ellipsis,\n                            style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w800),\n                          ),\n                        ],\n                      ),\n                    ),\n                  ],\n                ),\n              ),\n              const SizedBox(width: 10),\n              Container(\n                constraints: const BoxConstraints(minWidth: 112),\n                padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 8),\n                decoration: BoxDecoration(\n                  color: primary.withValues(alpha: .08),\n                  borderRadius: BorderRadius.circular(15),\n                  border: Border.all(color: primary.withValues(alpha: .10)),\n                ),\n                child: Column(\n                  crossAxisAlignment: CrossAxisAlignment.end,\n                  children: [\n                    Text(\n                      _label(context, 'সময় বাকি', 'Time left'),\n                      style: TextStyle(color: secondary, fontSize: 10.5, fontWeight: FontWeight.w600),\n                    ),\n                    const SizedBox(height: 2),\n                    FittedBox(\n                      fit: BoxFit.scaleDown,\n                      child: Text(\n                        countdown,\n                        maxLines: 1,\n                        style: TextStyle(color: primary, fontSize: 18, fontWeight: FontWeight.w900),\n                      ),\n                    ),\n                  ],\n                ),\n              ),\n              if (friday) ...[\n                const SizedBox(width: 6),\n                _badge(primary, AppLocalizations.of(context).fridayLabel),\n              ],\n            ],\n          ),\n          const SizedBox(height: 13),\n          Row(\n            children: [\n              Expanded(child: _mini(context, Icons.play_arrow_rounded, _label(context, 'শুরু', 'Start'), c.currentPrayerStart)),\n              const SizedBox(width: 8),\n              Expanded(child: _mini(context, Icons.stop_rounded, _label(context, 'শেষ', 'End'), c.currentPrayerEnd)),\n              const SizedBox(width: 8),\n              Expanded(child: _mini(context, Icons.groups_rounded, _label(context, 'জামাত', 'Jamaat'), c.currentIqamahTime)),\n            ],\n          ),\n          const SizedBox(height: 11),\n          ClipRRect(\n            borderRadius: BorderRadius.circular(20),\n            child: LinearProgressIndicator(\n              value: c.prayerProgress.clamp(0.0, 1.0),\n              minHeight: 7,\n              backgroundColor: primary.withValues(alpha: .10),\n            ),\n          ),\n          const SizedBox(height: 7),\n          Row(\n            children: [\n              Icon(Icons.timelapse_rounded, size: 17, color: primary),\n              const SizedBox(width: 6),\n              Expanded(\n                child: Text(\n                  c.prayerStatus,\n                  maxLines: 1,\n                  overflow: TextOverflow.ellipsis,\n                  style: const TextStyle(fontSize: 12.5, fontWeight: FontWeight.w600),\n                ),\n              ),\n            ],\n          ),\n          const SizedBox(height: 11),\n          Row(\n            children: [\n              prayerSideCard(\n                _label(context, 'পূর্ববর্তী', 'Previous'),\n                c.previousPrayer,\n                c.previousPrayerTime.isNotEmpty ? c.previousPrayerTime : c.previousPrayerText,\n                Icons.history_rounded,\n              ),\n              const SizedBox(width: 9),\n              prayerSideCard(\n                _label(context, 'পরবর্তী', 'Next'),\n                c.nextPrayerName,\n                c.nextPrayerTime,\n                Icons.schedule_rounded,\n              ),\n            ],\n          ),\n        ],\n      ),\n    );\n  }\n\n'''

          text = text[:start] + new_card + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- lib/screens/prayer_screen_v2.dart; then
            echo 'No Prayer Screen change required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/prayer_screen_v2.dart
          git commit -m 'Prayer: improve current and previous/next layout'
          git push
