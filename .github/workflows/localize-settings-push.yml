name: Localize settings hub
on:
  push:
    branches: [fix/app-wide-localization]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-wide-localization
          fetch-depth: 0
      - name: Patch SettingsHub localization
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text(encoding='utf-8')

          # Idempotent import/variable cleanup.
          s = s.replace("import '../localization/app_localizations.dart';\n\nimport '../localization/app_localizations.dart';\n", "import '../localization/app_localizations.dart';\n")
          if "import '../localization/app_localizations.dart';" not in s:
              s = s.replace("import 'package:provider/provider.dart';\n", "import 'package:provider/provider.dart';\n\nimport '../localization/app_localizations.dart';\n", 1)
          s = s.replace("    final l10n = AppLocalizations.of(context);\n    final l10n = AppLocalizations.of(context);\n", "    final l10n = AppLocalizations.of(context);\n")
          if "    final l10n = AppLocalizations.of(context);" not in s:
              s = s.replace("    final settings = context.watch<SettingsProvider>();\n", "    final settings = context.watch<SettingsProvider>();\n    final l10n = AppLocalizations.of(context);\n", 1)

          # Main build binary labels -> centralized localization.
          pattern = re.compile(r"isEnglish \? '([^']+)' : '([^']+)'")
          start = s.index('  @override\n  Widget build(BuildContext context) {')
          end = s.index('  Widget _buildPremiumHero', start)
          block = s[start:end]
          block = pattern.sub(lambda m: "l10n.tr('%s', '%s')" % (m.group(2), m.group(1)), block)
          block = block.replace("isEnglish ? 'Language' : isArabic ? 'اللغة' : 'ভাষা'", "l10n.language")
          block = block.replace("isEnglish ? 'English' : isArabic ? 'العربية' : 'বাংলা'", "isArabic ? l10n.arabic : (isEnglish ? l10n.english : l10n.bangla)")
          s = s[:start] + block + s[end:]

          # Premium hero.
          start = s.index('  Widget _buildPremiumHero')
          end = s.index('  Widget _premiumChip', start)
          block = s[start:end]
          if block.count('final l10n = AppLocalizations.of(context);') > 1:
              block = block.replace("    final l10n = AppLocalizations.of(context);\n    final l10n = AppLocalizations.of(context);\n", "    final l10n = AppLocalizations.of(context);\n")
          if 'final l10n = AppLocalizations.of(context);' not in block:
              block = block.replace("    final isEnglish = settings.languageCode == 'en';\n", "    final l10n = AppLocalizations.of(context);\n    final isEnglish = settings.languageCode == 'en';\n", 1)
          block = pattern.sub(lambda m: "l10n.tr('%s', '%s')" % (m.group(2), m.group(1)), block)
          s = s[:start] + block + s[end:]

          # Helper methods: make language code explicit and Arabic-aware.
          s = s.replace("String _themeLabel(SettingsProvider settings) {\n    if (settings.isAmoledMode) return settings.isEnglish ? 'AMOLED Black' : 'অ্যামোলেড কালো';", "String _themeLabel(SettingsProvider settings) {\n    if (settings.isAmoledMode) {\n      if (settings.isArabic) return 'أسود AMOLED';\n      return settings.isEnglish ? 'AMOLED Black' : 'অ্যামোলেড কালো';\n    }")
          s = s.replace("return settings.isEnglish ? 'Light Mode' : 'লাইট মোড';", "if (settings.isArabic) return 'الوضع الفاتح';\n        return settings.isEnglish ? 'Light Mode' : 'লাইট মোড';")
          s = s.replace("return settings.isEnglish ? 'Dark Mode' : 'ডার্ক মোড';", "if (settings.isArabic) return 'الوضع الداكن';\n        return settings.isEnglish ? 'Dark Mode' : 'ডার্ক মোড';")
          s = s.replace("return settings.isEnglish ? 'System Default' : 'সিস্টেম অনুযায়ী';", "if (settings.isArabic) return 'إعدادات النظام';\n        return settings.isEnglish ? 'System Default' : 'সিস্টেম অনুযায়ী';")

          s = s.replace("String _textSizeLabel(int level, bool isEnglish) {", "String _textSizeLabel(int level, String languageCode) {\n    final isEnglish = languageCode == 'en';\n    final isArabic = languageCode == 'ar';")
          s = s.replace("case 0:\n        return isEnglish ? 'Small' : 'ছোট';", "case 0:\n        return isArabic ? 'صغير' : (isEnglish ? 'Small' : 'ছোট');")
          s = s.replace("case 2:\n        return isEnglish ? 'Large' : 'বড়';", "case 2:\n        return isArabic ? 'كبير' : (isEnglish ? 'Large' : 'বড়');")
          s = s.replace("case 3:\n        return isEnglish ? 'Very Large' : 'খুব বড়';", "case 3:\n        return isArabic ? 'كبير جدًا' : (isEnglish ? 'Very Large' : 'খুব বড়');")
          s = s.replace("return isEnglish ? 'Normal' : 'স্বাভাবিক';", "return isArabic ? 'عادي' : (isEnglish ? 'Normal' : 'স্বাভাবিক');")

          s = s.replace("String _adjustmentLabel(SettingsProvider settings, bool isEnglish) {", "String _adjustmentLabel(SettingsProvider settings, String languageCode) {\n    final isEnglish = languageCode == 'en';\n    final isArabic = languageCode == 'ar';")
          s = s.replace("if (active.isEmpty) return isEnglish ? 'No adjustments' : 'কোনো সমন্বয় নেই';", "if (active.isEmpty) return isArabic ? 'لا توجد تعديلات' : (isEnglish ? 'No adjustments' : 'কোনো সমন্বয় নেই');")
          s = s.replace("final prayer = _prayerLabel(entry.key, isEnglish);", "final prayer = _prayerLabel(entry.key, languageCode);")
          s = s.replace("return '$prayer: $sign${entry.value} ${isEnglish ? 'min' : 'মিনিট'}';", "return '$prayer: $sign${entry.value} ${isArabic ? 'دقيقة' : (isEnglish ? 'min' : 'মিনিট')}';")

          s = s.replace("String _dateLabel(SettingsProvider settings, bool isEnglish) {", "String _dateLabel(SettingsProvider settings, String languageCode) {\n    final isEnglish = languageCode == 'en';\n    final isArabic = languageCode == 'ar';")
          s = s.replace("return isEnglish ? 'Hijri only' : 'শুধু হিজরি';", "return isArabic ? 'هجري فقط' : (isEnglish ? 'Hijri only' : 'শুধু হিজরি');")
          s = s.replace("return isEnglish ? 'Gregorian only' : 'শুধু গ্রেগরিয়ান';", "return isArabic ? 'ميلادي فقط' : (isEnglish ? 'Gregorian only' : 'শুধু গ্রেগরিয়ান');")
          s = s.replace("return isEnglish ? 'Both dates' : 'উভয় তারিখ';", "return isArabic ? 'كلا التاريخين' : (isEnglish ? 'Both dates' : 'উভয় তারিখ');")

          s = s.replace("String _choiceLabel(String option, bool isEnglish) {\n    if (isEnglish) {", "String _choiceLabel(String option, String languageCode) {\n    final isEnglish = languageCode == 'en';\n    final isArabic = languageCode == 'ar';\n    if (isArabic) {\n      const arabic = <String, String>{'system': 'إعدادات النظام', 'light': 'الوضع الفاتح', 'dark': 'الوضع الداكن', 'amoled': 'أسود AMOLED', 'bn': 'البنغالية', 'en': 'الإنجليزية', 'Bangla': 'البنغالية', 'English': 'الإنجليزية', 'Default': 'افتراضي', 'hijri': 'هجري', 'gregorian': 'ميلادي', 'both': 'كلا التاريخين', 'Karachi': 'كراتشي', 'Muslim World League': 'رابطة العالم الإسلامي', 'Egyptian': 'المصري', 'Umm Al Qura': 'أم القرى', 'Dubai': 'دبي', 'Qatar': 'قطر', 'Kuwait': 'الكويت', 'Singapore': 'سنغافورة', 'North America': 'أمريكا الشمالية', 'Moonsighting Committee': 'لجنة تحري الهلال', 'Hanafi': 'حنفي', 'Shafi': 'شافعي'};\n      return arabic[option] ?? option;\n    }\n    if (isEnglish) {")

          s = s.replace("String _prayerLabel(String prayer, bool isEnglish) {\n    if (isEnglish) return prayer;", "String _prayerLabel(String prayer, String languageCode) {\n    final isEnglish = languageCode == 'en';\n    final isArabic = languageCode == 'ar';\n    if (isArabic) {\n      const labels = <String, String>{'Fajr': 'الفجر', 'Dhuhr': 'الظهر', 'Asr': 'العصر', 'Maghrib': 'المغرب', 'Isha': 'العشاء'};\n      return labels[prayer] ?? prayer;\n    }\n    if (isEnglish) return prayer;")

          s = s.replace("String _calculationLabel(String method, bool isEnglish) => _choiceLabel(method, isEnglish);", "String _calculationLabel(String method, String languageCode) => _choiceLabel(method, languageCode);")
          s = s.replace("String _madhabLabel(String madhab, bool isEnglish) => _choiceLabel(madhab, isEnglish);", "String _madhabLabel(String madhab, String languageCode) => _choiceLabel(madhab, languageCode);")
          s = s.replace("String _quranTranslationLabel(String translation, bool isEnglish) => _choiceLabel(translation, isEnglish);", "String _quranTranslationLabel(String translation, String languageCode) => _choiceLabel(translation, languageCode);")

          # Update helper call sites.
          s = s.replace("_textSizeLabel(textScale.level, isEnglish)", "_textSizeLabel(textScale.level, settings.languageCode)")
          s = s.replace("_showTextSizeSheet(context, textScale, isEnglish)", "_showTextSizeSheet(context, textScale, settings.languageCode)")
          s = s.replace("_calculationLabel(settings.calculationMethod, isEnglish)", "_calculationLabel(settings.calculationMethod, settings.languageCode)")
          s = s.replace("_madhabLabel(settings.madhhab, isEnglish)", "_madhabLabel(settings.madhhab, settings.languageCode)")
          s = s.replace("_quranTranslationLabel(settings.quranTranslation, isEnglish)", "_quranTranslationLabel(settings.quranTranslation, settings.languageCode)")
          s = s.replace("_adjustmentLabel(settings, isEnglish)", "_adjustmentLabel(settings, settings.languageCode)")
          s = s.replace("_dateLabel(settings, isEnglish)", "_dateLabel(settings, settings.languageCode)")
          s = s.replace("_prayerLabel(prayer, settings.isEnglish)", "_prayerLabel(prayer, settings.languageCode)")
          s = s.replace("_choiceLabel(option, isEnglish)", "_choiceLabel(option, languageCode)")

          # Fix duplicate l10n declarations produced by earlier runs.
          s = s.replace("    final l10n = AppLocalizations.of(context);\n    final l10n = AppLocalizations.of(context);\n", "    final l10n = AppLocalizations.of(context);\n")

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          git add lib/screens/settings_hub_screen_v4.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: complete settings localization without UI changes"
          git push origin fix/app-wide-localization
