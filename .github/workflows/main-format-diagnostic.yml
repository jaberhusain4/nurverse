name: Temporary Main Dart Format Diagnostic
on:
  push:
    branches: [test/prayer-history-regressions]
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Show formatted main.dart
        run: dart format --output=show lib/main.dart
