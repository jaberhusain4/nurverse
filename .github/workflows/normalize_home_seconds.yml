name: Normalize Home Seconds Preference

on:
  push:
    branches: [fix/prayer-completion-tracker]

jobs:
  apply:
    if: github.actor == 'jaberhusain4' && !contains(github.event.head_commit.message, 'Normalize Home Seconds Preference')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1
      - name: Patch home seconds behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/simple_home_screen_v11.dart')
          s = p.read_text(encoding='utf-8')
          old = """  String _clock() {\n    final h = _now.hour % 12 == 0 ? 12 : _now.hour % 12;\n    return '${h.toString().padLeft(2, '0')}:${_now.minute.toString().padLeft(2, '0')}:${_now.second.toString().padLeft(2, '0')}';\n  }\n"""
          new = """  String _clock(bool showSeconds) {\n    final h = _now.hour % 12 == 0 ? 12 : _now.hour % 12;\n    final base = '${h.toString().padLeft(2, '0')}:${_now.minute.toString().padLeft(2, '0')}';\n    return showSeconds ? '$base:${_now.second.toString().padLeft(2, '0')}' : base;\n  }\n\n  String _withoutSeconds(String value) {\n    final match = RegExp(r'^(\\d{2}:\\d{2})').firstMatch(value.trim());\n    return match == null ? value : match.group(1)!;\n  }\n"""
          if old not in s:
              raise SystemExit('clock block not found')
          s = s.replace(old, new, 1)
          old = """  String _remaining(PrayerController c) {\n    final value = c.timeRemainingForNextPrayer;\n    if (value == null) return '--:--:--';\n    return value.toString();\n  }\n"""
          new = """  String _remaining(PrayerController c, bool showSeconds) {\n    final value = c.timeRemainingForNextPrayer;\n    if (value == null) return showSeconds ? '--:--:--' : '--:--';\n    final text = value.toString();\n    return showSeconds ? text : _withoutSeconds(text);\n  }\n"""
          if old not in s:
              raise SystemExit('remaining block not found')
          s = s.replace(old, new, 1)
          s = s.replace("clock: _clock(),", "clock: _clock(settings.showSeconds),", 1)
          s = s.replace("remaining: _remaining(controller),", "remaining: _remaining(controller, settings.showSeconds),", 1)
          s = s.replace("nextPrayerTime: '${controller.nextPrayerTime}',", "nextPrayerTime: settings.showSeconds ? '${controller.nextPrayerTime}' : _withoutSeconds('${controller.nextPrayerTime}'),", 1)
          s = s.replace("sunrise: '${controller.sunriseTime}',", "sunrise: settings.showSeconds ? '${controller.sunriseTime}' : _withoutSeconds('${controller.sunriseTime}'),", 1)
          s = s.replace("sunset: '${controller.sunsetTime}',", "sunset: settings.showSeconds ? '${controller.sunsetTime}' : _withoutSeconds('${controller.sunsetTime}'),", 1)
          s = s.replace("_PrayerTimeline(prayers: prayers, code: code)", "_PrayerTimeline(prayers: prayers, code: code, showSeconds: settings.showSeconds)", 1)
          s = s.replace("const _PrayerTimeline({required this.prayers, required this.code});\n  final List<Map<String, dynamic>> prayers;\n  final String code;", "const _PrayerTimeline({required this.prayers, required this.code, required this.showSeconds});\n  final List<Map<String, dynamic>> prayers;\n  final String code;\n  final bool showSeconds;", 1)
          s = s.replace("final time = '${p['time'] ?? p['formattedTime'] ?? '--:--'}';", "final rawTime = '${p['time'] ?? p['formattedTime'] ?? '--:--'}';\n          final time = showSeconds ? rawTime : RegExp(r'^(\\d{2}:\\d{2})').firstMatch(rawTime.trim())?.group(1) ?? rawTime;", 1)
          p.write_text(s, encoding='utf-8')
