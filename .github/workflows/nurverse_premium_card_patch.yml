name: Apply NurVerse Premium card patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-premium-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch Premium card and active Google login
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/screens/more_screen.dart")
          text = path.read_text(encoding="utf-8")

          changed = False

          import_line = "import 'auth/google_login_screen.dart';\n"
          if import_line not in text:
              marker = "import 'package:share_plus/share_plus.dart';\n\n"
              text = text.replace(marker, marker + import_line + "\n", 1)
              changed = True

          hero_start = text.index("Widget _buildPremiumHero(")
          hero_end = text.index("Widget _premiumChip(", hero_start)
          hero = text[hero_start:hero_end]

          old_gradient = """gradient: LinearGradient(\n          begin: Alignment.topLeft,\n          end: Alignment.bottomRight,\n          colors: [\n            AppColors.seaBlue.withValues(alpha: .22),\n            AppColors.seaBlue.withValues(alpha: .08),\n            Theme.of(context).cardColor,\n          ],\n        ),"""
          if old_gradient in hero:
              hero = hero.replace(
                  old_gradient,
                  "color: Theme.of(context).cardColor,",
                  1,
              )
              changed = True

          login_marker = """            ],\n          ),\n\n          const SizedBox(height: 18),"""
          login_widget = """            ],\n          ),\n\n          const SizedBox(height: 18),"""

          if "auth/google_login_screen.dart" in text and "Icons.login_rounded" not in hero:
              row_marker = """              Expanded(\n                child: Column("""
              row_start = hero.index(row_marker)
              row_end = hero.index(login_marker, row_start)
              row_block = hero[row_start:row_end]

              # Insert the active account/login control immediately after the\n              # main text column, before the Row closes.
              closing = """              ),\n"""
              insert_at = row_block.rfind(closing)
              if insert_at == -1:
                  raise RuntimeError("Could not locate Premium hero text column end")
              insert_at += len(closing)

              account_control = """
              const SizedBox(width: 10),
              Material(
                color: Colors.transparent,
                child: InkWell(
                  onTap: () {
                    Navigator.of(context).push(
                      MaterialPageRoute(
                        builder: (_) => const GoogleLoginScreen(),
                      ),
                    );
                  },
                  borderRadius: BorderRadius.circular(14),
                  child: Container(
                    width: 42,
                    height: 42,
                    decoration: BoxDecoration(
                      color: AppColors.seaBlue.withValues(alpha: .10),
                      borderRadius: BorderRadius.circular(14),
                      border: Border.all(
                        color: AppColors.seaBlue.withValues(alpha: .12),
                      ),
                    ),
                    child: const Icon(
                      Icons.login_rounded,
                      color: AppColors.seaBlue,
                      size: 20,
                    ),
                  ),
                ),
              ),"""

              row_block = row_block[:insert_at] + account_control + row_block[insert_at:]
              hero = hero[:row_start] + row_block + hero[row_end:]
              changed = True

          text = text[:hero_start] + hero + text[hero_end:]

          if changed:
              path.write_text(text, encoding="utf-8")
          else:
              print("No patch needed; Premium card is already up to date.")

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- lib/screens/more_screen.dart; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/more_screen.dart
          git commit -m "Polish Premium card and connect Google login"
          git push
