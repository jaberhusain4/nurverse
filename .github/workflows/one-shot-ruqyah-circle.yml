name: One-shot Ruqyah marker patch

on:
  push:
    branches:
      - chore/one-shot-ruqyah-marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dua marker UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/screens/tools/ruqyah_screen.dart")
          source = path.read_text(encoding="utf-8")

          start = source.find("  Widget _buildDuaReading(BuildContext context) {")
          end = source.find("\n  Widget _buildNoteCard(BuildContext context) {", start)
          if start < 0 or end < 0:
              raise SystemExit("_buildDuaReading block not found")

          new_method = r'''  Widget _buildDuaReading(BuildContext context) {
    final primary = Theme.of(context).colorScheme.primary;
    final arabic = widget.item.arabic
        .replaceAll('۝', '')
        .replaceAll('●', '')
        .replaceAll(RegExp(r'\\s+'), ' ')
        .trim();

    return Column(
      children: [
        Container(
          width: double.infinity,
          padding: const EdgeInsets.all(15),
          decoration: BoxDecoration(
            color: Theme.of(context).cardColor,
            borderRadius: BorderRadius.circular(20),
          ),
          child: Directionality(
            textDirection: TextDirection.rtl,
            child: RichText(
              textAlign: TextAlign.right,
              text: TextSpan(
                style: const TextStyle(
                  fontSize: 20,
                  height: 1.55,
                  fontWeight: FontWeight.w500,
                ),
                children: [
                  TextSpan(text: arabic),
                  WidgetSpan(
                    alignment: PlaceholderAlignment.middle,
                    child: Padding(
                      padding: const EdgeInsets.only(left: 6, right: 2),
                      child: Container(
                        width: 18,
                        height: 18,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: primary.withValues(alpha: .10),
                          border: Border.all(
                            color: primary.withValues(alpha: .72),
                            width: 1.4,
                          ),
                        ),
                      ),
                    ),
                  ),
                ],
              ),
            ),
          ),
        ),
        const SizedBox(height: 10),
        Container(
          width: double.infinity,
          padding: const EdgeInsets.all(13),
          decoration: BoxDecoration(
            color: primary.withValues(alpha: .045),
            borderRadius: BorderRadius.circular(16),
          ),
          child: Text(
            widget.item.translation,
            style: const TextStyle(fontSize: 13, height: 1.5),
          ),
        ),
        const SizedBox(height: 10),
        _buildNoteCard(context),
      ],
    );
  }
'''

          path.write_text(source[:start] + new_method + source[end:], encoding="utf-8")
          PY

      - name: Commit safe patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-ruqyah-circle.yml
          git add lib/screens/tools/ruqyah_screen.dart .github/workflows/one-shot-ruqyah-circle.yml
          git commit -m "Polish Ruqyah dua end marker"
          git push