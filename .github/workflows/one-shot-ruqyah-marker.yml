name: One-shot Ruqyah marker patch

on:
  push:
    branches:
      - chore/one-shot-ruqyah-marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dua marker and remove workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("lib/screens/tools/ruqyah_screen.dart")
          data = path.read_text(encoding="utf-8")

          old = "arabic: '''بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ''',"
          new = "arabic: '''بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ ۝ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ۝ وَهُوَ السَّمِيعُ الْعَلِيمُ''',"

          if old not in data:
              raise SystemExit("Target dua string not found; no source changes made.")

          path.write_text(data.replace(old, new, 1), encoding="utf-8", newline="\n")
          Path(".github/workflows/one-shot-ruqyah-marker.yml").unlink()

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "lib/screens/tools/ruqyah_screen.dart", ".github/workflows/one-shot-ruqyah-marker.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "Polish Ruqyah dua phrase markers"], check=True)
          subprocess.run(["git", "push"], check=True)
