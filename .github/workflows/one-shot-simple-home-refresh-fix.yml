name: One-shot Simple Home Refresh Fix

on:
  push:
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 0
      - name: Remove Home refresh gesture
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/simple_home_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = '''    return Scaffold(\n      body: RefreshIndicator(\n        color: primary,\n        onRefresh: _refreshHome,\n        child: ListView(\n          physics: const AlwaysScrollableScrollPhysics(\n            parent: BouncingScrollPhysics(),\n          ),'''
          new = '''    return Scaffold(\n      body: ListView(\n          physics: const BouncingScrollPhysics(),'''
          if old not in s:
              raise SystemExit('RefreshIndicator block header not found')
          s = s.replace(old, new, 1)
          old2 = '''          ],\n        ),\n      ),\n    );\n  }\n}'''
          new2 = '''          ],\n        ),\n    );\n  }\n}'''
          if old2 not in s:
              raise SystemExit('RefreshIndicator block footer not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-simple-home-refresh-fix.yml
          git add -A
          git commit -m "fix(home): remove refresh gesture from Simple Home"
          git push origin HEAD:fix/prayer-completion-tracker
