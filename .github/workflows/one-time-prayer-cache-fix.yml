name: One-time Prayer Cache Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/controllers/prayer_controller.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  Position? _position;\n  PrayerCalculationConfig _calculationConfig", "  Position? _position;\n  PrayerTimes? _cachedPrayerTimes;\n  PrayerTimes? _cachedTomorrowPrayerTimes;\n  PrayerTimes? _cachedYesterdayPrayerTimes;\n  DateTime? _cachedPrayerDate;\n  PrayerCalculationConfig _calculationConfig",1)
          s=s.replace("    _calculationConfig = config;\n    _safeRefresh();", "    _calculationConfig = config;\n    _invalidatePrayerTimeCache();\n    _safeRefresh();",1)
          s=s.replace("    };\n    _safeRefresh();\n  }\n\n  Future<void> determinePositionAndAddress", "    };\n    _invalidatePrayerTimeCache();\n    _safeRefresh();\n  }\n\n  Future<void> determinePositionAndAddress",1)
          s=s.replace("      _position = position;\n      try {", "      _position = position;\n      _invalidatePrayerTimeCache();\n      try {",1)
          s=s.replace("  void _safeRefresh() {\n    try {", "  void _safeRefresh() {\n    try {",1)
          anchor="  void setCalculationConfig(PrayerCalculationConfig config) {"
          helper="  void _invalidatePrayerTimeCache() {\n    _cachedPrayerTimes = null;\n    _cachedTomorrowPrayerTimes = null;\n    _cachedYesterdayPrayerTimes = null;\n    _cachedPrayerDate = null;\n  }\n\n"
          s=s.replace(anchor,helper+anchor,1)
          old="""    final DateTime now = DateTime.now();
    final PrayerTimes prayerTimes = _prayerEngine.getPrayerTimes(
      position: position,
      date: now,
      config: _calculationConfig,
    );
"""
          new="""    final DateTime now = DateTime.now();
    final DateTime dayKey = DateTime(now.year, now.month, now.day);
    if (_cachedPrayerDate != dayKey) {
      _cachedPrayerDate = dayKey;
      _cachedPrayerTimes = null;
      _cachedTomorrowPrayerTimes = null;
      _cachedYesterdayPrayerTimes = null;
    }
    final PrayerTimes prayerTimes = _cachedPrayerTimes ??= _prayerEngine.getPrayerTimes(
      position: position,
      date: now,
      config: _calculationConfig,
    );
"""
          if old not in s: raise SystemExit('current calculation anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("    final PrayerTimes tomorrowTimes = _prayerEngine.getPrayerTimes(\n        position: position, date: tomorrow, config: _calculationConfig);", "    final PrayerTimes tomorrowTimes = _cachedTomorrowPrayerTimes ??= _prayerEngine.getPrayerTimes(\n        position: position, date: tomorrow, config: _calculationConfig);",1)
          s=s.replace("    final PrayerTimes yesterdayTimes = _prayerEngine.getPrayerTimes(\n        position: position, date: yesterday, config: _calculationConfig);", "    final PrayerTimes yesterdayTimes = _cachedYesterdayPrayerTimes ??= _prayerEngine.getPrayerTimes(\n        position: position, date: yesterday, config: _calculationConfig);",1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify
        run: |
          dart format lib/controllers/prayer_controller.dart
          flutter analyze
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-prayer-cache-fix.yml
          git add lib/controllers/prayer_controller.dart .github/workflows/one-time-prayer-cache-fix.yml
          git commit -m 'fix(prayer): cache repeated prayer calculations'
          git push origin main
