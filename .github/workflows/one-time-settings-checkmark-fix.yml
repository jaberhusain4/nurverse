name: One-time Settings Checkmark Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact Settings patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text(encoding='utf-8')

          old = """                SettingsProvider.calculationMethods,\n                settings.setCalculationMethod,\n"""
          new = """                SettingsProvider.calculationMethods,\n                settings.setCalculationMethod,\n                selectedValue: settings.calculationMethod,\n"""
          if old not in s:
              raise SystemExit('Calculation method block not found')
          s = s.replace(old, new, 1)

          old = """                SettingsProvider.madhabs,\n                settings.setMadhab,\n"""
          new = """                SettingsProvider.madhabs,\n                settings.setMadhab,\n                selectedValue: settings.madhab,\n"""
          if old not in s:
              raise SystemExit('Madhab block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- lib/screens/settings_hub_screen_v4.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-settings-checkmark-fix.yml
          git add lib/screens/settings_hub_screen_v4.dart .github/workflows/one-time-settings-checkmark-fix.yml
          git commit -m 'fix(settings): show active prayer calculation and madhab'
          git push origin main
