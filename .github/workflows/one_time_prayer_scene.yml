name: One-time prayer card scene updater

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-prayer-scene:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply prayer card scene') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update prayer card
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/localized_prayer_screen.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('  Widget _currentCard(')
          end = text.index('  Widget _summaryCard(', start)

          replacement = r'''  Widget _currentCard(BuildContext context, PrayerController c, bool friday) {
    final l10n = AppLocalizations.of(context);
    final primary = Theme.of(context).colorScheme.primary;
    final secondary = context.secondaryTextColor;

    return _card(
      context,
      radius: 22,
      padding: const EdgeInsets.fromLTRB(15, 14, 15, 13),
      child: Column(children: [
        Stack(
          clipBehavior: Clip.none,
          children: [
            Positioned(
              left: 0,
              top: 3,
              child: _prayerScene(context, primary, flip: false),
            ),
            Positioned(
              right: 0,
              top: 3,
              child: _prayerScene(context, primary, flip: true),
            ),
            Center(
              child: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 72),
                child: Column(children: [
                  Text(
                    l10n.currentPrayerLabel,
                    maxLines: 1,
                    textAlign: TextAlign.center,
                    style: TextStyle(
                      color: secondary,
                      fontSize: 11.5,
                      fontWeight: FontWeight.w600,
                    ),
                  ),
                  const SizedBox(height: 3),
                  Text(
                    l10n.prayerName(c.currentPrayer),
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    textAlign: TextAlign.center,
                    style: const TextStyle(
                      fontSize: 20,
                      fontWeight: FontWeight.w700,
                      height: 1.05,
                    ),
                  ),
                ]),
              ),
            ),
            if (friday)
              Positioned(
                top: 2,
                right: 0,
                child: _badge(primary, l10n.fridayLabel),
              ),
          ],
        ),
        const SizedBox(height: 13),
        Row(children: [
          Expanded(child: _mini(context, Icons.play_arrow_rounded, l10n.startLabel, c.currentPrayerStart)),
          const SizedBox(width: 8),
          Expanded(child: _mini(context, Icons.stop_rounded, l10n.endLabel, c.currentPrayerEnd)),
          const SizedBox(width: 8),
          Expanded(child: _mini(context, Icons.groups_rounded, l10n.jamaatLabel, c.currentIqamahTime)),
        ]),
        const SizedBox(height: 12),
        ClipRRect(
          borderRadius: BorderRadius.circular(20),
          child: LinearProgressIndicator(
            value: c.prayerProgress.clamp(0.0, 1.0),
            minHeight: 7,
            backgroundColor: primary.withValues(alpha: .10),
          ),
        ),
        const SizedBox(height: 7),
        Row(children: [
          Icon(Icons.timelapse_rounded, size: 17, color: primary),
          const SizedBox(width: 6),
          Expanded(
            child: Text(
              c.prayerStatus,
              maxLines: 1,
              overflow: TextOverflow.ellipsis,
              style: const TextStyle(fontSize: 12.5, fontWeight: FontWeight.w600),
            ),
          ),
        ]),
        const SizedBox(height: 10),
        Container(
          padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 9),
          decoration: BoxDecoration(
            color: primary.withValues(alpha: .06),
            borderRadius: BorderRadius.circular(13),
          ),
          child: Row(children: [
            Icon(Icons.schedule_rounded, size: 18, color: primary),
            const SizedBox(width: 7),
            Expanded(
              child: Text(
                '${l10n.nextLabel}: ${l10n.prayerName(c.nextPrayerName)}',
                maxLines: 1,
                overflow: TextOverflow.ellipsis,
                style: const TextStyle(fontSize: 13, fontWeight: FontWeight.w600),
              ),
            ),
            const SizedBox(width: 6),
            Text(
              c.nextPrayerTime,
              style: TextStyle(color: primary, fontSize: 13.5, fontWeight: FontWeight.w700),
            ),
            const SizedBox(width: 6),
            Flexible(
              child: Text(
                c.timeRemainingForNextPrayer,
                maxLines: 1,
                overflow: TextOverflow.ellipsis,
                style: TextStyle(color: secondary, fontSize: 11.5, fontWeight: FontWeight.w600),
              ),
            ),
          ]),
        ),
      ]),
    );
  }

  Widget _prayerScene(BuildContext context, Color primary, {required bool flip}) {
    final soft = primary.withValues(alpha: .72);
    final faint = primary.withValues(alpha: .38);
    final moon = primary.withValues(alpha: .82);

    final scene = SizedBox(
      width: 68,
      height: 58,
      child: Stack(
        clipBehavior: Clip.none,
        children: [
          Positioned(
            left: flip ? null : 2,
            right: flip ? 2 : null,
            bottom: 3,
            child: Icon(Icons.park_rounded, color: soft, size: 29),
          ),
          Positioned(
            left: flip ? 18 : null,
            right: flip ? null : 18,
            bottom: 4,
            child: Icon(Icons.mosque_rounded, color: primary.withValues(alpha: .64), size: 32),
          ),
          Positioned(
            left: flip ? null : 38,
            right: flip ? 38 : null,
            top: 0,
            child: Icon(Icons.nightlight_round, color: moon, size: 19),
          ),
          Positioned(
            left: flip ? 9 : null,
            right: flip ? null : 9,
            top: 15,
            child: Icon(Icons.star_rounded, color: faint, size: 9),
          ),
          Positioned(
            left: flip ? 31 : null,
            right: flip ? null : 31,
            top: 24,
            child: Icon(Icons.star_rounded, color: faint, size: 6),
          ),
        ],
      ),
    );

    return Transform(
      alignment: Alignment.center,
      transform: Matrix4.identity()..scale(flip ? -1.0 : 1.0, 1.0),
      child: scene,
    );
  }

'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one_time_prayer_scene.yml
          git add lib/screens/localized_prayer_screen.dart .github/workflows/one_time_prayer_scene.yml
          git commit -m "Apply prayer card scene" || exit 0
          git push
