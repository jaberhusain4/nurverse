name: Patch Surah and prayer language

on:
  pull_request:
    branches: [fix/prayer-completion-tracker]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/surah-name-localization
          fetch-depth: 0

      - name: Apply surgical localization patch
        shell: python
        run: |
          from pathlib import Path
          import re

          names = [
            'আল-ফাতিহা','আল-বাকারা','আলে-ইমরান','আন-নিসা','আল-মায়িদাহ','আল-আনআম','আল-আরাফ','আল-আনফাল','আত-তাওবাহ','ইউনুস','হূদ','ইউসুফ','আর-রাদ','ইবরাহিম','আল-হিজর','আন-নাহল','আল-ইসরা','আল-কাহফ','মারইয়াম','ত্বা-হা','আল-আম্বিয়া','আল-হাজ্জ','আল-মুমিনূন','আন-নূর','আল-ফুরকান','আশ-শুআরা','আন-নামল','আল-কাসাস','আল-আনকাবুত','আর-রূম','লুকমান','আস-সাজদাহ','আল-আহযাব','সাবা','ফাতির','ইয়াসীন','আস-সাফফাত','সাদ','আয-যুমার','গাফির','ফুসসিলাত','আশ-শূরা','আয-যুখরুফ','আদ-দুখান','আল-জাসিয়াহ','আল-আহকাফ','মুহাম্মাদ','আল-ফাতহ','আল-হুজুরাত','কাফ','আয-যারিয়াত','আত-তূর','আন-নাজম','আল-কামার','আর-রহমান','আল-ওয়াকিয়াহ','আল-হাদীদ','আল-মুজাদালাহ','আল-হাশর','আল-মুমতাহিনাহ','আস-সাফ','আল-জুমুআহ','আল-মুনাফিকূন','আত-তাগাবুন','আত-তালাক','আত-তাহরীম','আল-মুলক','আল-কলম','আল-হাক্কাহ','আল-মাআরিজ','নূহ','আল-জিন','আল-মুযযাম্মিল','আল-মুদ্দাসসির','আল-কিয়ামাহ','আল-ইনসান','আল-মুরসালাত','আন-নাবা','আন-নাযিয়াত','আবাসা','আত-তাকভীর','আল-ইনফিতার','আল-মুতাফফিফীন','আল-ইনশিকাক','আল-বুরুজ','আত-তারিক','আল-আ’লা','আল-গাশিয়াহ','আল-ফজর','আল-বালাদ','আশ-শামস','আল-লাইল','আদ-দুহা','আশ-শরহ','আত-তীন','আল-আলাক','আল-কদর','আল-বাইয়্যিনাহ','আয-যিলযাল','আল-আদিয়াত','আল-কারিয়াহ','আত-তাকাসুর','আল-আসর','আল-হুমাযাহ','আল-ফীল','কুরাইশ','আল-মাউন','আল-কাওসার','আল-কাফিরুন','আন-নসর','আল-মাসাদ','আল-ইখলাস','আল-ফালাক','আন-নাস'
          ]
          assert len(names) == 114

          p = Path('lib/screens/quran/onudhabon_quran_reader.dart')
          s = p.read_text(encoding='utf-8')
          helper = '''\n  String _surahDisplayName(QuranSurah surah, AppLocalizations l10n) {\n    const banglaNames = <int, String>{\n''' + ''.join(f'      {i + 1}: {names[i]!r},\n' for i in range(114)) + '''    };\n    if (l10n.isArabic) return surah.arabicName;\n    if (l10n.isEnglish) return surah.transliteration;\n    return banglaNames[surah.number] ?? surah.transliteration;\n  }\n'''
          anchor = '  String _localizedText(\n'
          if '_surahDisplayName(QuranSurah surah' not in s:
              s = s.replace(anchor, helper + '\n' + anchor, 1)
          old = """        title: Text(\n          surah.banglaName ?? surah.transliteration,\n          style: const TextStyle(fontSize: 15, fontWeight: FontWeight.w800),\n        ),\n        subtitle: Text(\n          '${l10n.isBangla ? _bn(surah.totalVerses) : l10n.isArabic ? _ar(surah.totalVerses) : surah.totalVerses} ${_localizedText(l10n, 'আয়াত', 'verses', 'آيات')} • ${l10n.isBangla ? _bn(meta.rukuCount) : l10n.isArabic ? _ar(meta.rukuCount) : meta.rukuCount} ${_localizedText(l10n, 'রুকু', 'ruku', 'ركوع')} • ${l10n.isBangla ? _bn(meta.sajdaCount) : l10n.isArabic ? _ar(meta.sajdaCount) : meta.sajdaCount} ${_localizedText(l10n, 'সিজদা', 'sajdah', 'سجود')} • $typeLabel',\n          style: const TextStyle(fontSize: 12),\n        ),"""
          new = """        title: Text(\n          _surahDisplayName(surah, l10n),\n          textDirection: l10n.isArabic ? TextDirection.rtl : TextDirection.ltr,\n          style: const TextStyle(fontSize: 15, fontWeight: FontWeight.w800),\n        ),\n        subtitle: Text(\n          '${l10n.isBangla && (surah.banglaName?.trim().isNotEmpty ?? false) ? '${surah.banglaName!.trim()} • ' : ''}${l10n.isBangla ? _bn(surah.totalVerses) : l10n.isArabic ? _ar(surah.totalVerses) : surah.totalVerses} ${_localizedText(l10n, 'আয়াত', 'verses', 'آيات')} • ${l10n.isBangla ? _bn(meta.rukuCount) : l10n.isArabic ? _ar(meta.rukuCount) : meta.rukuCount} ${_localizedText(l10n, 'রুকু', 'ruku', 'ركوع')} • ${l10n.isBangla ? _bn(meta.sajdaCount) : l10n.isArabic ? _ar(meta.sajdaCount) : meta.sajdaCount} ${_localizedText(l10n, 'সিজদা', 'sajdah', 'سجود')} • $typeLabel',\n          maxLines: 2,\n          overflow: TextOverflow.ellipsis,\n          style: const TextStyle(fontSize: 12),\n        ),"""
          if old not in s:
              raise SystemExit('Onudhabon surah tile block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/localized_prayer_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace('                  c.prayerStatus,\n', '                  l10n.prayerStatus(c.prayerStatus),\n', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          git add lib/screens/quran/onudhabon_quran_reader.dart lib/screens/localized_prayer_screen.dart
          git commit -m "fix: localize prayer status and Onudhabon surah names"
          git push origin fix/surah-name-localization
