name: Prayer diagnostic

on:
  push:
    branches: [diagnostic/prayer-time-savar]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - run: flutter pub get
      - run: dart run tool/prayer_diagnostic.dart