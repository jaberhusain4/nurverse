name: Repair active Home and Prayer seconds
# trigger repair after workflow registration
on:
  push:
    branches: [fix/prayer-completion-tracker]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Patch active screens
        shell: python
        run: |
          from pathlib import Path

          # ACTIVE HOME: MainShell opens HomeScreen, not the legacy SimpleHome variants.
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          helper = """
  String _displayTime(String value, bool showSeconds) {
    final raw = value.trim();
    if (showSeconds) return raw;
    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(raw);
    return match?.group(1) ?? raw;
  }

  List<Map<String, dynamic>> _displayPrayerTimes(List<Map<String, dynamic>> prayers, bool showSeconds) {
    return prayers.map((prayer) {
      final copy = Map<String, dynamic>.from(prayer);
      for (final key in const ['start', 'end', 'jamaat', 'time', 'formattedTime']) {
        final value = copy[key];
        if (value != null) copy[key] = _displayTime(value.toString(), showSeconds);
      }
      return copy;
    }).toList(growable: false);
  }
"""
          marker = "  String _greeting(String languageCode) {"
          if '_displayPrayerTimes(List<Map<String, dynamic>> prayers' not in s:
              if marker not in s: raise SystemExit('Home helper marker missing')
              s = s.replace(marker, helper + "\n" + marker, 1)
          s = s.replace("currentTime: _currentTime,", "currentTime: _displayTime(_currentTime, settings.showSeconds),", 1)
          s = s.replace("previousPrayerTime: controller.previousPrayerTime,", "previousPrayerTime: _displayTime(controller.previousPrayerTime, settings.showSeconds),", 1)
          s = s.replace("currentPrayerTime: controller.currentPrayerTime,", "currentPrayerTime: _displayTime(controller.currentPrayerTime, settings.showSeconds),", 1)
          s = s.replace("nextPrayerTime: controller.nextPrayerTime,", "nextPrayerTime: _displayTime(controller.nextPrayerTime, settings.showSeconds),", 1)
          s = s.replace("remainingTime: controller.timeRemainingForNextPrayer,", "remainingTime: _displayTime(controller.timeRemainingForNextPrayer, settings.showSeconds),", 1)
          s = s.replace("iqamahTime: currentJamaat,", "iqamahTime: _displayTime(currentJamaat, settings.showSeconds),", 1)
          s = s.replace("PrayerTimelineCard(prayers: controller.prayers, languageCode: languageCode)", "PrayerTimelineCard(prayers: _displayPrayerTimes(controller.prayers, settings.showSeconds), languageCode: languageCode)", 1)
          s = s.replace("sunrise: sunTimes?.sunriseString ?? controller.sunriseTime,", "sunrise: _displayTime(sunTimes?.sunriseString ?? controller.sunriseTime, settings.showSeconds),", 1)
          s = s.replace("sunset: sunTimes?.sunsetString ?? controller.sunsetTime,", "sunset: _displayTime(sunTimes?.sunsetString ?? controller.sunsetTime, settings.showSeconds),", 1)
          p.write_text(s, encoding='utf-8')

          # ACTIVE PRAYER: MainShell opens PrayerScreen, not prayer_screen_v2.dart.
          p = Path('lib/screens/prayer_screen.dart')
          s = p.read_text(encoding='utf-8')
          helper = """
  String _displayTime(String value, bool showSeconds) {
    final raw = value.trim();
    if (showSeconds) return raw;
    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(raw);
    return match?.group(1) ?? raw;
  }

  List<Map<String, dynamic>> _displayPrayerTimes(List<Map<String, dynamic>> prayers, bool showSeconds) {
    return prayers.map((prayer) {
      final copy = Map<String, dynamic>.from(prayer);
      for (final key in const ['start', 'end', 'jamaat', 'time', 'formattedTime']) {
        final value = copy[key];
        if (value != null) copy[key] = _displayTime(value.toString(), showSeconds);
      }
      return copy;
    }).toList(growable: false);
  }
"""
          marker = "  String _greeting(String languageCode) {"
          if '_displayPrayerTimes(List<Map<String, dynamic>> prayers' not in s:
              if marker not in s: raise SystemExit('Prayer helper marker missing')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace("currentTime: _currentTime,", "currentTime: _displayTime(_currentTime, settings.showSeconds),", 1)
          s = s.replace("previousPrayerTime: controller.previousPrayerTime,", "previousPrayerTime: _displayTime(controller.previousPrayerTime, settings.showSeconds),", 1)
          s = s.replace("currentPrayerTime: controller.currentPrayerTime,", "currentPrayerTime: _displayTime(controller.currentPrayerTime, settings.showSeconds),", 1)
          s = s.replace("nextPrayerTime: controller.nextPrayerTime,", "nextPrayerTime: _displayTime(controller.nextPrayerTime, settings.showSeconds),", 1)
          s = s.replace("remainingTime: controller.timeRemainingForNextPrayer,", "remainingTime: _displayTime(controller.timeRemainingForNextPrayer, settings.showSeconds),", 1)
          s = s.replace("iqamahTime: currentJamaat,", "iqamahTime: _displayTime(currentJamaat, settings.showSeconds),", 1)
          s = s.replace("PrayerTimelineCard(prayers: controller.prayers.where((p) => p['category'] == 'obligatory').toList(growable: false), languageCode: languageCode)", "PrayerTimelineCard(prayers: _displayPrayerTimes(controller.prayers.where((p) => p['category'] == 'obligatory').toList(growable: false), settings.showSeconds), languageCode: languageCode)", 1)
          s = s.replace("sunrise: sunTimes?.sunriseString ?? controller.sunriseTime,", "sunrise: _displayTime(sunTimes?.sunriseString ?? controller.sunriseTime, settings.showSeconds),", 1)
          s = s.replace("sunset: sunTimes?.sunsetString ?? controller.sunsetTime,", "sunset: _displayTime(sunTimes?.sunsetString ?? controller.sunsetTime, settings.showSeconds),", 1)
          s = s.replace("final start = data['start']?.toString() ?? '--:--';", "final start = _displayTime(data['start']?.toString() ?? '--:--', context.read<SettingsProvider>().showSeconds);", 1)
          s = s.replace("final end = data['end']?.toString() ?? '--:--';", "final end = _displayTime(data['end']?.toString() ?? '--:--', context.read<SettingsProvider>().showSeconds);", 1)
          s = s.replace("final jamaat = data['jamaat']?.toString() ?? '--:--';", "final jamaat = _displayTime(data['jamaat']?.toString() ?? '--:--', context.read<SettingsProvider>().showSeconds);", 1)
          s = s.replace("Text('${nafl[i]['start'] ?? '--:--'} – ${nafl[i]['end'] ?? '--:--'}'", "Text('${_displayTime(nafl[i]['start']?.toString() ?? '--:--', context.read<SettingsProvider>().showSeconds)} – ${_displayTime(nafl[i]['end']?.toString() ?? '--:--', context.read<SettingsProvider>().showSeconds)}'", 1)
          s = s.replace("sunTimes?.sunriseString ?? controller.sunriseTime, primary", "_displayTime(sunTimes?.sunriseString ?? controller.sunriseTime, context.read<SettingsProvider>().showSeconds), primary", 1)
          s = s.replace("controller.solarNoonTime, primary", "_displayTime(controller.solarNoonTime, context.read<SettingsProvider>().showSeconds), primary", 1)
          s = s.replace("sunTimes?.sunsetString ?? controller.sunsetTime, primary", "_displayTime(sunTimes?.sunsetString ?? controller.sunsetTime, context.read<SettingsProvider>().showSeconds), primary", 1)
          p.write_text(s, encoding='utf-8')

      - name: Analyze affected Dart files
        run: |
          flutter pub get
          dart analyze lib/screens/home_screen.dart lib/screens/prayer_screen.dart

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/home_screen.dart lib/screens/prayer_screen.dart
          git diff --cached --check
          git commit -m 'fix: sync active Home and Prayer seconds with settings'
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-active-prayer-home-seconds.yml || true
          git commit -m 'chore: remove temporary active screens repair workflow' || true
          git push || true
