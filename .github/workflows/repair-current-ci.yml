name: Repair Current CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Repair and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep all four madhhab choices in persistent settings.
          p = Path('lib/providers/settings_provider.dart')
          s = p.read_text(encoding='utf-8')
          old = "  static const List<String> madhabs = ['Hanafi', 'Shafi'];"
          new = """  static const List<String> madhabs = [
            'Hanafi',
            'Shafi',
            'Maliki',
            'Hanbali',
          ];"""
          if old in s:
              s = s.replace(old, new, 1)
          pattern = r"  String _normalizeMadhab\(String value\) \{.*?\n  \}"
          replacement = """  String _normalizeMadhab(String value) {
            switch (value.trim().toLowerCase()) {
              case 'shafi':
              case 'shafii':
              case 'shafi’i':
              case \"shafi'i\":
                return 'Shafi';
              case 'maliki':
                return 'Maliki';
              case 'hanbali':
                return 'Hanbali';
              case 'hanafi':
                return 'Hanafi';
              default:
                return 'Hanafi';
            }
          }"""
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected _normalizeMadhab function was not found')
          p.write_text(s, encoding='utf-8')

          # Map the two-shadow-rule-equivalent Maliki/Hanbali choices to
          # adhan's available one-shadow Asr implementation while preserving
          # the user's selected label in SettingsProvider.
          p = Path('lib/services/prayer_calculation_config.dart')
          s = p.read_text(encoding='utf-8')
          pattern = r"  static Madhab _parseMadhab\(String value\) \{.*?\n  \}"
          replacement = """  static Madhab _parseMadhab(String value) {
            final String normalized = value.trim().toLowerCase();

            switch (normalized) {
              case 'hanafi':
                return Madhab.hanafi;
              case 'shafi':
              case 'shafii':
              case 'shafi’i':
              case \"shafi'i\":
              case 'maliki':
              case 'hanbali':
              case 'standard':
                return Madhab.shafi;
              default:
                return Madhab.hanafi;
            }
          }"""
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected _parseMadhab function was not found')
          p.write_text(s, encoding='utf-8')

          # Make every choice sheet vertically bounded and independently
          # scrollable, so all ten calculation methods remain reachable.
          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    'Hanafi': 'حنفي',\n    'Shafi': 'شافعي',", "    'Hanafi': 'حنفي',\n    'Shafi': 'شافعي',\n    'Maliki': 'مالكي',\n    'Hanbali': 'حنبلي',", 1)
          s = s.replace("      'Hanafi': 'হানাফি',\n      'Shafi': 'শাফেয়ী',", "      'Hanafi': 'হানাফি',\n      'Shafi': 'শাফেয়ী',\n      'Maliki': 'মালিকি',\n      'Hanbali': 'হাম্বলি',", 1)

          start = s.index('  Future<void> _showChoiceSheet(')
          end = s.index('  Future<void> _showTextSizeSheet(', start)
          fixed = r'''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';
    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      showDragHandle: true,
      builder: (sheetContext) {
        final maxHeight = MediaQuery.sizeOf(sheetContext).height * .78;
        return SafeArea(
          child: ConstrainedBox(
            constraints: BoxConstraints(maxHeight: maxHeight),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Padding(
                  padding: const EdgeInsets.fromLTRB(18, 8, 18, 12),
                  child: Text(
                    title,
                    style: Theme.of(sheetContext)
                        .textTheme
                        .titleLarge
                        ?.copyWith(fontWeight: FontWeight.w900),
                  ),
                ),
                Flexible(
                  child: ListView.builder(
                    shrinkWrap: true,
                    padding: EdgeInsets.zero,
                    physics: const BouncingScrollPhysics(),
                    itemCount: options.length,
                    itemBuilder: (_, index) {
                      final option = options[index];
                      final label = options.length == 3 &&
                              options.contains('bn') &&
                              options.contains('en') &&
                              options.contains('ar')
                          ? (isEnglish
                              ? ({
                                    'bn': 'Bangla',
                                    'en': 'English',
                                    'ar': 'Arabic',
                                  }[option] ?? option)
                              : (isArabic
                                  ? ({
                                        'bn': 'البنغالية',
                                        'en': 'الإنجليزية',
                                        'ar': 'العربية',
                                      }[option] ?? option)
                                  : ({
                                        'bn': 'বাংলা',
                                        'en': 'ইংরেজি',
                                        'ar': 'আরবি',
                                      }[option] ?? option)))
                          : _choiceLabel(option, languageCode);
                      return ListTile(
                        title: Text(label),
                        trailing: option == selectedValue
                            ? const Icon(
                                Icons.check_circle_rounded,
                                color: AppColors.seaBlue,
                              )
                            : null,
                        onTap: () async {
                          await onSelected(option);
                          if (sheetContext.mounted) {
                            Navigator.pop(sheetContext);
                          }
                        },
                      );
                    },
                  ),
                ),
                const SizedBox(height: 8),
              ],
            ),
          ),
        );
      },
    );
  }

'''
          s = s[:start] + fixed + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          dart format lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart
          flutter pub get
          flutter analyze lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart
          flutter analyze
          flutter build apk --debug
          git diff --check

      - name: Commit repair and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart
          git commit -m 'fix(settings): restore four madhhabs and scrollable calculation selector' || true
          git rm -f .github/workflows/repair-current-ci.yml .github/workflows/fix-prayer-method-madhhab-ui.yml .github/workflows/trigger-prayer-ui-fix.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ci): remove temporary prayer settings workflows'
          fi
          git push
