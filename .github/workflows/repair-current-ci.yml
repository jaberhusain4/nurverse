name: Repair Current CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Repair and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/screens/settings_hub_screen_v4.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    final isArabic = languageCode == 'ar';\n", "")
          s = s.replace("    final isEnglish = languageCode == 'en';\n", "", 1)

          start = s.index('  Future<void> _showChoiceSheet(')
          end = s.index('  Future<void> _showTextSizeSheet(', start)
          fixed = r'''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';
    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      builder: (sheetContext) {
        final maxHeight = MediaQuery.sizeOf(sheetContext).height * .82;
        return SafeArea(
          child: ConstrainedBox(
            constraints: BoxConstraints(maxHeight: maxHeight),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Padding(
                  padding: const EdgeInsets.fromLTRB(18, 18, 18, 12),
                  child: Text(
                    title,
                    style: Theme.of(sheetContext)
                        .textTheme
                        .titleLarge
                        ?.copyWith(fontWeight: FontWeight.w900),
                  ),
                ),
                Flexible(
                  child: ListView.builder(
                    shrinkWrap: true,
                    padding: EdgeInsets.zero,
                    itemCount: options.length,
                    itemBuilder: (context, index) {
                      final option = options[index];
                      final label = options.length == 3 &&
                              options.contains('bn') &&
                              options.contains('en') &&
                              options.contains('ar')
                          ? (isEnglish
                              ? ({
                                    'bn': 'Bangla',
                                    'en': 'English',
                                    'ar': 'Arabic'
                                  }[option] ?? option)
                              : (isArabic
                                  ? ({
                                        'bn': 'البنغالية',
                                        'en': 'الإنجليزية',
                                        'ar': 'العربية'
                                      }[option] ?? option)
                                  : ({
                                        'bn': 'বাংলা',
                                        'en': 'ইংরেজি',
                                        'ar': 'আরবি'
                                      }[option] ?? option)))
                          : _choiceLabel(option, languageCode);
                      return ListTile(
                        title: Text(label),
                        trailing: option == selectedValue
                            ? const Icon(Icons.check_circle_rounded,
                                color: AppColors.seaBlue)
                            : null,
                        onTap: () async {
                          await onSelected(option);
                          if (sheetContext.mounted) Navigator.pop(sheetContext);
                        },
                      );
                    },
                  ),
                ),
                const SizedBox(height: 8),
              ],
            ),
          ),
        );
      },
    );
  }

'''
          s = s[:start] + fixed + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          dart format lib/screens/settings_hub_screen_v4.dart
          flutter pub get
          flutter analyze lib/screens/settings_hub_screen_v4.dart
          flutter analyze
          flutter build apk --debug
          git diff --check

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/settings_hub_screen_v4.dart
          git commit -m 'fix(settings): repair calculation selector overflow' || true
          git rm .github/workflows/repair-current-ci.yml
          git commit -m 'chore(ci): remove temporary repair workflow'
          git push
