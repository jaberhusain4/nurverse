name: Repair Jamaat Settings Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair settings navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/settings_hub_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_import = "import 'home_mode_settings_screen.dart';\n"
          new_import = old_import + "import 'prayer/jamaat_settings_screen.dart';\n"
          if "import 'prayer/jamaat_settings_screen.dart';" not in text:
              text = text.replace(old_import, new_import, 1)

          old_callback = "() => _jamaatDialog(context, settings),"
          new_callback = "() => Navigator.of(context).push(\n                  MaterialPageRoute<void>(\n                    builder: (_) => const JamaatSettingsScreen(),\n                  ),\n                ),"
          if old_callback not in text:
              raise SystemExit('Expected Jamaat dialog callback not found')
          text = text.replace(old_callback, new_callback, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_hub_screen.dart
          git diff --cached --quiet || git commit -m "Open dedicated Jamaat settings screen"
          git push
