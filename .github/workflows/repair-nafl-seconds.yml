name: Repair Nafl Seconds Display
on:
  push:
    branches:
      - fix/prayer-completion-tracker
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 0
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/prayer_screen_v2.dart')
          s = p.read_text(encoding='utf-8')
          old = "Text(item['time'] as String, style: TextStyle(color: Theme.of(context).colorScheme.primary, fontSize: 12.5, fontWeight: FontWeight.w800)),"
          new = "Text(_displayTime(context.read<SettingsProvider>(), item['time'] as String), style: TextStyle(color: Theme.of(context).colorScheme.primary, fontSize: 12.5, fontWeight: FontWeight.w800)),"
          if old not in s:
              raise SystemExit('Nafl time pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/prayer_screen_v2.dart
          git commit -m "Prayer: apply seconds setting to Nafl times"
          git push origin HEAD:fix/prayer-completion-tracker
          rm -f .github/workflows/repair-nafl-seconds.yml
          git add .github/workflows/repair-nafl-seconds.yml
          git commit -m "CI: remove temporary Nafl seconds workflow"
          git push origin HEAD:fix/prayer-completion-tracker
