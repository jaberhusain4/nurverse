name: One-time repair Onudhabon chip syntax

on:
  push:
    paths:
      - '.github/workflows/repair-onudhabon-chip.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
      - name: Repair malformed chip widget
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/quran/onudhabon_quran_reader.dart')
          text = p.read_text(encoding='utf-8')
          old = "    return Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6), decoration: BoxDecoration(color: primary.withValues(alpha: .07), borderRadius: BorderRadius.circular(20)), child: Text(text, style: TextStyle(fontSize: 11, fontWeight: FontWeight.w700, color: primary)));"
          new = """    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
      decoration: BoxDecoration(
        color: primary.withValues(alpha: .07),
        borderRadius: BorderRadius.circular(20),
      ),
      child: Text(
        text,
        style: TextStyle(
          fontSize: 11,
          fontWeight: FontWeight.w700,
          color: primary,
        ),
      ),
    );"""
          if old not in text:
              raise SystemExit('Expected malformed _chip return not found; refusing to modify file.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/quran/onudhabon_quran_reader.dart
          git commit -m 'fix(quran): repair Onudhabon chip syntax'
          git push origin HEAD:fix/prayer-completion-tracker
          git rm .github/workflows/repair-onudhabon-chip.yml
          git commit -m 'chore: remove one-time chip syntax repair workflow'
          git push origin HEAD:fix/prayer-completion-tracker
# sync repair v2
