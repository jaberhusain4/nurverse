name: Repair Onudhabon syntax

on:
  push:
    paths:
      - '.github/workflows/repair-onudhabon-syntax.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 1

      - name: Repair missing parenthesis in Onudhabon intro card
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/quran/onudhabon_quran_reader.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('  Widget _introCard(BuildContext context) {')
          end = text.index('  Widget _surahTile(BuildContext context, QuranSurah surah) {', start)
          block = text[start:end]
          old = "          ]),\n        ],\n      ),\n    );\n  }"
          new = "          ])),\n        ],\n      ),\n    );\n  }"
          if old not in block:
              raise SystemExit('Expected Onudhabon intro-card pattern was not found; refusing to modify file.')
          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- lib/screens/quran/onudhabon_quran_reader.dart; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/quran/onudhabon_quran_reader.dart
          git commit -m "fix(quran): repair Onudhabon reader syntax"
          git push origin HEAD:fix/prayer-completion-tracker