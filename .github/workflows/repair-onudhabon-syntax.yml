name: One-time repair Onudhabon syntax

on:
  push:
    paths:
      - '.github/workflows/repair-onudhabon-syntax.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
      - name: Repair malformed Onudhabon reader blocks
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/quran/onudhabon_quran_reader.dart')
          text = p.read_text(encoding='utf-8')
          old = """          Container(width: double.infinity, padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: primary.withValues(alpha: .035), borderRadius: BorderRadius.circular(14)), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(_tafsirTitle, style: TextStyle(fontSize: 11.5, fontWeight: FontWeight.w800, color: primary)), const SizedBox(height: 6), Text(tafsir, style: const TextStyle(fontSize: 13.5, height: 1.55))])),"""
          new = """          Container(
            width: double.infinity,
            padding: const EdgeInsets.all(12),
            decoration: BoxDecoration(
              color: primary.withValues(alpha: .035),
              borderRadius: BorderRadius.circular(14),
            ),
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text(
                  _tafsirTitle,
                  style: TextStyle(
                    fontSize: 11.5,
                    fontWeight: FontWeight.w800,
                    color: primary,
                  ),
                ),
                const SizedBox(height: 6),
                Text(
                  tafsir,
                  style: const TextStyle(fontSize: 13.5, height: 1.55),
                ),
              ],
            ),
          ),"""
          if old not in text:
              raise SystemExit('Expected Tafsir block not found; refusing to modify file.')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='')
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/quran/onudhabon_quran_reader.dart
          git commit -m 'fix(quran): repair Onudhabon tafsir card syntax'
          git push origin HEAD:fix/prayer-completion-tracker
          git rm .github/workflows/repair-onudhabon-syntax.yml
          git commit -m 'chore: remove one-time syntax repair workflow'
          git push origin HEAD:fix/prayer-completion-tracker
