name: Repair Seconds Display

on:
  push:
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 0

      - name: Patch seconds display
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, count=1, required=True):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  if required:
                      raise SystemExit(f'Pattern not found in {path}: {old[:160]}')
                  return
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # Controller keeps second precision available to UI.
          replace(
              'lib/controllers/prayer_controller.dart',
              "String _formatTime(DateTime value) => DateFormat('hh:mm a').format(value);",
              "String _formatTime(DateTime value) => DateFormat('hh:mm:ss a').format(value);",
              required=False,
          )

          # Active Home Screen: one setting controls every visible clock/time.
          replace(
              'lib/screens/simple_home_screen.dart',
              "String _clock() {\n    final hour = _now.hour % 12 == 0 ? 12 : _now.hour % 12;\n    final minute = _now.minute.toString().padLeft(2, '0');\n    final second = _now.second.toString().padLeft(2, '0');\n    return '$hour:$minute:$second ${_now.hour >= 12 ? 'PM' : 'AM'}';\n  }",
              "String _clock(bool showSeconds) {\n    final hour = _now.hour % 12 == 0 ? 12 : _now.hour % 12;\n    final minute = _now.minute.toString().padLeft(2, '0');\n    final second = _now.second.toString().padLeft(2, '0');\n    final base = '$hour:$minute';\n    return showSeconds ? '$base:$second ${_now.hour >= 12 ? 'PM' : 'AM'}' : '$base ${_now.hour >= 12 ? 'PM' : 'AM'}';\n  }\n\n  String _displayTime(String value, bool showSeconds) {\n    if (showSeconds) return value;\n    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(value.trim());\n    return match?.group(1) ?? value;\n  }",
              required=False,
          )
          replace('lib/screens/simple_home_screen.dart', 'clock: _clock(),', 'clock: _clock(settings.showSeconds),', required=False)
          replace('lib/screens/simple_home_screen.dart', 'nextPrayerTime: controller.nextPrayerTime,', 'nextPrayerTime: _displayTime(controller.nextPrayerTime, settings.showSeconds),', required=False)
          replace('lib/screens/simple_home_screen.dart', 'remaining: controller.timeRemainingForNextPrayer,', 'remaining: _displayTime(controller.timeRemainingForNextPrayer, settings.showSeconds),', required=False)
          replace('lib/screens/simple_home_screen.dart', 'sunrise: controller.sunriseTime,', 'sunrise: _displayTime(controller.sunriseTime, settings.showSeconds),', required=False)
          replace('lib/screens/simple_home_screen.dart', 'sunset: controller.sunsetTime,', 'sunset: _displayTime(controller.sunsetTime, settings.showSeconds),', required=False)
          replace('lib/screens/simple_home_screen.dart', '_PrayerStrip(prayers: prayers, languageCode: languageCode),', '_PrayerStrip(prayers: prayers, languageCode: languageCode, showSeconds: settings.showSeconds),', required=False)
          replace(
              'lib/screens/simple_home_screen.dart',
              "const _PrayerStrip({required this.prayers, required this.languageCode});\n\n  final List<Map<String, dynamic>> prayers;\n  final String languageCode;",
              "const _PrayerStrip({required this.prayers, required this.languageCode, required this.showSeconds});\n\n  final List<Map<String, dynamic>> prayers;\n  final String languageCode;\n  final bool showSeconds;",
              required=False,
          )
          replace(
              'lib/screens/simple_home_screen.dart',
              "final time = prayer['start']?.toString() ?? '--:--';",
              "final rawTime = prayer['start']?.toString() ?? '--:--';\n        final time = showSeconds ? rawTime : (RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(rawTime.trim())?.group(1) ?? rawTime);",
              required=False,
          )
          replace(
              'lib/screens/simple_home_screen.dart',
              "sunrise: controller.sunriseTime,\n                sunset: controller.sunsetTime,",
              "sunrise: _displayTime(controller.sunriseTime, settings.showSeconds),\n                sunset: _displayTime(controller.sunsetTime, settings.showSeconds),",
              required=False,
          )

          # Prayer Screen: all displayed prayer times follow showSeconds.
          replace(
              'lib/screens/prayer_screen_v2.dart',
              "Expanded(child: _mini(context, Icons.play_arrow_rounded, _label(context, 'শুরু', 'Start'), c.currentPrayerStart)),\n              const SizedBox(width: 8),\n              Expanded(child: _mini(context, Icons.stop_rounded, _label(context, 'শেষ', 'End'), c.currentPrayerEnd)),\n              const SizedBox(width: 8),\n              Expanded(child: _mini(context, Icons.groups_rounded, _label(context, 'জামাত', 'Jamaat'), c.currentIqamahTime)),",
              "Expanded(child: _mini(context, Icons.play_arrow_rounded, _label(context, 'শুরু', 'Start'), _displayTime(settings, c.currentPrayerStart))),\n              const SizedBox(width: 8),\n              Expanded(child: _mini(context, Icons.stop_rounded, _label(context, 'শেষ', 'End'), _displayTime(settings, c.currentPrayerEnd))),\n              const SizedBox(width: 8),\n              Expanded(child: _mini(context, Icons.groups_rounded, _label(context, 'জামাত', 'Jamaat'), _displayTime(settings, c.currentIqamahTime))),",
              required=False,
          )
          replace('lib/screens/prayer_screen_v2.dart', '_previousNextPrayerRow(context, c),', '_previousNextPrayerRow(context, c, settings),', required=False)
          replace('lib/screens/prayer_screen_v2.dart', 'Widget _previousNextPrayerRow(BuildContext context, PrayerController c) {', 'Widget _previousNextPrayerRow(BuildContext context, PrayerController c, SettingsProvider settings) {', required=False)
          replace('lib/screens/prayer_screen_v2.dart', "time: c.previousPrayerTime.trim().isEmpty ? '--:--' : c.previousPrayerTime,", "time: c.previousPrayerTime.trim().isEmpty ? '--:--' : _displayTime(settings, c.previousPrayerTime),", required=False)
          replace('lib/screens/prayer_screen_v2.dart', 'time: c.nextPrayerTime,', 'time: _displayTime(settings, c.nextPrayerTime),', required=False)
          replace('lib/screens/prayer_screen_v2.dart', "Widget _importantTimes(BuildContext context, PrayerController c) {\n    final primary = Theme.of(context).colorScheme.primary;", "Widget _importantTimes(BuildContext context, PrayerController c) {\n    final primary = Theme.of(context).colorScheme.primary;\n    final settings = context.watch<SettingsProvider>();", required=False)
          replace('lib/screens/prayer_screen_v2.dart', 'c.sunriseTime, primary)),', '_displayTime(settings, c.sunriseTime), primary)),', required=False)
          replace('lib/screens/prayer_screen_v2.dart', "_label(context, 'জাওয়াল / মধ্যাহ্ন', 'Zawal / Noon'), c.solarNoonTime, primary", "_label(context, 'জাওয়াল / মধ্যাহ্ন', 'Zawal / Noon'), _displayTime(settings, c.solarNoonTime), primary", required=False)
          replace('lib/screens/prayer_screen_v2.dart', "_label(context, 'সূর্যাস্ত', 'Sunset'), c.sunsetTime, primary", "_label(context, 'সূর্যাস্ত', 'Sunset'), _displayTime(settings, c.sunsetTime), primary", required=False)
          replace('lib/screens/prayer_screen_v2.dart', "Text(DateFormat('hh:mm:ss a').format(_now), style: TextStyle(color: primary, fontSize: 11.5, fontWeight: FontWeight.w800)),", "Text(DateFormat(settings.showSeconds ? 'hh:mm:ss a' : 'hh:mm a').format(_now), style: TextStyle(color: primary, fontSize: 11.5, fontWeight: FontWeight.w800)),", required=False)
          replace('lib/screens/prayer_screen_v2.dart', "Widget _todaySalah(BuildContext context, PrayerController c, bool friday) {\n    final primary = Theme.of(context).colorScheme.primary;", "Widget _todaySalah(BuildContext context, PrayerController c, bool friday) {\n    final primary = Theme.of(context).colorScheme.primary;\n    final settings = context.watch<SettingsProvider>();", required=False)
          replace('lib/screens/prayer_screen_v2.dart', "final time = source?['start']?.toString() ?? '--:--';\n              final end = source?['end']?.toString() ?? '';", "final time = _displayTime(settings, source?['start']?.toString() ?? '--:--');\n              final end = _displayTime(settings, source?['end']?.toString() ?? '');", required=False)
          replace('lib/screens/prayer_screen_v2.dart', 'String _withoutSeconds(String value) {', "String _displayTime(SettingsProvider settings, String value) {\n    if (settings.showSeconds) return value;\n    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(value.trim());\n    return match?.group(1) ?? value;\n  }\n\n  String _withoutSeconds(String value) {", required=False)
          replace('lib/screens/prayer_screen_v2.dart', "Text(item['time'] as String,", "Text(_displayTime(context.read<SettingsProvider>(), item['time'] as String,", required=False)

          # Special-times card: seconds setting controls both ranges and active countdown.
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "import '../../controllers/prayer_controller.dart';", "import '../../controllers/prayer_controller.dart';\nimport '../../providers/settings_provider.dart';", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "final match = RegExp(r'^(\\d{1,2}):(\\d{2})\\s*(AM|PM)$', caseSensitive: false).firstMatch(value.trim());", "final match = RegExp(r'^(\\d{1,2}):(\\d{2})(?::(\\d{2}))?\\s*(AM|PM)$', caseSensitive: false).firstMatch(value.trim());", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "final minute = int.tryParse(match.group(2)!) ?? -1;", "final minute = int.tryParse(match.group(2)!) ?? -1;\n    final second = int.tryParse(match.group(3) ?? '0') ?? 0;", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "return DateTime(now.year, now.month, now.day, hour, minute);", "return DateTime(now.year, now.month, now.day, hour, minute, second);", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "String _time(DateTime value) {", "String _time(DateTime value, bool showSeconds) {", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "return '$hour:${value.minute.toString().padLeft(2, '0')} ${value.hour >= 12 ? 'PM' : 'AM'}';", "final minute = value.minute.toString().padLeft(2, '0');\n    final second = value.second.toString().padLeft(2, '0');\n    final base = '$hour:$minute';\n    return showSeconds ? '$base:$second ${value.hour >= 12 ? 'PM' : 'AM'}' : '$base ${value.hour >= 12 ? 'PM' : 'AM'}';", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "String _remaining(DateTime end, DateTime now) {", "String _remaining(DateTime end, DateTime now, bool showSeconds) {", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "return h > 0 ? '${h.toString().padLeft(2, '0')}:${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}' : '${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}';", "if (!showSeconds) return '${h.toString().padLeft(2, '0')}:${m.toString().padLeft(2, '0')}';\n    return '${h.toString().padLeft(2, '0')}:${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}';", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "final now = DateTime.now();\n    final sunrise = _parse(c.sunriseTime);", "final now = DateTime.now();\n    final showSeconds = context.watch<SettingsProvider>().showSeconds;\n    final sunrise = _parse(c.sunriseTime);", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "_group(_label('নিষিদ্ধ সময়', 'Prohibited Times', 'أوقات النهي'), prohibited, now, warning, text, secondary),", "_group(_label('নিষিদ্ধ সময়', 'Prohibited Times', 'أوقات النهي'), prohibited, now, warning, text, secondary, showSeconds),", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "_group(_label('মাকরূহ সময়', 'Makruh Times', 'أوقات الكراهة'), makruh, now, primary, text, secondary),", "_group(_label('মাকরূহ সময়', 'Makruh Times', 'أوقات الكراهة'), makruh, now, primary, text, secondary, showSeconds),", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "Widget _group(String title, List<_Restriction> items, DateTime now, Color accent, Color text, Color secondary) {", "Widget _group(String title, List<_Restriction> items, DateTime now, Color accent, Color text, Color secondary, bool showSeconds) {", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "Text('${_time(item.start)} – ${_time(item.end)}'", "Text('${_time(item.start, showSeconds)} – ${_time(item.end, showSeconds)}'", required=False)
          replace('lib/widgets/prayer/prayer_special_times_detail_card.dart', "Text(_remaining(item.end, now),", "Text(_remaining(item.end, now, showSeconds),", required=False)

          print('seconds-display patch applied')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/controllers/prayer_controller.dart lib/screens/simple_home_screen.dart lib/screens/prayer_screen_v2.dart lib/widgets/prayer/prayer_special_times_detail_card.dart
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Prayer: sync all seconds displays with settings"
          git push origin HEAD:fix/prayer-completion-tracker
          rm -f .github/workflows/repair-seconds-display.yml
          git add .github/workflows/repair-seconds-display.yml
          git commit -m "CI: remove temporary seconds repair workflow"
          git push origin HEAD:fix/prayer-completion-tracker
