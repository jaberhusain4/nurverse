name: Repair time display
on:
  push:
    paths:
      - '.github/workflows/repair-time-display.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Apply focused time-display fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('lib/screens/simple_home_screen.dart')
          s = home.read_text()

          old = """  List<Map<String, dynamic>> _fivePrayers(PrayerController controller) {\n    const keys = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];\n    final result = <Map<String, dynamic>>[];\n    for (final key in keys) {\n      for (final prayer in controller.prayers) {\n        final name = (prayer['name'] ?? '').toString().toLowerCase();\n        final nameBn = (prayer['nameBn'] ?? '').toString().toLowerCase();\n        final match = name.contains(key.toLowerCase()) ||\n            (key == 'Fajr' && nameBn.contains('ফজর')) ||\n            (key == 'Dhuhr' &&\n                (nameBn.contains('যোহর') || nameBn.contains('জুমু'))) ||\n            (key == 'Asr' && nameBn.contains('আসর')) ||\n            (key == 'Maghrib' && nameBn.contains('মাগরিব')) ||\n            (key == 'Isha' && nameBn.contains('ইশা'));\n        if (match) {\n          result.add(prayer);\n          break;\n        }\n      }\n    }\n    return result;\n  }"""
          new = """  List<Map<String, dynamic>> _fivePrayers(PrayerController controller) {\n    final result = controller.prayers\n        .where((prayer) => prayer['category']?.toString() == 'obligatory')\n        .take(5)\n        .toList();\n    return result;\n  }"""
          if old not in s:
              raise SystemExit('home prayer list block not found')
          s = s.replace(old, new)

          # Only live clock/countdown uses seconds on Home. Prayer start times and sunrise/sunset are static.
          s = s.replace("nextPrayerTime: _displayTime(controller.nextPrayerTime, settings.showSeconds),", "nextPrayerTime: _displayTime(controller.nextPrayerTime, false),")
          s = s.replace("sunrise: _displayTime(controller.sunriseTime, settings.showSeconds),", "sunrise: _displayTime(controller.sunriseTime, false),")
          s = s.replace("sunset: _displayTime(controller.sunsetTime, settings.showSeconds),", "sunset: _displayTime(controller.sunsetTime, false),")
          s = s.replace("sunrise: _displayTime(controller.sunriseTime, settings.showSeconds),", "sunrise: _displayTime(controller.sunriseTime, false),")
          s = s.replace("sunset: _displayTime(controller.sunsetTime, settings.showSeconds),", "sunset: _displayTime(controller.sunsetTime, false),")
          home.write_text(s)

          strip = Path('lib/screens/simple_home_screen.dart')
          s = strip.read_text()
          old = """        final rawTime = prayer['start']?.toString() ?? '--:--';\n        final time = showSeconds ? rawTime : (RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(rawTime.trim())?.group(1) ?? rawTime);"""
          new = """        final rawTime = prayer['start']?.toString() ?? '--:--';\n        final time = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(rawTime.trim())?.group(1) ?? rawTime;"""
          if old not in s:
              raise SystemExit('home strip time block not found')
          s = s.replace(old, new)
          s = s.replace("_DateFooter(\n                englishDate: DateService.englishDate(),\n                sunrise: _displayTime(controller.sunriseTime, settings.showSeconds),\n                sunset: _displayTime(controller.sunsetTime, settings.showSeconds),", "_DateFooter(\n                englishDate: DateService.englishDate(),\n                sunrise: _displayTime(controller.sunriseTime, false),\n                sunset: _displayTime(controller.sunsetTime, false),")
          strip.write_text(s)

          prayer = Path('lib/screens/prayer_screen_v2.dart')
          p = prayer.read_text()
          old = """  String _displayTime(SettingsProvider settings, String value) {\n    if (settings.showSeconds) return value;\n    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(value.trim());\n    return match?.group(1) ?? value;\n  }"""
          new = """  // Prayer start/end/Jamaat and other scheduled times are static; seconds are only\n  // meaningful for live clocks and active countdowns.\n  String _displayTime(SettingsProvider settings, String value) {\n    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(value.trim());\n    return match?.group(1) ?? value;\n  }"""
          if old not in p:
              raise SystemExit('prayer display helper not found')
          p = p.replace(old, new)
          prayer.write_text(p)

          detail = Path('lib/widgets/prayer/prayer_special_times_detail_card.dart')
          d = detail.read_text()
          d = d.replace("_time(item.start, showSeconds)", "_time(item.start, false)")
          d = d.replace("_time(item.end, showSeconds)", "_time(item.end, false)")
          detail.write_text(d)
          PY

      - name: Format and analyze affected files
        run: |
          dart format lib/screens/simple_home_screen.dart lib/screens/prayer_screen_v2.dart lib/widgets/prayer/prayer_special_times_detail_card.dart
          flutter analyze lib/screens/simple_home_screen.dart lib/screens/prayer_screen_v2.dart lib/widgets/prayer/prayer_special_times_detail_card.dart

      - name: Commit repaired files and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/simple_home_screen.dart lib/screens/prayer_screen_v2.dart lib/widgets/prayer/prayer_special_times_detail_card.dart
          git commit -m 'Fix live countdown seconds and static prayer times' || true
          git rm .github/workflows/repair-time-display.yml
          git commit -m 'chore: remove temporary time display repair workflow'
          git push