name: Repair time display
on:
  push:
    paths:
      - '.github/workflows/repair-time-display.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Apply focused time-display fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('lib/screens/simple_home_screen.dart')
          s = home.read_text()
          s = s.replace("import 'dart:ui';\n", "")

          old = """  List<Map<String, dynamic>> _fivePrayers(PrayerController controller) {
    const keys = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    final result = <Map<String, dynamic>>[];
    for (final key in keys) {
      for (final prayer in controller.prayers) {
        final name = (prayer['name'] ?? '').toString().toLowerCase();
        final nameBn = (prayer['nameBn'] ?? '').toString().toLowerCase();
        final match = name.contains(key.toLowerCase()) ||
            (key == 'Fajr' && nameBn.contains('ফজর')) ||
            (key == 'Dhuhr' &&
                (nameBn.contains('যোহর') || nameBn.contains('জুমু'))) ||
            (key == 'Asr' && nameBn.contains('আসর')) ||
            (key == 'Maghrib' && nameBn.contains('মাগরিব')) ||
            (key == 'Isha' && nameBn.contains('ইশা'));
        if (match) {
          result.add(prayer);
          break;
        }
      }
    }
    return result;
  }"""
          new = """  List<Map<String, dynamic>> _fivePrayers(PrayerController controller) {
    final result = controller.prayers
        .where((prayer) => prayer['category']?.toString() == 'obligatory')
        .take(5)
        .toList();
    return result;
  }"""
          if old not in s:
              raise SystemExit('home prayer list block not found')
          s = s.replace(old, new)

          s = s.replace("nextPrayerTime: _displayTime(controller.nextPrayerTime, settings.showSeconds),", "nextPrayerTime: _displayTime(controller.nextPrayerTime, false),")
          s = s.replace("sunrise: _displayTime(controller.sunriseTime, settings.showSeconds),", "sunrise: _displayTime(controller.sunriseTime, false),")
          s = s.replace("sunset: _displayTime(controller.sunsetTime, settings.showSeconds),", "sunset: _displayTime(controller.sunsetTime, false),")
          s = s.replace("_DateFooter(\n                englishDate: DateService.englishDate(),\n                sunrise: _displayTime(controller.sunriseTime, settings.showSeconds),\n                sunset: _displayTime(controller.sunsetTime, settings.showSeconds),", "_DateFooter(\n                englishDate: DateService.englishDate(),\n                sunrise: _displayTime(controller.sunriseTime, false),\n                sunset: _displayTime(controller.sunsetTime, false),")
          s = re.sub(r"(?<![=!])!(?=[.\[])", "", s)
          home.write_text(s)

          prayer = Path('lib/screens/prayer_screen_v2.dart')
          p = prayer.read_text()
          old = """  String _displayTime(SettingsProvider settings, String value) {
    if (settings.showSeconds) return value;
    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(value.trim());
    return match?.group(1) ?? value;
  }"""
          new = """  // Scheduled prayer times are static; live clocks and active countdowns
  // are the only displays where seconds are meaningful.
  String _displayTime(SettingsProvider settings, String value) {
    final match = RegExp(r'^(\\d{1,2}:\\d{2})').firstMatch(value.trim());
    return match?.group(1) ?? value;
  }"""
          if old not in p:
              raise SystemExit('prayer display helper not found')
          p = p.replace(old, new)
          prayer.write_text(p)

          detail = Path('lib/widgets/prayer/prayer_special_times_detail_card.dart')
          d = detail.read_text()
          d = d.replace("_time(item.start, showSeconds)", "_time(item.start, false)")
          d = d.replace("_time(item.end, showSeconds)", "_time(item.end, false)")
          detail.write_text(d)
          PY

      - name: Format and analyze affected files
        run: |
          dart format lib/screens/simple_home_screen.dart lib/screens/prayer_screen_v2.dart lib/widgets/prayer/prayer_special_times_detail_card.dart
          flutter pub get
          flutter analyze lib/screens/simple_home_screen.dart lib/screens/prayer_screen_v2.dart lib/widgets/prayer/prayer_special_times_detail_card.dart

      - name: Commit repaired files and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/simple_home_screen.dart lib/screens/prayer_screen_v2.dart lib/widgets/prayer/prayer_special_times_detail_card.dart
          git commit -m 'Fix live countdown seconds and static prayer times' || true
          git rm .github/workflows/repair-time-display.yml
          git commit -m 'chore: remove temporary time display repair workflow'
          git push