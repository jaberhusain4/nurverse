name: Repair Time Format Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair source syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prayer = Path('lib/screens/prayer_screen_v2.dart')
          text = prayer.read_text(encoding='utf-8')
          text = text.replace("Jumu\\\\'ah", "Jumu'ah")
          prayer.write_text(text, encoding='utf-8')

          controller = Path('lib/controllers/prayer_controller.dart')
          text = controller.read_text(encoding='utf-8')
          replacements = {
              "DateTime asr = _applyPrayerAdjustment('Asr', _safeTime(prayerTimes.asr, dhuhr.add(const Duration(hours: 4)));": "DateTime asr = _applyPrayerAdjustment('Asr', _safeTime(prayerTimes.asr, dhuhr.add(const Duration(hours: 4))));",
              "DateTime maghrib = _applyPrayerAdjustment('Maghrib', _safeTime(prayerTimes.maghrib, asr.add(const Duration(hours: 4)));": "DateTime maghrib = _applyPrayerAdjustment('Maghrib', _safeTime(prayerTimes.maghrib, asr.add(const Duration(hours: 4))));",
              "DateTime isha = _applyPrayerAdjustment('Isha', _safeTime(prayerTimes.isha, maghrib.add(const Duration(hours: 1, minutes: 30)));": "DateTime isha = _applyPrayerAdjustment('Isha', _safeTime(prayerTimes.isha, maghrib.add(const Duration(hours: 1, minutes: 30))));",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected controller syntax fragment not found: {old}')
              text = text.replace(old, new, 1)
          controller.write_text(text, encoding='utf-8')
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/prayer_screen_v2.dart lib/controllers/prayer_controller.dart
          git commit -m "Repair prayer source syntax"
          git push
