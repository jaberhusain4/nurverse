name: Restore Prayer Special Times Card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore detailed special-times card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/prayer_screen.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import '../widgets/prayer/prayer_special_times_detail_card.dart';"
          if import_line not in text:
              anchor = "import '../widgets/home/top_header.dart';\n"
              if anchor not in text:
                  raise SystemExit('Could not find import anchor in prayer_screen.dart')
              text = text.replace(anchor, anchor + import_line + "\n", 1)

          card = "PrayerSpecialTimesDetailCard(languageCode: languageCode),"
          if card not in text:
              anchor = "              _importantTimes(context, l10n, controller, primary, sunTimes),\n              const SizedBox(height: 16),\n              _sectionHeader(context, primary, Icons.nightlight_round, l10n.naflAndOtherPrayers),"
              replacement = "              _importantTimes(context, l10n, controller, primary, sunTimes),\n              const SizedBox(height: 10),\n              PrayerSpecialTimesDetailCard(languageCode: languageCode),\n              const SizedBox(height: 16),\n              _sectionHeader(context, primary, Icons.nightlight_round, l10n.naflAndOtherPrayers),"
              if anchor not in text:
                  raise SystemExit('Could not find Prayer Screen insertion anchor')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- lib/screens/prayer_screen.dart

      - name: Fix prayer method and madhhab selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          provider = Path('lib/providers/settings_provider.dart')
          s = provider.read_text(encoding='utf-8')
          old = "  static const List<String> madhabs = ['Hanafi', 'Shafi'];"
          new = """  static const List<String> madhabs = [
            'Hanafi',
            'Shafi',
            'Maliki',
            'Hanbali',
          ];"""
          if old in s:
              s = s.replace(old, new, 1)

          pattern = r"  String _normalizeMadhab\(String value\) \{.*?\n  \}"
          replacement = """  String _normalizeMadhab(String value) {
            switch (value.trim().toLowerCase()) {
              case 'shafi':
              case 'shafii':
              case 'shafi’i':
              case \"shafi'i\":
                return 'Shafi';
              case 'maliki':
                return 'Maliki';
              case 'hanbali':
                return 'Hanbali';
              case 'hanafi':
                return 'Hanafi';
              default:
                return 'Hanafi';
            }
          }"""
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected _normalizeMadhab function was not found')
          provider.write_text(s, encoding='utf-8')

          config = Path('lib/services/prayer_calculation_config.dart')
          c = config.read_text(encoding='utf-8')
          pattern = r"  static Madhab _parseMadhab\(String value\) \{.*?\n  \}"
          replacement = """  static Madhab _parseMadhab(String value) {
            final String normalized = value.trim().toLowerCase();

            switch (normalized) {
              case 'hanafi':
                return Madhab.hanafi;
              case 'shafi':
              case 'shafii':
              case 'shafi’i':
              case \"shafi'i\":
              case 'maliki':
              case 'hanbali':
              case 'standard':
                // Adhan exposes the one-shadow Asr rule as Madhab.shafi;
                // Maliki and Hanbali use the same practical Asr rule here.
                return Madhab.shafi;
              default:
                return Madhab.hanafi;
            }
          }"""
          c, count = re.subn(pattern, replacement, c, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected _parseMadhab function was not found')
          config.write_text(c, encoding='utf-8')

          screen = Path('lib/screens/settings_hub_screen_v4.dart')
          s = screen.read_text(encoding='utf-8')
          s = s.replace("    'Hanafi': 'حنفي',\n    'Shafi': 'شافعي',", "    'Hanafi': 'حنفي',\n    'Shafi': 'شافعي',\n    'Maliki': 'مالكي',\n    'Hanbali': 'حنبلي',", 1)
          s = s.replace("      'Hanafi': 'হানাফি',\n      'Shafi': 'শাফেয়ী',", "      'Hanafi': 'হানাফি',\n      'Shafi': 'শাফেয়ী',\n      'Maliki': 'মালিকি',\n      'Hanbali': 'হাম্বলি',", 1)

          start = s.index('  Future<void> _showChoiceSheet(')
          end = s.index('  Future<void> _showTextSizeSheet(', start)
          fixed = r'''  Future<void> _showChoiceSheet(BuildContext context, String title,
      List<String> options, Future<void> Function(String) onSelected,
      {String? selectedValue}) async {
    final languageCode = Localizations.localeOf(context).languageCode;
    final isEnglish = languageCode == 'en';
    final isArabic = languageCode == 'ar';
    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      showDragHandle: true,
      builder: (sheetContext) => SafeArea(
        child: ConstrainedBox(
          constraints: BoxConstraints(
            maxHeight: MediaQuery.sizeOf(sheetContext).height * .78,
          ),
          child: Column(
            children: [
              Padding(
                padding: const EdgeInsets.fromLTRB(18, 8, 18, 12),
                child: Text(
                  title,
                  style: Theme.of(sheetContext)
                      .textTheme
                      .titleLarge
                      ?.copyWith(fontWeight: FontWeight.w900),
                ),
              ),
              Expanded(
                child: ListView.builder(
                  physics: const BouncingScrollPhysics(),
                  itemCount: options.length,
                  itemBuilder: (_, index) {
                    final option = options[index];
                    final label = options.length == 3 &&
                            options.contains('bn') &&
                            options.contains('en') &&
                            options.contains('ar')
                        ? (isEnglish
                            ? ({
                                  'bn': 'Bangla',
                                  'en': 'English',
                                  'ar': 'Arabic',
                                }[option] ?? option)
                            : (isArabic
                                ? ({
                                      'bn': 'البنغالية',
                                      'en': 'الإنجليزية',
                                      'ar': 'العربية',
                                    }[option] ?? option)
                                : ({
                                      'bn': 'বাংলা',
                                      'en': 'ইংরেজি',
                                      'ar': 'আরবি',
                                    }[option] ?? option)))
                        : _choiceLabel(option, languageCode);

                    return ListTile(
                      title: Text(label),
                      trailing: option == selectedValue
                          ? const Icon(
                              Icons.check_circle_rounded,
                              color: AppColors.seaBlue,
                            )
                          : null,
                      onTap: () async {
                        await onSelected(option);
                        if (sheetContext.mounted) {
                          Navigator.pop(sheetContext);
                        }
                      },
                    );
                  },
                ),
              ),
              const SizedBox(height: 8),
            ],
          ),
        ),
      ),
    );
  }

'''
          s = s[:start] + fixed + s[end:]
          screen.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/prayer_screen.dart lib/providers/settings_provider.dart lib/services/prayer_calculation_config.dart lib/screens/settings_hub_screen_v4.dart
          if git diff --cached --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git commit -m "fix: restore detailed prayer special times card and settings selectors"
          git push origin HEAD:main
