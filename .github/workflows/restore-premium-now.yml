name: Restore Premium Account UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/restore_premium_account.py'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Apply verified Premium restoration
        run: python3 tools/restore_premium_account.py
      - name: Format
        run: dart format lib/screens/canonical_settings_screen.dart
      - name: Verify
        run: flutter pub get && flutter analyze --no-fatal-infos lib/screens/canonical_settings_screen.dart
      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/canonical_settings_screen.dart
          git diff --cached --quiet || git commit -m 'fix(settings): restore premium account login logout UI'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/restore-premium-now.yml
          git commit -m 'chore: remove one-time premium restoration workflow'
          git push
