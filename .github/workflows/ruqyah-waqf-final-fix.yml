name: Ruqyah Waqf Final Fix

on:
  push:
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dua renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/tools/ruqyah_screen.dart')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "arabic: '''بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ''',",
              "arabic: '''بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ''',",
              1,
          )

          old = '''          child: Directionality(\n            textDirection: TextDirection.rtl,\n            child: Text.rich(\n              TextSpan(\n                children: [\n                  TextSpan(\n                    text: '${widget.item.arabic.trim()}  ۝',\n                    style: const TextStyle(\n                      fontFamily: 'IndoPakQuran',\n                      fontSize: 20,\n                      height: 1.65,\n                      fontWeight: FontWeight.w500,\n                    ),\n                  ),\n                ],\n              ),\n              textAlign: TextAlign.right,\n            ),\n          ),'''

          new = '''          child: Directionality(\n            textDirection: TextDirection.rtl,\n            child: Row(\n              mainAxisAlignment: MainAxisAlignment.end,\n              crossAxisAlignment: CrossAxisAlignment.end,\n              children: [\n                Flexible(\n                  child: Text(\n                    widget.item.arabic.trim(),\n                    textAlign: TextAlign.right,\n                    textDirection: TextDirection.rtl,\n                    style: const TextStyle(\n                      fontFamily: 'IndoPakQuran',\n                      fontSize: 20,\n                      height: 1.65,\n                      fontWeight: FontWeight.w500,\n                    ),\n                  ),\n                ),\n                const SizedBox(width: 6),\n                Container(\n                  width: 21,\n                  height: 21,\n                  margin: const EdgeInsets.only(bottom: 5),\n                  decoration: BoxDecoration(\n                    shape: BoxShape.circle,\n                    border: Border.all(\n                      color: primary.withValues(alpha: .72),\n                      width: 1.4,\n                    ),\n                  ),\n                ),\n              ],\n            ),\n          ),'''

          if old not in s:
              raise SystemExit('Final dua renderer block not found; refusing unsafe rewrite.')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/tools/ruqyah_screen.dart
          git commit -m "Fix Ruqyah dua end marker rendering"
          git push

      - name: Cleanup
        if: always()
        run: |
          git rm -f .github/workflows/ruqyah-waqf-final-fix.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary Ruqyah waqf fix workflow"
          git push
