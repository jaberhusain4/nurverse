name: One-shot Ruqyah Waqf Fix

on:
  push:
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[ruqyah-waqf-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace custom circle-dot with Quran font waqf glyph
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/screens/tools/ruqyah_screen.dart')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"class _RuqyahWaqfPainter extends CustomPainter \{.*?\n\}\n\nclass _RuqyahDetailScreenState",
              re.S,
          )

          replacement = '''class _RuqyahWaqfPainter extends CustomPainter {
  final Color color;
  const _RuqyahWaqfPainter(this.color);

  @override
  void paint(Canvas canvas, Size size) {
    final textPainter = TextPainter(
      text: TextSpan(
        text: '۝',
        style: TextStyle(
          fontFamily: 'IndoPakQuran',
          color: color,
          fontSize: size.shortestSide * .82,
          height: 1,
        ),
      ),
      textDirection: TextDirection.ltr,
    )..layout(maxWidth: size.width);

    final offset = Offset(
      (size.width - textPainter.width) / 2,
      (size.height - textPainter.height) / 2,
    );
    textPainter.paint(canvas, offset);
  }

  @override
  bool shouldRepaint(covariant _RuqyahWaqfPainter oldDelegate) =>
      oldDelegate.color != color;
}

class _RuqyahDetailScreenState'''

          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly one waqf painter block, found {count}')

          path.write_text(updated, encoding='utf-8')
      - name: Remove one-shot trigger artifacts
        run: |
          rm -f .github/ruqyah-waqf-trigger.txt .github/workflows/ruqyah-waqf-fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/tools/ruqyah_screen.dart .github/ruqyah-waqf-trigger.txt .github/workflows/ruqyah-waqf-fix.yml
          git commit -m "fix: use Quran waqf glyph for Ruqyah dua [ruqyah-waqf-fixed]"
          git push