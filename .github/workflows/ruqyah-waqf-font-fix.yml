name: One-shot Ruqyah Waqf Font Fix

on:
  push:
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[ruqyah-waqf-font-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use bundled Arabic font for Qur'anic waqf glyph
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/tools/ruqyah_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = "text: '  ۝',\n                    style: TextStyle(\n                      fontSize: 13.5,"
          new = "text: '  ۝',\n                    style: TextStyle(\n                      fontFamily: 'NotoNaskhArabic',\n                      fontSize: 13.5,"
          if old not in text:
              raise SystemExit('Expected Ruqyah waqf TextSpan was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove temporary workflow and trigger files
        run: |
          rm -f .github/workflows/ruqyah-waqf-font-fix.yml .github/ruqyah-waqf-font-trigger.txt

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/tools/ruqyah_screen.dart .github/workflows/ruqyah-waqf-font-fix.yml .github/ruqyah-waqf-font-trigger.txt
          git commit -m "fix: render Ruqyah waqf with bundled Arabic font [ruqyah-waqf-font-fixed]"
          git push
