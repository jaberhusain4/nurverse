name: Ruqyah Waqf PR Fix

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Apply exact Quran-style dua marker
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/screens/tools/ruqyah_screen.dart')
          s = p.read_text(encoding='utf-8')

          old = '''          child: Directionality(\n            textDirection: TextDirection.rtl,\n            child: Row(\n              mainAxisAlignment: MainAxisAlignment.end,\n              crossAxisAlignment: CrossAxisAlignment.end,\n              children: [\n                Flexible(\n                  child: Text(\n                    widget.item.arabic.trim(),\n                    textAlign: TextAlign.right,\n                    textDirection: TextDirection.rtl,\n                    style: const TextStyle(\n                      fontFamily: 'IndoPakQuran',\n                      fontSize: 20,\n                      height: 1.65,\n                      fontWeight: FontWeight.w500,\n                    ),\n                  ),\n                ),\n                const SizedBox(width: 6),\n                Container(\n                  width: 21,\n                  height: 21,\n                  margin: const EdgeInsets.only(bottom: 5),\n                  decoration: BoxDecoration(\n                    shape: BoxShape.circle,\n                    border: Border.all(\n                      color: primary.withValues(alpha: .72),\n                      width: 1.4,\n                    ),\n                  ),\n                ),\n              ],\n            ),\n          ),'''

          new = '''          child: Directionality(\n            textDirection: TextDirection.rtl,\n            child: Text.rich(\n              TextSpan(\n                children: [\n                  TextSpan(\n                    text: widget.item.arabic.trim(),\n                    style: const TextStyle(\n                      fontSize: 20,\n                      height: 1.58,\n                      fontWeight: FontWeight.w500,\n                    ),\n                  ),\n                  TextSpan(\n                    text: '  ۝',\n                    style: TextStyle(\n                      color: primary,\n                      fontSize: 13.5,\n                      fontWeight: FontWeight.w800,\n                    ),\n                  ),\n                ],\n              ),\n              textAlign: TextAlign.right,\n            ),\n          ),'''

          if old not in s:
              raise SystemExit('Expected old dua renderer not found; refusing unsafe rewrite.')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit PR-head patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/tools/ruqyah_screen.dart
          git commit -m "Fix Ruqyah dua marker to match Quran rendering"
          git push
