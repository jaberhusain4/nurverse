name: Ruqyah Waqf Surgical Patch

on:
  push:
    branches:
      - fix/prayer-completion-tracker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Ruqyah Arabic rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/tools/ruqyah_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_dua = "arabic: '''بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ ۝ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ۝ وَهُوَ السَّمِيعُ الْعَلِيمُ''',"
          new_dua = "arabic: '''بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ''',"

          if old_dua in text:
              text = text.replace(old_dua, new_dua, 1)

          old_build = '''          child: Directionality(\n            textDirection: TextDirection.rtl,\n            child: Row(\n              textDirection: TextDirection.rtl,\n              crossAxisAlignment: CrossAxisAlignment.center,\n              children: [\n                Expanded(\n                  child: Text(\n                    widget.item.arabic.trim(),\n                    textAlign: TextAlign.right,\n                    style: const TextStyle(\n                      fontSize: 20,\n                      height: 1.65,\n                      fontWeight: FontWeight.w500,\n                    ),\n                  ),\n                ),\n                const SizedBox(width: 8),\n                Container(\n                  width: 24,\n                  height: 24,\n                  decoration: BoxDecoration(\n                    shape: BoxShape.circle,\n                    border: Border.all(\n                      color: primary.withValues(alpha: .72),\n                      width: 1.4,\n                    ),\n                  ),\n                ),\n              ],\n            ),\n          ),'''

          new_build = '''          child: Directionality(\n            textDirection: TextDirection.rtl,\n            child: Text.rich(\n              TextSpan(\n                children: [\n                  TextSpan(\n                    text: widget.item.arabic.trim(),\n                    style: const TextStyle(\n                      fontSize: 20,\n                      height: 1.65,\n                      fontWeight: FontWeight.w500,\n                    ),\n                  ),\n                  WidgetSpan(\n                    alignment: PlaceholderAlignment.middle,\n                    child: Padding(\n                      padding: const EdgeInsetsDirectional.only(start: 7),\n                      child: Container(\n                        width: 21,\n                        height: 21,\n                        decoration: BoxDecoration(\n                          shape: BoxShape.circle,\n                          border: Border.all(\n                            color: primary.withValues(alpha: .72),\n                            width: 1.4,\n                          ),\n                        ),\n                      ),\n                    ),\n                  ),\n                ],\n              ),\n              textAlign: TextAlign.right,\n            ),\n          ),'''

          if old_build not in text:
              raise SystemExit('Expected current dua renderer block not found; refusing unsafe rewrite.')

          text = text.replace(old_build, new_build, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/tools/ruqyah_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix Ruqyah dua end waqf marker"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/ruqyah-waqf-surgical.yml || true
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary Ruqyah patch workflow"
          git push
