name: one-shot Arabic Settings cleanup
on:
  push:
    branches: [fix/prayer-completion-tracker]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean generated localization references
        run: python .github/settings_arabic_cleanup.py
      - name: Verify critical references
        run: |
          ! grep -n "settings\._t\|current\._t" lib/screens/settings_hub_screen_v4.dart
          ! grep -n "quranArabicFont == 'Default' && !isEnglish" lib/screens/settings_hub_screen_v4.dart
          grep -n "languageCode" lib/screens/settings_hub_screen_v4.dart | head -n 5
      - name: Commit and remove temporary fixer
        run: |
          git config user.name "nurverse-localization-bot"
          git config user.email "actions@github.com"
          git add lib/screens/settings_hub_screen_v4.dart
          git rm .github/settings_arabic_cleanup.py .github/workflows/settings_cleanup.yml
          git commit -m "fix: finalize Arabic Settings localization"
          git push
