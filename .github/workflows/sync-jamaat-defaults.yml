name: Sync Jamaat Defaults

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Jamaat synchronization
        shell: python
        run: |
          from pathlib import Path

          service = Path('lib/services/jamaat_service.dart')
          text = service.read_text(encoding='utf-8')
          text = text.replace("""  static const Map<String, String> _emptyValues = {
    'Fajr': '--:--',
    'Dhuhr': '--:--',
    'Asr': '--:--',
    'Maghrib': '--:--',
    'Isha': '--:--',
  };""", """  static const Map<String, String> _dhakaDefaults = {
    'Fajr': '5:00 AM',
    'Dhuhr': '1:30 PM',
    'Asr': '5:15 PM',
    'Maghrib': '6:57 PM',
    'Isha': '8:45 PM',
  };""")
          text = text.replace("static final Map<String, String> _jamaat = {..._emptyValues};", "static final Map<String, String> _jamaat = {..._dhakaDefaults};")
          text = text.replace("""      if (!foundLegacyValue) {
        for (final prayer in prayers) {
          _jamaat[prayer] = '--:--';
        }
      }""", """      if (!foundLegacyValue) {
        for (final prayer in prayers) {
          _jamaat[prayer] = _dhakaDefaults[prayer]!;
        }
      }""")
          text = text.replace("""  /// No calculated/default Jamaat time exists unless the user configured one.
  static String defaultTime(String prayer) => '--:--';

  static bool isCustom(String prayer) => _customPrayers.contains(prayer);""", """  /// Dhaka reference defaults used until the user sets a local mosque time.
  static String defaultTime(String prayer) => _dhakaDefaults[prayer] ?? '--:--';

  static bool isDhakaDefault(String prayer) =>
      get(prayer) == defaultTime(prayer) && !_customPrayers.contains(prayer);

  static bool isCustom(String prayer) => _customPrayers.contains(prayer);""")
          text = text.replace("""      _customPrayers.remove(prayer);
      _jamaat[prayer] = '--:--';""", """      _customPrayers.remove(prayer);
      _jamaat[prayer] = _dhakaDefaults[prayer]!;""")
          text = text.replace("""      _customPrayers.remove(prayer);
      _jamaat[prayer] = '--:--';
      await prefs.remove('$_customPrefix$prayer');""", """      _customPrayers.remove(prayer);
      _jamaat[prayer] = _dhakaDefaults[prayer]!;
      await prefs.remove('$_customPrefix$prayer');""")
          service.write_text(text, encoding='utf-8')

          provider = Path('lib/providers/settings_provider.dart')
          text = provider.read_text(encoding='utf-8')
          replacements = {
            "prefs.getString(_fajrJamaatKey) ?? '5:00'": "prefs.getString(_fajrJamaatKey) ?? '5:00 AM'",
            "fallback: '5:00',": "fallback: '5:00 AM',",
            "prefs.getString(_dhuhrJamaatKey) ?? '1:30'": "prefs.getString(_dhuhrJamaatKey) ?? '1:30 PM'",
            "fallback: '1:30',": "fallback: '1:30 PM',",
            "prefs.getString(_asrJamaatKey) ?? '5:15'": "prefs.getString(_asrJamaatKey) ?? '5:15 PM'",
            "fallback: '5:15',": "fallback: '5:15 PM',",
            "prefs.getString(_maghribJamaatKey) ?? '6:57'": "prefs.getString(_maghribJamaatKey) ?? '6:57 PM'",
            "fallback: '6:57',": "fallback: '6:57 PM',",
            "prefs.getString(_ishaJamaatKey) ?? '8:45'": "prefs.getString(_ishaJamaatKey) ?? '8:45 PM'",
            "fallback: '8:45',": "fallback: '8:45 PM',",
            "_fajrJamaat = '5:00';": "_fajrJamaat = '5:00 AM';",
            "_dhuhrJamaat = '1:30';": "_dhuhrJamaat = '1:30 PM';",
            "_asrJamaat = '5:15';": "_asrJamaat = '5:15 PM';",
            "_maghribJamaat = '6:57';": "_maghribJamaat = '6:57 PM';",
            "_ishaJamaat = '8:45';": "_ishaJamaat = '8:45 PM';",
          }
          for old, new in replacements.items():
            text = text.replace(old, new)
          provider.write_text(text, encoding='utf-8')

          picker = Path('lib/screens/prayer/jamaat_settings_screen.dart')
          text = picker.read_text(encoding='utf-8')
          text = text.replace("import '../../providers/settings_provider.dart';", "import '../../providers/settings_provider.dart';\nimport '../../services/jamaat_service.dart';")
          text = text.replace("""          initialTime: _parseTime(context.read<SettingsProvider>().getJamaat(prayer)),
        ),""", """          initialTime: _parseTime(context.read<SettingsProvider>().getJamaat(prayer)),
          is24Hour: context.read<SettingsProvider>().is24Hour,
        ),""")
          text = text.replace("""                time: settings.getJamaat(prayer),
                isEnglish: isEnglish,""", """                time: _displayTime(settings.getJamaat(prayer), settings.is24Hour),
                isEnglish: isEnglish,
                isDhakaDefault: JamaatService.isDhakaDefault(prayer),""")
          text = text.replace("""  }
}

class _JamaatTimeCard""", """  }

  String _displayTime(String value, bool is24Hour) {
    final parsed = _parseTime(value);
    if (parsed == null) return '--:--';
    return _formatTime(parsed, is24Hour);
  }
}

class _JamaatTimeCard""", 1)
          text = text.replace("""  final bool isEnglish;
  final VoidCallback onTap;""", """  final bool isEnglish;
  final bool isDhakaDefault;
  final VoidCallback onTap;""")
          text = text.replace("""    required this.isEnglish,
    required this.onTap,""", """    required this.isEnglish,
    required this.isDhakaDefault,
    required this.onTap,""")
          text = text.replace("""isEnglish ? 'Tap to set local Jamaat time' : 'ট্যাপ করে স্থানীয় জামাআতের সময় সেট করুন'""", """isDhakaDefault
                          ? (isEnglish ? 'Dhaka default time • Tap to change' : 'ঢাকার ডিফল্ট সময় • ট্যাপ করে পরিবর্তন করুন')
                          : (isEnglish ? 'Local mosque time • Tap to change' : 'আপনার এলাকার মসজিদের সময় • ট্যাপ করে পরিবর্তন করুন')""")
          text = text.replace("""  final TimeOfDay? initialTime;

  const _JamaatTimePickerScreen({""", """  final TimeOfDay? initialTime;
  final bool is24Hour;

  const _JamaatTimePickerScreen({""")
          text = text.replace("""    required this.initialTime,
  });""", """    required this.initialTime,
    required this.is24Hour,
  });""")
          text = text.replace("_hour = initial.hourOfPeriod == 0 ? 12 : initial.hourOfPeriod;", "_hour = widget.is24Hour ? initial.hour : (initial.hourOfPeriod == 0 ? 12 : initial.hourOfPeriod);")
          picker.write_text(text, encoding='utf-8')

          print('Jamaat synchronization applied')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add lib/services/jamaat_service.dart lib/providers/settings_provider.dart lib/screens/prayer/jamaat_settings_screen.dart
          git commit -m "Sync Jamaat defaults with local mosque settings"
          git push
