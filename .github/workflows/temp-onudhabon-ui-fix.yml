name: Temporary Onudhabon UI Polish

on:
  push:
    paths:
      - '.github/workflows/temp-onudhabon-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prayer-completion-tracker
          fetch-depth: 0

      - name: Patch Onudhabon reader UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/quran/onudhabon_quran_reader.dart')
          text = path.read_text(encoding='utf-8')

          # Remove the duplicate text-size button from the Surah header.
          duplicate = """              IconButton(
                onPressed: _showReadingSettings,
                icon: const Icon(Icons.text_fields_rounded, size: 19),
              ),
"""
          if text.count(duplicate) != 1:
              raise SystemExit(f'Expected one duplicate header text-size button, found {text.count(duplicate)}')
          text = text.replace(duplicate, '', 1)

          # Replace the translation/tafsir selector row with a compact premium
          # Tafsir show/hide action underneath it.
          row = """          Row(
            children: [
              Expanded(
                child: OutlinedButton.icon(
                  onPressed: () => _showTranslationPicker(surah),
                  icon: const Icon(Icons.translate_rounded, size: 17),
                  label: Text(_translationEdition.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                ),
              ),
              const SizedBox(width: 8),
              Expanded(
                child: OutlinedButton.icon(
                  onPressed: () => _showTafsirPicker(surah),
                  icon: const Icon(Icons.menu_book_rounded, size: 17),
                  label: const Text('তাফসির / ব্যাখ্যা', maxLines: 1),
                ),
              ),
            ],
          ),
"""
          if text.count(row) != 1:
              raise SystemExit(f'Expected one selector row, found {text.count(row)}')

          replacement = row + """          const SizedBox(height: 7),
          Align(
            alignment: Alignment.centerRight,
            child: OutlinedButton.icon(
              onPressed: () {
                setState(() => _showTafsir = !_showTafsir);
                _saveSettings();
              },
              icon: Icon(
                _showTafsir ? Icons.visibility_off_rounded : Icons.visibility_rounded,
                size: 16,
              ),
              label: Text(
                _showTafsir ? 'তাফসির লুকান' : 'তাফসির দেখান',
                style: const TextStyle(fontSize: 12.5, fontWeight: FontWeight.w700),
              ),
              style: OutlinedButton.styleFrom(
                minimumSize: const Size(0, 34),
                padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 6),
                tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                side: BorderSide(color: primary.withValues(alpha: .28), width: 1.1),
                backgroundColor: primary.withValues(alpha: .045),
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(12),
                ),
              ),
            ),
          ),
"""
          text = text.replace(row, replacement, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          print('Onudhabon UI polish applied.')

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/quran/onudhabon_quran_reader.dart
          git commit -m "Polish Onudhabon reading controls" || exit 0
          git push origin HEAD:fix/prayer-completion-tracker
