name: NurVerse Typography Normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'typography normalization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply typography system and Text Size settings
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/more_screen.dart')
          text = path.read_text(encoding='utf-8')

          if "../providers/text_scale_provider.dart" not in text:
              text = text.replace(
                  "import '../providers/settings_provider.dart';",
                  "import '../providers/settings_provider.dart';\nimport '../providers/text_scale_provider.dart';",
                  1,
              )

          old_top = '''              _buildSettingTile(
                context,
                icon: Icons.text_fields_rounded,
                title: isEnglish ? 'Reading & Font' : 'পাঠ ও ফন্ট',
                subtitle:
                    isEnglish
                        ? 'Quran and translation appearance'
                        : 'কুরআন ও অনুবাদের লেখার আকার',
                trailing: Icons.arrow_forward_ios_rounded,
                onTap: () {
                  _showReadingSettings(context, settings);
                },
              ),'''
          new_top = '''              _buildSettingTile(
                context,
                icon: Icons.format_size_rounded,
                title: isEnglish ? 'Text Size' : 'টেক্সট সাইজ',
                subtitle: context.watch<TextScaleProvider>().label == 'স্বাভাবিক'
                    ? (isEnglish ? 'Normal' : 'স্বাভাবিক')
                    : (isEnglish
                        ? context.watch<TextScaleProvider>().label
                        : context.watch<TextScaleProvider>().label),
                trailing: Icons.arrow_forward_ios_rounded,
                onTap: () {
                  _showTextSizeSettings(context);
                },
              ),'''
          if old_top in text:
              text = text.replace(old_top, new_top, 1)

          # Remove the duplicate Quran-reading font setting tile. Keep the rest
          # of the Quran section (translations, recitations, goals, etc.).
          quran_tile = '''              _buildSettingTile(
                context,
                icon: Icons.format_size_rounded,
                title: isEnglish ? 'Quran Reading' : 'কুরআন পড়ার সেটিংস',
                subtitle:
                    isEnglish
                        ? 'Arabic and translation font size'
                        : 'আরবি ও অনুবাদের ফন্ট সাইজ',
                onTap: () {
                  _showReadingSettings(context, settings);
                },
              ),
              _buildDivider(),
'''
          if quran_tile in text:
              text = text.replace(quran_tile, '', 1)

          # Replace the old dummy Quran-specific settings sheet with the one
          # app-wide Text Size control.
          start = text.find('  // ========================================================================\n  // READING SETTINGS')
          end = text.find('  // ========================================================================\n  // CALCULATION METHOD', start)
          if start != -1 and end != -1:
              replacement = '''  // ========================================================================
  // APP-WIDE TEXT SIZE
  // ========================================================================

  void _showTextSizeSettings(BuildContext context) {
    final isEnglish = context.read<SettingsProvider>().languageCode == 'en';

    showModalBottomSheet(
      context: context,
      isScrollControlled: true,
      backgroundColor: Colors.transparent,
      builder: (sheetContext) {
        return _sheetContainer(
          context,
          child: Consumer<TextScaleProvider>(
            builder: (context, textScale, _) {
              final labels = isEnglish
                  ? const ['Small', 'Normal', 'Large', 'Very Large']
                  : const ['ছোট', 'স্বাভাবিক', 'বড়', 'খুব বড়'];

              return Column(
                mainAxisSize: MainAxisSize.min,
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  _sheetHandle(context),
                  const SizedBox(height: 18),
                  Text(
                    isEnglish ? 'Text Size' : 'টেক্সট সাইজ',
                    style: Theme.of(context).textTheme.titleLarge?.copyWith(
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                  const SizedBox(height: 6),
                  Text(
                    isEnglish
                        ? 'Adjust the text size across the entire NurVerse app.'
                        : 'পুরো NurVerse অ্যাপের সব লেখার আকার একসাথে পরিবর্তন করুন।',
                    style: Theme.of(context).textTheme.bodyMedium,
                  ),
                  const SizedBox(height: 18),
                  ...List.generate(labels.length, (index) {
                    final selected = textScale.level == index;
                    return Padding(
                      padding: const EdgeInsets.only(bottom: 8),
                      child: Material(
                        color: Colors.transparent,
                        child: InkWell(
                          borderRadius: BorderRadius.circular(16),
                          onTap: () async {
                            await textScale.setLevel(index);
                            if (sheetContext.mounted) {
                              Navigator.pop(sheetContext);
                            }
                          },
                          child: Container(
                            padding: const EdgeInsets.symmetric(
                              horizontal: 14,
                              vertical: 13,
                            ),
                            decoration: BoxDecoration(
                              color: selected
                                  ? AppColors.seaBlue.withValues(alpha: .08)
                                  : Theme.of(context).cardColor,
                              borderRadius: BorderRadius.circular(16),
                              border: Border.all(
                                color: selected
                                    ? AppColors.seaBlue.withValues(alpha: .28)
                                    : Theme.of(context)
                                        .dividerColor
                                        .withValues(alpha: .45),
                              ),
                            ),
                            child: Row(
                              children: [
                                Expanded(
                                  child: Text(
                                    labels[index],
                                    style: const TextStyle(
                                      fontSize: 14,
                                      fontWeight: FontWeight.w800,
                                    ),
                                  ),
                                ),
                                if (selected)
                                  const Icon(
                                    Icons.check_circle_rounded,
                                    color: AppColors.seaBlue,
                                    size: 21,
                                  )
                                else
                                  Icon(
                                    Icons.radio_button_off_rounded,
                                    color: Theme.of(context)
                                        .iconTheme
                                        .color
                                        ?.withValues(alpha: .35),
                                    size: 21,
                                  ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    );
                  }),
                  const SizedBox(height: 4),
                  Text(
                    isEnglish
                        ? 'Normal is the default NurVerse text size.'
                        : 'স্বাভাবিক হলো NurVerse-এর ডিফল্ট টেক্সট সাইজ।',
                    style: Theme.of(context).textTheme.bodySmall,
                  ),
                  const SizedBox(height: 8),
                ],
              );
            },
          ),
        );
      },
    );
  }

'''
              text = text[:start] + replacement + text[end:]

          # Existing tiny settings labels are brought up to the locked Normal
          # baseline. The global scaler still allows Small to be slightly lower.
          text = text.replace('fontSize: 10.5,', 'fontSize: 13,')
          text = text.replace('fontSize: 10,', 'fontSize: 13,')
          text = text.replace('fontSize: 11,', 'fontSize: 13,')
          text = text.replace('fontSize: 12,', 'fontSize: 13,')
          text = text.replace('fontSize: 7,', 'fontSize: 10,')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit typography normalization
        run: |
          git config user.name "NurVerse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/more_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Apply typography normalization"
          git push

      - name: Remove one-time workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/typography_normalization.yml
          git commit -m "Remove one-time typography workflow"
          git push
