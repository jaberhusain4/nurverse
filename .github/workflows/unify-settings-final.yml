name: One-time Settings unification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify Settings UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          v4 = Path('lib/screens/settings_hub_screen_v4.dart')
          s = v4.read_text(encoding='utf-8')

          # Add time format immediately after Show seconds.
          marker = "_divider(), _switchTile(context, Icons.timer_outlined, _t(languageCode, 'সেকেন্ড দেখান', 'Show seconds'), _t(languageCode, 'যেখানে সমর্থিত সেখানে সেকেন্ড দেখাবে', 'Show seconds where supported'), settings.showSeconds, settings.toggleShowSeconds),"
          if marker in s and "_t(languageCode, 'সময় ফরম্যাট', 'Time Format')" not in s:
              s = s.replace(marker, marker + "\n          _divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'সময় ফরম্যাট', 'Time Format'), settings.is24Hour ? _t(languageCode, '২৪ ঘণ্টা', '24-hour') : _t(languageCode, '১২ ঘণ্টা', '12-hour'), () => _showChoiceSheet(context, _t(languageCode, 'সময় ফরম্যাট', 'Time Format'), const ['12', '24'], settings.setTimeFormat, selectedValue: settings.timeFormat)),", 1)

          # Replace Jamaat navigation with inline editable Jamaat controls.
          old = "_divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'জামাতের সময়', 'Jamaat Times'), _t(languageCode, 'নিজের এলাকার জামাতের সময় সেট করুন', 'Set local Jamaat times'), () { Navigator.of(context).push(MaterialPageRoute<void>(builder: (_) => const JamaatSettingsScreen())); }),"
          new = """_divider(), _jamaatTile(context, settings, 'Fajr', _t(languageCode, 'ফজর', 'Fajr'), settings.fajrJamaat),
          _divider(), _jamaatTile(context, settings, 'Dhuhr', _t(languageCode, 'যোহর / জুমু\'আ', 'Dhuhr / Jumu\'ah'), settings.dhuhrJamaat),
          _divider(), _jamaatTile(context, settings, 'Asr', _t(languageCode, 'আসর', 'Asr'), settings.asrJamaat),
          _divider(), _jamaatTile(context, settings, 'Maghrib', _t(languageCode, 'মাগরিব', 'Maghrib'), settings.maghribJamaat),
          _divider(), _jamaatTile(context, settings, 'Isha', _t(languageCode, 'ইশা', 'Isha'), settings.ishaJamaat),"""
          if old in s:
              s = s.replace(old, new, 1)

          # Add Location + prayer adjustments to Prayer & Adhan.
          anchor = "_divider(), _tile(context, Icons.calendar_today_outlined, _t(languageCode, 'হিজরি তারিখ সমন্বয়', 'Hijri Date Adjustment'), _hijriAdjustmentLabel(settings, languageCode), () => _showHijriAdjustmentSheet(context, settings)),"
          additions = """_divider(), _tile(context, Icons.location_on_outlined, _t(languageCode, 'লোকেশন', 'Location'), settings.autoLocation ? _t(languageCode, 'স্বয়ংক্রিয়', 'Automatic') : _t(languageCode, 'ম্যানুয়াল', 'Manual'), () => _showChoiceSheet(context, _t(languageCode, 'লোকেশন', 'Location'), const ['automatic', 'manual'], settings.setLocationMode, selectedValue: settings.locationMode)),
          _divider(), _tile(context, Icons.tune_rounded, _t(languageCode, 'সালাতের সময় সমন্বয়', 'Prayer Adjustments'), _t(languageCode, 'প্রতিটি ওয়াক্তে ±৬০ মিনিট সমন্বয়', 'Adjust each prayer by ±60 minutes'), () => _showPrayerAdjustmentsSheet(context, settings)),
          _divider(), """
          if anchor in s and "_showPrayerAdjustmentsSheet(context, settings)" not in s:
              s = s.replace(anchor, additions + anchor, 1)

          # Remove now-unused Jamaat screen import.
          s = s.replace("import 'prayer/jamaat_settings_screen.dart';\n", "")

          # Insert Jamaat helper methods before _section.
          helper_marker = "  Widget _section(BuildContext context, String title, IconData icon, List<Widget> children) =>"
          if helper_marker in s and "Widget _jamaatTile(" not in s:
              helpers = r'''  Widget _jamaatTile(BuildContext context, SettingsProvider settings, String prayer, String title, String value) {
    return _tile(context, Icons.access_time_rounded, title, value, () => _showJamaatTimeDialog(context, settings, prayer, title));
  }

  Future<void> _showJamaatTimeDialog(BuildContext context, SettingsProvider settings, String prayer, String title) async {
    final controller = TextEditingController(text: settings.getJamaat(prayer));
    String? error;
    await showDialog<void>(
      context: context,
      builder: (dialogContext) => StatefulBuilder(
        builder: (dialogContext, setState) => AlertDialog(
          title: Text('$title জামাতের সময়'),
          content: TextField(
            controller: controller,
            keyboardType: TextInputType.text,
            decoration: InputDecoration(
              labelText: 'সময়',
              hintText: settings.is24Hour ? 'যেমন 17:00' : 'যেমন 5:00 PM',
              errorText: error,
            ),
          ),
          actions: [
            TextButton(onPressed: () => Navigator.pop(dialogContext), child: const Text('বাতিল')),
            FilledButton(
              onPressed: () async {
                final ok = await settings.setJamaatTime(prayer, controller.text);
                if (ok) {
                  if (dialogContext.mounted) Navigator.pop(dialogContext);
                } else {
                  setState(() => error = 'সঠিক সময় দিন, যেমন 5:00 PM বা 17:00');
                }
              },
              child: const Text('সংরক্ষণ'),
            ),
          ],
        ),
      ),
    );
    controller.dispose();
  }

  Future<void> _showPrayerAdjustmentsSheet(BuildContext context, SettingsProvider settings) async {
    await showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      showDragHandle: true,
      builder: (sheetContext) => SafeArea(
        child: Padding(
          padding: const EdgeInsets.fromLTRB(18, 8, 18, 24),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              Text(_t(settings.languageCode, 'সালাতের সময় সমন্বয়', 'Prayer Adjustments'), style: Theme.of(sheetContext).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.w900)),
              const SizedBox(height: 12),
              for (final prayer in const ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'])
                ListTile(
                  title: Text(_t(settings.languageCode, prayer == 'Dhuhr' ? 'যোহর' : prayer, prayer)),
                  subtitle: Text('${settings.prayerAdjustments[prayer] ?? 0} মিনিট'),
                  trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                    IconButton(onPressed: () => settings.setPrayerAdjustment(prayer, (settings.prayerAdjustments[prayer] ?? 0) - 1), icon: const Icon(Icons.remove_circle_outline)),
                    IconButton(onPressed: () => settings.setPrayerAdjustment(prayer, (settings.prayerAdjustments[prayer] ?? 0) + 1), icon: const Icon(Icons.add_circle_outline)),
                  ]),
                ),
              TextButton(onPressed: () => settings.resetPrayerAdjustments(), child: Text(_t(settings.languageCode, 'সব রিসেট', 'Reset all'))),
            ],
          ),
        ),
      ),
    );
  }

'''
              s = s.replace(helper_marker, helpers + helper_marker, 1)

          v4.write_text(s, encoding='utf-8')

          # Make the old SettingsScreen a compatibility wrapper only.
          legacy = Path('lib/screens/settings/settings_screen.dart')
          legacy.write_text("""import 'package:flutter/material.dart';\n\nimport '../settings_hub_screen_v4.dart';\n\n/// Compatibility entry point. SettingsHubScreenV4 is the single canonical Settings UI.\nclass SettingsScreen extends StatelessWidget {\n  const SettingsScreen({super.key});\n\n  @override\n  Widget build(BuildContext context) => const SettingsHubScreenV4();\n}\n""", encoding='utf-8')

          # Remove this one-time workflow after applying the change.
          Path('.github/workflows/unify-settings-final.yml').unlink(missing_ok=True)
          PY

      - name: Commit unified Settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_hub_screen_v4.dart lib/screens/settings/settings_screen.dart .github/workflows/unify-settings-final.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unify all Settings into one canonical screen"
          git push origin HEAD:main
