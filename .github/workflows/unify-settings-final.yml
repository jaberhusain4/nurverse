name: One-time Settings unification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify Settings UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          v4 = Path('lib/screens/settings_hub_screen_v4.dart')
          s = v4.read_text(encoding='utf-8')

          # Keep the existing V4 premium/login card exactly as the source of truth.
          # Add one localized 12/24-hour setting to the single canonical screen.
          time_marker = "_divider(), _switchTile(context, Icons.timer_outlined, _t(languageCode, 'সেকেন্ড দেখান', 'Show seconds'), _t(languageCode, 'যেখানে সমর্থিত সেখানে সেকেন্ড দেখাবে', 'Show seconds where supported'), settings.showSeconds, settings.toggleShowSeconds),"
          time_tile = "_divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'সময় ফরম্যাট', 'Time Format'), settings.is24Hour ? _t(languageCode, '২৪ ঘণ্টা', '24-hour') : _t(languageCode, '১২ ঘণ্টা', '12-hour'), () => _showChoiceSheet(context, _t(languageCode, 'সময় ফরম্যাট', 'Time Format'), const ['12', '24'], settings.setTimeFormat, selectedValue: settings.timeFormat)),"
          if "_t(languageCode, 'সময় ফরম্যাট', 'Time Format')" not in s and time_marker in s:
              s = s.replace(time_marker, time_marker + "\n          " + time_tile, 1)

          # Put all Jamaat controls on the canonical Settings screen.
          old_jamaat = "_divider(), _tile(context, Icons.access_time_rounded, _t(languageCode, 'জামাতের সময়', 'Jamaat Times'), _t(languageCode, 'নিজের এলাকার জামাতের সময় সেট করুন', 'Set local Jamaat times'), () { Navigator.of(context).push(MaterialPageRoute<void>(builder: (_) => const JamaatSettingsScreen())); }),"
          new_jamaat = """_divider(), _jamaatTile(context, settings, 'Fajr', _t(languageCode, 'ফজর', 'Fajr'), settings.fajrJamaat),
          _divider(), _jamaatTile(context, settings, 'Dhuhr', _t(languageCode, 'যোহর / জুমু\'আ', 'Dhuhr / Jumu\'ah'), settings.dhuhrJamaat),
          _divider(), _jamaatTile(context, settings, 'Asr', _t(languageCode, 'আসর', 'Asr'), settings.asrJamaat),
          _divider(), _jamaatTile(context, settings, 'Maghrib', _t(languageCode, 'মাগরিব', 'Maghrib'), settings.maghribJamaat),
          _divider(), _jamaatTile(context, settings, 'Isha', _t(languageCode, 'ইশা', 'Isha'), settings.ishaJamaat),"""
          if old_jamaat in s:
              s = s.replace(old_jamaat, new_jamaat, 1)

          # Remove the separate Jamaat navigation import; Jamaat now lives here.
          s = s.replace("import 'prayer/jamaat_settings_screen.dart';\n", "")

          # Add localized inline Jamaat editor helpers.
          helper_marker = "  Widget _section(BuildContext context, String title, IconData icon, List<Widget> children) =>"
          if "Widget _jamaatTile(" not in s and helper_marker in s:
              helpers = r'''  Widget _jamaatTile(BuildContext context, SettingsProvider settings, String prayer, String title, String value) {
    return _tile(context, Icons.access_time_rounded, title, value, () => _showJamaatTimeDialog(context, settings, prayer, title));
  }

  Future<void> _showJamaatTimeDialog(BuildContext context, SettingsProvider settings, String prayer, String title) async {
    final controller = TextEditingController(text: settings.getJamaat(prayer));
    String? error;
    await showDialog<void>(
      context: context,
      builder: (dialogContext) => StatefulBuilder(
        builder: (dialogContext, setState) => AlertDialog(
          title: Text('${title} ${_t(settings.languageCode, 'জামাতের সময়', 'Jamaat Time')}'),
          content: TextField(
            controller: controller,
            keyboardType: TextInputType.text,
            decoration: InputDecoration(
              labelText: _t(settings.languageCode, 'সময়', 'Time'),
              hintText: settings.is24Hour ? '17:00' : '5:00 PM',
              errorText: error,
            ),
          ),
          actions: [
            TextButton(onPressed: () => Navigator.pop(dialogContext), child: Text(_t(settings.languageCode, 'বাতিল', 'Cancel'))),
            FilledButton(
              onPressed: () async {
                final ok = await settings.setJamaatTime(prayer, controller.text);
                if (ok) {
                  if (dialogContext.mounted) Navigator.pop(dialogContext);
                } else {
                  setState(() => error = _t(settings.languageCode, 'সঠিক সময় দিন', 'Enter a valid time'));
                }
              },
              child: Text(_t(settings.languageCode, 'সংরক্ষণ', 'Save')),
            ),
          ],
        ),
      ),
    );
    controller.dispose();
  }

'''
              s = s.replace(helper_marker, helpers + helper_marker, 1)

          v4.write_text(s, encoding='utf-8')

          # Make the old SettingsScreen a compatibility wrapper only.
          legacy = Path('lib/screens/settings/settings_screen.dart')
          legacy.write_text("""import 'package:flutter/material.dart';\n\nimport '../settings_hub_screen_v4.dart';\n\n/// Compatibility entry point. SettingsHubScreenV4 is the single canonical Settings UI.\nclass SettingsScreen extends StatelessWidget {\n  const SettingsScreen({super.key});\n\n  @override\n  Widget build(BuildContext context) => const SettingsHubScreenV4();\n}\n""", encoding='utf-8')

          # This workflow is intentionally one-time.
          Path('.github/workflows/unify-settings-final.yml').unlink(missing_ok=True)
          PY

      - name: Commit unified Settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/settings_hub_screen_v4.dart lib/screens/settings/settings_screen.dart .github/workflows/unify-settings-final.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unify Settings into one localized canonical screen"
          git push origin HEAD:main
