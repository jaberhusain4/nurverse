name: nurverse
description: "NurVerse - Islamic Lifestyle App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.3.1

  # Localization
  intl: ^0.20.2

  # State Management
  provider: ^6.1.5

  # Local Storage
  shared_preferences: ^2.5.3

  # share plus
  share_plus: ^12.0.1

  # External links
  url_launcher: ^6.3.2

  # Network
  http: ^1.5.0

  # Location
  geolocator: ^14.0.2

  adhan: ^2.0.0

  hijri: ^3.0.0

  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # Compass (Qibla)
  flutter_compass: ^0.8.0

  # Notifications
  flutter_local_notifications: ^19.1.0

  pdfx: ^2.9.2

  # Audio (Audio Quran)
  just_audio: ^0.9.42

  # File paths for offline caching (Hadith / Quran translation / Audio downloads)
  path_provider: ^2.1.5
  path: ^1.9.0
  geocoding: ^3.0.0

  # Additional
  # Keep dependencies above sorted by functional group.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#0B4F6C"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"

  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  generate: true

  fonts:
    - family: IndoPakQuran
      fonts:
        - asset: assets/fonts/IndoPakQuran.ttf

  assets:
    - assets/audio/
    - assets/dua/
    - assets/fonts/
    - assets/hadith/
    - assets/icons/
    - assets/images/
    - assets/json/
    - assets/quran/
    - assets/ruqyah/
    - assets/tafsir/
    - assets/translations/
