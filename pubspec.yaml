name: nurverse
description: A premium Islamic companion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  adhan: ^2.0.0+1
  intl: ^0.20.2
  hijri: ^3.0.0
  vibration: ^3.1.3
  permission_handler: ^12.0.0
  flutter_compass: ^0.8.1
  sensors_plus: ^6.1.1
  audioplayers: ^6.5.0
  just_audio: ^0.10.5
  record: ^6.1.2
  share_plus: ^12.0.1
  pdfx: ^2.9.2
  webview_flutter: ^4.13.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  http: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.2.0
  flutter_cache_manager: ^3.4.1
  esmaulhusna_muslimbg: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  generate: true

  fonts:
    - family: IndoPakQuran
      fonts:
        - asset: assets/fonts/IndoPakQuran.ttf

  assets:
    - assets/fonts/
    - assets/hadith/
    - assets/icons/
    - assets/images/
    - assets/quran/
